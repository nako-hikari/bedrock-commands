<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Editor</title>

    <style>
        :root {
            --bg: #0e0e11;
            --card: #18181f;
            --input: #0f0f12;
            --border: #2d2d38;
            --text: #b4b4bc;
            --bright: #ffffff;
            --accent: #663657;
            --accent-hover: #81456e;
            --danger: #4a2323;
            --danger-hover: #6e3333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .wrapper {
            width: 100%;
            max-width: 950px;
            margin: auto;
        }

        h1 {
            color: var(--bright);
            font-size: 1.4rem;
            margin: 0 0 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-button {
            width: 100%;
            text-align: left;
            background: var(--input);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .file-button:hover {
            border-color: var(--accent);
            color: var(--bright);
        }

        .editor {
            display: none;
        }

        .editor.active {
            display: block;
        }

        .filename {
            color: var(--bright);
            font-weight: 600;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            min-height: 400px;
            resize: vertical;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #c77e4f;
            padding: 12px;
            font-family:
                ui-monospace,
                "SF Mono",
                "JetBrains Mono",
                monospace;
            font-size: 13px;
            line-height: 1.5;
            outline: none;
        }

        textarea:focus {
            border-color: #a77a99;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 4px;
            padding: 9px 14px;
            color: white;
            background: var(--accent);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .secondary {
            background: var(--input);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .secondary:hover {
            border-color: var(--accent);
            color: var(--bright);
        }

        .danger {
            background: var(--danger);
        }

        .danger:hover {
            background: var(--danger-hover);
        }

        .empty {
            text-align: center;
            color: #5a5a66;
            padding: 30px;
        }

        .status {
            margin-top: 12px;
            font-size: 13px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .modal h2 {
            color: var(--bright);
            font-size: 18px;
            margin: 0;
        }

        .modal p {
            font-size: 13px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>

<div class="wrapper">

    <h1>Command Editor</h1>

    <div class="card">
        <div id="file-list">
            Loading approved creations...
        </div>
    </div>

    <div class="card editor" id="editor">

        <div class="filename" id="filename"></div>

        <textarea id="content"></textarea>

        <div class="actions">
            <button
                class="secondary"
                onclick="closeEditor()">
                EXIT
            </button>

            <button
                class="danger"
                onclick="requestOutdated()">
                OUTDATED
            </button>

            <button
                onclick="requestSave()">
                SAVE
            </button>
        </div>

        <div class="status" id="status"></div>

    </div>

</div>

<div class="modal-overlay" id="modal-overlay">

    <div class="modal">

        <h2 id="modal-title">
            Confirm
        </h2>

        <p id="modal-message">
            Are you sure?
        </p>

        <div
            class="modal-actions"
            id="modal-actions">
        </div>

    </div>

</div>

<script>

let selectedFilename = null;
let adminKey = null;

function requestAdminKey() {

    adminKey = prompt("Enter editor key:");

    if (!adminKey) {

        document.getElementById("file-list").innerHTML =
            '<div class="empty">Editor key required.</div>';

        return false;
    }

    return true;
}

async function loadFiles() {

    const container =
        document.getElementById("file-list");

    if (!requestAdminKey()) {
        return;
    }

    try {

        const response =
            await fetch("/api/files");

        if (!response.ok) {
            throw new Error(
                "Failed to load approved creations"
            );
        }

        const files =
            await response.json();

        if (!files.length) {

            container.innerHTML =
                '<div class="empty">No approved creations.</div>';

            return;
        }

        container.innerHTML = "";

        files.forEach(file => {

            const button =
                document.createElement("button");

            button.className =
                "file-button";

            button.textContent =
                file.name;

            button.onclick = () => {
                openEditor(file.name);
            };

            container.appendChild(button);

        });

    } catch (error) {

        container.innerHTML =
            `<div class="empty">
                ${escapeHtml(error.message)}
            </div>`;
    }
}

async function openEditor(filename) {

    try {

        const response =
            await fetch(
                "/api/file?filename=" +
                encodeURIComponent(filename)
            );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "Failed to open file"
            );
        }

        selectedFilename =
            filename;

        document.getElementById("filename")
            .textContent =
            filename;

        document.getElementById("content")
            .value =
            result.content;

        document.getElementById("status")
            .textContent = "";

        document.getElementById("editor")
            .classList.add("active");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch (error) {

        alert(
            "Could not open file:\n" +
            error.message
        );
    }
}

function closeEditor() {

    selectedFilename = null;

    document.getElementById("editor")
        .classList.remove("active");
}

function requestSave() {

    if (!selectedFilename) {
        return;
    }

    showModal(
        "Save changes?",
        "Make sure everything is correct before saving. This will replace the current version of this creation.",
        [
            {
                label: "LET ME CHECK",
                className: "secondary",
                action: closeModal
            },
            {
                label: "SAVE",
                action: confirmSave
            }
        ]
    );
}

async function confirmSave() {

    closeModal();

    const content =
        document.getElementById("content").value;

    const status =
        document.getElementById("status");

    status.textContent =
        "Saving...";

    try {

        const response =
            await fetch("/api/edit", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    adminKey: adminKey,
                    filename: selectedFilename,
                    content: content
                })

            });

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.details ||
                result.error ||
                "Save failed"
            );
        }

        status.textContent =
            "Saved successfully.";

        showModal(
            "Saved successfully",
            "The command creation has been updated.",
            [
                {
                    label: "OK",
                    action: closeModal
                }
            ]
        );

    } catch (error) {

        status.textContent =
            "Save failed.";

        showModal(
            "Save failed",
            error.message,
            [
                {
                    label: "CLOSE",
                    className: "danger",
                    action: closeModal
                }
            ]
        );
    }
}

function requestOutdated() {

    if (!selectedFilename) {
        return;
    }

    showModal(
        "Mark as outdated?",
        "This will move this command creation to the outdated folder and remove it from the main command list.",
        [
            {
                label: "LET ME CHECK",
                className: "secondary",
                action: closeModal
            },
            {
                label: "OUTDATED",
                className: "danger",
                action: confirmOutdated
            }
        ]
    );
}

async function confirmOutdated() {

    closeModal();

    const status =
        document.getElementById("status");

    status.textContent =
        "Moving to outdated...";

    try {

        const response =
            await fetch("/api/outdated", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    adminKey: adminKey,
                    filename: selectedFilename
                })

            });

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.details ||
                result.error ||
                "Failed to mark as outdated"
            );
        }

        showModal(
            "Marked as outdated",
            "The command creation has been moved to the outdated folder.",
            [
                {
                    label: "OK",
                    action: () => {
                        closeModal();
                        closeEditor();
                        loadFiles();
                    }
                }
            ]
        );

    } catch (error) {

        status.textContent =
            "Failed to move to outdated.";

        showModal(
            "Failed",
            error.message,
            [
                {
                    label: "CLOSE",
                    className: "danger",
                    action: closeModal
                }
            ]
        );
    }
}

function showModal(
    title,
    message,
    actions
) {

    document.getElementById("modal-title")
        .textContent =
        title;

    document.getElementById("modal-message")
        .textContent =
        message;

    const actionsContainer =
        document.getElementById("modal-actions");

    actionsContainer.innerHTML = "";

    actions.forEach(action => {

        const button =
            document.createElement("button");

        button.textContent =
            action.label;

        if (action.className) {
            button.className =
                action.className;
        }

        button.onclick =
            action.action;

        actionsContainer.appendChild(button);

    });

    document.getElementById("modal-overlay")
        .classList.add("active");
}

function closeModal() {

    document.getElementById("modal-overlay")
        .classList.remove("active");
}

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}

loadFiles();

</script>

</body>
</html>

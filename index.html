<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Block Creation</title>
    <link rel="stylesheet" href="/css/nako.css">
    <style>
        .footer-links a.social {
            opacity: 0.85;
            transition: opacity var(--transition-fast, 0.15s), color var(--transition-fast, 0.15s);
        }
        .footer-links a.social:hover {
            opacity: 1;
        }
        #footer-brand {
            opacity: 1;
            transition: opacity var(--transition-fast, 0.15s);
        }
        #footer-brand.dimmed {
            opacity: 0.5;
        }
        .author-credit-bar {
            background: var(--input-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: var(--space-sm) var(--space-md);
            font-size: var(--fs-sm);
            color: var(--accent-light);
            font-weight: var(--fw-bold, var(--fw-semibold));
            margin-bottom: var(--space-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .author-credit-bar.with-disclaimer {
            flex-direction: column;
            align-items: flex-start;
            gap: var(--space-xs);
        }
        .author-credit-disclaimer {
            font-size: var(--fs-xs);
            color: var(--text-main);
            font-weight: normal;
            font-style: italic;
            line-height: var(--lh-normal);
        }
        .grid-card-credit {
            font-size: var(--fs-xs);
            color: var(--accent-light);
            font-weight: var(--fw-bold, var(--fw-semibold));
        }
        .inline-code {
            background: rgba(255, 255, 255, 0.1);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
        }
        [data-theme="light"] .inline-code {
            background: rgba(70, 140, 230, 0.1);
        }
        /* Force the page to lay out from the top instead of vertically
           centering short content, so the header never drifts down. */
        html, body {
            min-height: 100vh;
            height: auto !important;
        }
        body {
            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-start !important;
            align-items: stretch !important;
        }
        /* Header scrolls away normally now — it's no longer sticky. */
        .wrapper header {
            border-bottom: var(--border-width) solid var(--border-color);
        }
        /* Theme toggle + Upload share one fixed, non-scrolling anchor point
           (same pattern as the formatter's expand/theme pair) so they can't
           overlap or drift apart, and both stay put while the page scrolls. */
        .theme-toggle-row {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }
        #upload-nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-banner-wrap {
            width: 100%;
            margin: var(--space-xs) 0 var(--space-lg);
        }
        .hero-banner-wrap img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 2000 / 600;
            object-fit: contain;
            /* This is real content artwork, not UI chrome — never invert
               or filter it when the theme switches. */
            filter: none !important;
        }
        /* Belt-and-braces: any genuine content image (creation images,
           avatars, command-block textures) is exempt from theme filtering,
           regardless of whichever mechanism nako.css uses for dark/light. */
        .content-image, .content-image * {
            filter: none !important;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="theme-toggle-row">
            <button class="theme-toggle interactive" onclick="toggleTheme()" aria-label="Toggle theme">
                <img id="theme-icon" class="icon" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/moon.png" alt="">
            </button>
            <a href="upload/formatter.html" class="theme-toggle interactive" id="upload-nav-btn" title="Upload Formatter" style="text-decoration: none;">
                <img class="icon icon-lg" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/upload.png" alt="Upload">
            </a>
        </div>

        <header style="padding-bottom: var(--space-md); margin-bottom: var(--space-lg);">
            <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; position: relative;">
                <div style="display: flex; align-items: center; gap: var(--space-sm);">
                    <button id="back-btn" class="icon-button interactive" onclick="handleBack()" aria-label="Back">
                        <img class="icon icon-lg" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/back_arrow.png" alt="Back">
                    </button>
                </div>
                <h1 id="app-display-header" style="font-size: 1.5rem; margin: 0 auto; text-align: center; cursor: pointer;" onclick="goHome()">Command Block Creation</h1>
                <div style="width: 40px;"></div>
            </div>
        </header>

        <div class="hero-banner-wrap">
            <img class="content-image" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/bedrock-commands.png" alt="Bedrock Commands">
        </div>

        <main id="app-view-router-canvas" style="width: 100%;">
             <div style="text-align: center; color: var(--text-main); padding: 40px;">Scanning workspace directories...</div>
        </main>


        <div class="footer">
            <div id="bottom-author-credit"></div>
            <div id="footer-brand">
                <div class="footer-title">By Nako Hikari</div>
                <div class="footer-links">
                    <a href="https://github.com/nako-hikari/" target="_blank" class="social">
                        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" alt="GitHub">
                        GitHub
                    </a>
                    <a href="https://m.youtube.com/@NaCryst" target="_blank" class="social">
                        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="YouTube">
                        YouTube
                    </a>
                    <a href="https://www.tiktok.com/@nako_hikari_mc" target="_blank" class="social">
                        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg" alt="TikTok">
                        TikTok
                    </a>
                    <a href="https://ko-fi.com/arialicee" target="_blank" class="social kofi">
                        <img src="https://raw.githubusercontent.com/nako-hikari/support-files/main/assets/kofi-icon.png" alt="Ko-fi">
                        Support me on Ko-fi
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_API_URL = "https://api.github.com/repos/nako-hikari/minecraft-bedrock/contents/bedrock-commands";
        const RAW_BASE_URL = "https://raw.githubusercontent.com/nako-hikari/minecraft-bedrock/main/bedrock-commands";
        const ASSETS = "https://raw.githubusercontent.com/nako-hikari/nako-hikari.github.io/main/assets/images";

        let db = [];

        /* THEME TOGGLE — shares the same localStorage key as the formatter
           page, so the preference carries over when navigating between them. */
        function toggleTheme() {
            const root = document.documentElement;
            const btn = document.querySelector('.theme-toggle');
            const icon = document.getElementById('theme-icon');
            const goingLight = root.getAttribute('data-theme') !== 'light';

            btn.classList.add('spinning');
            setTimeout(() => btn.classList.remove('spinning'), 400);

            if (goingLight) {
                root.setAttribute('data-theme', 'light');
                icon.src = 'https://raw.githubusercontent.com/nako-hikari/assets/main/ui/sun.png';
                localStorage.setItem('nako-theme', 'light');
            } else {
                root.removeAttribute('data-theme');
                icon.src = 'https://raw.githubusercontent.com/nako-hikari/assets/main/ui/moon.png';
                localStorage.setItem('nako-theme', 'dark');
            }
        }

        (function() {
            if (localStorage.getItem('nako-theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('theme-icon').src = 'https://raw.githubusercontent.com/nako-hikari/assets/main/ui/sun.png';
            }
        })();

        // Matches a metadata line case/whitespace-tolerantly; returns the trimmed value or null.
        function matchMeta(ln, key) {
            const re = new RegExp('^\\s*' + key + '\\s*:', 'i');
            return re.test(ln) ? ln.replace(re, '').trim() : null;
        }

        // Case-insensitive startsWith, for header tokens like "CMD:CHAT".
        function headIs(str, prefix) {
            return str.toUpperCase().startsWith(prefix.toUpperCase());
        }

        // Scans every line of the file (not just the first paragraph) for metadata.
        function extractMeta(txt, target) {
            txt.split('\n').forEach(ln => {
                let v;
                if ((v = matchMeta(ln, 'TITLE')) !== null) target.title = v;
                if ((v = matchMeta(ln, 'DESC')) !== null) target.desc = v;
                if ((v = matchMeta(ln, 'TAG')) !== null) target.tags = v.split(',').map(t => t.trim());
                if ((v = matchMeta(ln, 'CREDIT')) !== null) target.credit = v;
            });
        }

        window.addEventListener('DOMContentLoaded', initApp);
        window.addEventListener('hashchange', route);

        function handleBack() {
            const currentHash = window.location.hash.replace('#', '').toLowerCase();
            if (currentHash === 'preview') {
                // Go back to wherever the preview was opened from (the formatter),
                // preserving its in-memory draft, instead of dropping to the grid.
                history.back();
                return;
            }
            if (window.location.hash) goHome();
            else window.location.href = 'https://nakohikari.vercel.app';
        }

        const DB_CACHE_KEY = 'nako_db_cache_v1';
        const DATE_CACHE_KEY = 'nako_date_cache_v1';
        let lastLoadFailed = false;

        function readCachedDb() {
            try {
                const raw = localStorage.getItem(DB_CACHE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function writeCachedDb(data) {
            try { localStorage.setItem(DB_CACHE_KEY, JSON.stringify(data)); } catch (e) { /* storage full/unavailable — non-fatal */ }
        }

        function readCachedDates() {
            try {
                const raw = localStorage.getItem(DATE_CACHE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (e) { return {}; }
        }

        function writeCachedDates(map) {
            try { localStorage.setItem(DATE_CACHE_KEY, JSON.stringify(map)); } catch (e) { /* non-fatal */ }
        }

        async function fetchWithRetry(url, attempts = 2, delayMs = 400) {
            let lastErr;
            for (let i = 0; i < attempts; i++) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return res;
                    lastErr = new Error('HTTP ' + res.status);
                    // A 403 here on api.github.com almost always means the
                    // unauthenticated rate limit (60/hr) was hit — retrying
                    // immediately won't help, so bail out to the cache path.
                    if (res.status === 403) break;
                } catch (e) {
                    lastErr = e;
                }
                if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs));
            }
            throw lastErr;
        }

        // Loads the library. Root fix for "sometimes doesn't load, even
        // after refresh": the unauthenticated GitHub API caps out at 60
        // requests/hour, and this used to silently swallow any failure
        // (rate limit or otherwise) and render an empty grid with zero
        // indication of what happened. Now: retry once, fall back to the
        // last successfully cached listing if the live fetch fails, and
        // only show a genuine error state if there's truly nothing to show.
        async function initApp() {
            lastLoadFailed = false;
            try {
                const res = await fetchWithRetry(GITHUB_API_URL);
                const items = await res.json();
                const files = items.filter(i => i.type === 'file' && i.name.endsWith('.txt'));

                db = await Promise.all(files.map(async (f) => {
                    try {
                        const rawRes = await fetchWithRetry(`${RAW_BASE_URL}/${f.name}`);
                        const txt = await rawRes.text();

                        let label = f.name.replace('.txt', '').replace(/_/g, ' ');
                        let entry = {
                            title: label.charAt(0).toUpperCase() + label.slice(1),
                            desc: "No descriptor statement declared in source file.",
                            tags: [],
                            credit: null
                        };
                        extractMeta(txt, entry);

                        return { file: f.name, title: entry.title, desc: entry.desc, tags: entry.tags, credit: entry.credit, payload: txt };
                    } catch {
                        let label = f.name.replace('.txt', '');
                        return { file: f.name, title: label.charAt(0).toUpperCase() + label.slice(1), desc: "Failed to download asset.", tags: [], credit: null, payload: null };
                    }
                }));

                writeCachedDb(db);
            } catch {
                console.warn("GitHub connection fault — falling back to cached library if available.");
                const cached = readCachedDb();
                if (cached && cached.length > 0) {
                    db = cached;
                } else {
                    db = [];
                    lastLoadFailed = true;
                }
            }
            route();
        }

        function route() {
            const hash = decodeURIComponent(window.location.hash.replace('#', '')).trim().toLowerCase();
            const headerTitle = document.getElementById('app-display-header');
            const backBtn = document.getElementById('back-btn');

            if (hash === 'preview') {
                const stored = sessionStorage.getItem('nako_preview_payload');
                if (stored) {
                    if (backBtn) backBtn.style.display = 'flex';
                    let entry = { file: null, title: 'Preview', desc: '', tags: [], credit: null, payload: stored };
                    extractMeta(stored, entry);
                    headerTitle.innerText = entry.title;
                    renderView(entry);
                    return;
                }
            }

            if (hash && db.length > 0) {
                const match = db.find(item => item.file.toLowerCase() === hash || item.file.toLowerCase() === hash + '.txt');
                if (match) {
                    if (backBtn) backBtn.style.display = 'flex';
                    headerTitle.innerText = match.title;
                    if (match.payload) renderView(match);
                    else recoverAsset(match);
                    return;
                }
            }
            if (backBtn) backBtn.style.display = 'flex';
            headerTitle.innerText = "Command Block Creation";
            renderGrid();
        }

        async function recoverAsset(item) {
            const view = document.getElementById('app-view-router-canvas');
            view.innerHTML = `<div style="text-align: center; color: var(--text-main); padding: 40px;">Fetching content payload on-demand...</div>`;
            try {
                const res = await fetch(`${RAW_BASE_URL}/${item.file}`);
                if (!res.ok) throw '';
                item.payload = await res.text();
                
                extractMeta(item.payload, item);
                document.getElementById('app-display-header').innerText = item.title;
                renderView(item);
            } catch {
                view.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <p style="color: var(--accent-light); font-weight: bold;">Could not download ${item.file}</p>
                        <button class="secondary" onclick="goHome()">Back to Dashboard</button>
                    </div>
                `;
            }
        }

        function renderGrid() {
            document.getElementById('bottom-author-credit').innerHTML = '';
            const footerBrand = document.getElementById('footer-brand');
            if (footerBrand) footerBrand.classList.remove('dimmed');

            const canvas = document.getElementById('app-view-router-canvas');

            if (lastLoadFailed) {
                canvas.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <p style="color: var(--accent-light); font-weight: bold;">Couldn't load the library right now.</p>
                        <p style="color: var(--text-main); font-size: 13px; margin-bottom: 16px;">This is usually a temporary connection hiccup. Give it a moment and try again.</p>
                        <button class="secondary interactive" onclick="retryLoad()">Retry</button>
                    </div>
                `;
                return;
            }

            canvas.innerHTML = `
                <div style="width: 100%; margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap;">
                    <input type="text" id="search" style="flex: 1; min-width: 200px;" placeholder="Search by title, tag, or creator..." oninput="filterGrid(this.value)">
                    <select id="sort-select" style="width: auto;" onchange="handleSortChange(this.value)">
                        <option value="title-asc">Title (A-Z)</option>
                        <option value="title-desc">Title (Z-A)</option>
                        <option value="date-desc">Date Added (Newest)</option>
                        <option value="date-asc">Date Added (Oldest)</option>
                    </select>
                </div>
                <div id="grid-box" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;"></div>
            `;
            document.getElementById('search').value = currentSearch;
            document.getElementById('sort-select').value = currentSort;
            refreshGrid();
        }

        function retryLoad() {
            const canvas = document.getElementById('app-view-router-canvas');
            canvas.innerHTML = `<div style="text-align: center; color: var(--text-main); padding: 40px;">Reconnecting...</div>`;
            initApp();
        }

        // Sort/search state; commit dates are fetched lazily and cached on first use.
        let currentSort = 'date-desc';
        let currentSearch = '';

        async function ensureDatesLoaded() {
            const dateCache = readCachedDates();
            let cacheDirty = false;

            db.forEach(item => {
                if (item.dateAdded === undefined && dateCache[item.file] !== undefined) {
                    item.dateAdded = dateCache[item.file];
                }
            });

            const missing = db.filter(i => i.dateAdded === undefined);
            if (missing.length === 0) return;

            await Promise.all(missing.map(async (item) => {
                try {
                    const res = await fetchWithRetry(`https://api.github.com/repos/nako-hikari/minecraft-bedrock/commits?path=bedrock-commands/${item.file}&per_page=1`, 1);
                    const commits = await res.json();
                    item.dateAdded = (commits[0] && commits[0].commit && commits[0].commit.author) ? new Date(commits[0].commit.author.date).getTime() : null;
                } catch {
                    item.dateAdded = null;
                }
                if (item.dateAdded !== null) {
                    dateCache[item.file] = item.dateAdded;
                    cacheDirty = true;
                }
            }));

            if (cacheDirty) writeCachedDates(dateCache);
        }

        function sortList(list) {
            const sorted = [...list];
            switch (currentSort) {
                case 'title-asc': sorted.sort((a, b) => a.title.localeCompare(b.title)); break;
                case 'title-desc': sorted.sort((a, b) => b.title.localeCompare(a.title)); break;
                case 'date-desc': sorted.sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0)); break;
                case 'date-asc': sorted.sort((a, b) => (a.dateAdded || 0) - (b.dateAdded || 0)); break;
            }
            return sorted;
        }

        async function refreshGrid() {
            const container = document.getElementById('grid-box');
            let list = db;
            if (currentSearch) {
                list = db.filter(i =>
                    i.title.toLowerCase().includes(currentSearch) ||
                    i.desc.toLowerCase().includes(currentSearch) ||
                    i.tags.some(t => t.toLowerCase().includes(currentSearch)) ||
                    (i.credit || 'Nako Hikari').toLowerCase().includes(currentSearch)
                );
            }

            if (currentSort === 'date-asc' || currentSort === 'date-desc') {
                if (container) container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--text-main); padding: 20px;">Loading dates...</div>';
                await ensureDatesLoaded();
            }

            populateGrid(sortList(list));
        }

        function handleSortChange(val) {
            currentSort = val;
            refreshGrid();
        }

        function populateGrid(list) {
            const container = document.getElementById('grid-box');
            if (!container) return;
            container.innerHTML = '';

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card interactive';
                card.style.cssText = 'cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 16px;';
                card.onclick = () => { window.location.hash = encodeURIComponent(item.file); };
                
                let pills = item.tags.map(t => `<span style="background: var(--input-bg); border: var(--border-width) solid var(--border-color); color: var(--accent-light); padding: 2px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; text-transform: uppercase;">${escape(t)}</span>`).join(' ');

                const creditName = item.credit ? item.credit : 'Nako Hikari';

                card.innerHTML = `
                    <div style="font-size: 15px; font-weight: bold; color: var(--text-bright);">${escape(item.title)}</div>
                    <div class="grid-card-credit">By ${escape(creditName)}</div>
                    <div style="font-size: 13px; color: var(--text-main); flex: 1; ${item.payload ? '' : 'color: var(--accent-light);'}">${escape(item.desc)}</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px;">${pills}</div>
                `;
                container.appendChild(card);
            });
        }

        function filterGrid(q) {
            currentSearch = q.toLowerCase().trim();
            refreshGrid();
        }

        const MC_COLORS = {
            '0': '#000000', '1': '#0000AA', '2': '#00AA00', '3': '#00AAAA',
            '4': '#AA0000', '5': '#AA00AA', '6': '#FFAA00', '7': '#AAAAAA',
            '8': '#555555', '9': '#5555FF', 'a': '#55FF55', 'b': '#55FFFF',
            'c': '#FF5555', 'd': '#FF55FF', 'e': '#FFFF55', 'f': '#FFFFFF'
        };

        // Renders Minecraft "§" formatting codes in already-HTML-escaped text.
        // The marker itself is fully hidden; only its effect shows, matching
        // in-game rendering (contrast this with the formatter's live editor,
        // which keeps the marker visible at half opacity instead).
        function renderMcCodes(escapedStr) {
            if (escapedStr.indexOf('§') === -1) return escapedStr;
            let html = '', buffer = '', color = null, styles = [];
            const flush = () => {
                if (!buffer) return;
                let styleAttr = (color ? `color:${color};` : '') + styles.join('');
                html += styleAttr ? `<span style="${styleAttr}">${buffer}</span>` : buffer;
                buffer = '';
            };
            for (let i = 0; i < escapedStr.length; i++) {
                if (escapedStr[i] === '§' && i + 1 < escapedStr.length) {
                    const code = escapedStr[i + 1].toLowerCase();
                    if (MC_COLORS[code]) { flush(); color = MC_COLORS[code]; styles = []; i++; continue; }
                    if (code === 'r') { flush(); color = null; styles = []; i++; continue; }
                    if (code === 'l') { flush(); styles.push('font-weight:bold;'); i++; continue; }
                    if (code === 'm') { flush(); styles.push('text-decoration:line-through;'); i++; continue; }
                    if (code === 'n') { flush(); styles.push('text-decoration:underline;'); i++; continue; }
                    if (code === 'o') { flush(); styles.push('font-style:italic;'); i++; continue; }
                    i++; continue; // unknown/obfuscated code: swallow the marker, no styling
                }
                buffer += escapedStr[i];
            }
            flush();
            return html;
        }

        function parseMd(str) {
            let out = escape(str);
            // Manual line break token inserted by the formatter
            out = out.replace(/\[\[br\]\]/g, '<br>');
            // Minecraft "§" color/format codes
            out = renderMcCodes(out);
            // Inline code: `text` — single backtick, highlighted span, not a code block.
            out = out.replace(/`([^`\n]+?)`/g, '<span class="inline-code">$1</span>');
            // Image: [img](url) — or [img](url|linkUrl) for a clickable image.
            // Old content never contains a pipe here, so this is a pure
            // superset of the original behavior.
            out = out.replace(/\[img\]\((.*?)\)/g, (match, inner) => {
                const pipeIdx = inner.indexOf('|');
                const src = pipeIdx === -1 ? inner : inner.slice(0, pipeIdx);
                const link = pipeIdx === -1 ? '' : inner.slice(pipeIdx + 1);
                const imgTag = `<img class="content-image" src="${src}" style="max-width: 100%; height: auto; display: block; border-radius: 4px; margin: 8px 0;" alt="Asset">`;
                return link ? `<a href="${link}" target="_blank" style="display: block;">${imgTag}</a>` : imgTag;
            });
            // Video embed: [embed](url) — YouTube gets a responsive iframe;
            // direct video files get a <video> tag; anything else falls back
            // to a plain link.
            out = out.replace(/\[embed\]\((.*?)\)/g, (match, url) => {
                const ytId = extractYouTubeId(url);
                if (ytId) {
                    return `<div style="position: relative; width: 100%; padding-top: 56.25%; border-radius: 8px; overflow: hidden; margin: 8px 0; background: #000;"><iframe src="https://www.youtube-nocookie.com/embed/${ytId}" title="Video" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>`;
                }
                if (/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(url)) {
                    return `<video controls style="max-width: 100%; border-radius: 8px; margin: 8px 0; display: block;"><source src="${url}"></video>`;
                }
                return `<a href="${url}" target="_blank" style="color: var(--accent-light); text-decoration: none;">Watch video</a>`;
            });
            // Legacy explicit link syntax: [link][Label](url)
            out = out.replace(/\[link\]\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" style="color: var(--accent-light); text-decoration: none;">$1</a>');
            // Standard markdown link: [Label](url) — runs after [img]/[embed]/[link] are
            // already consumed above, so it won't collide with those.
            out = out.replace(/\[([^\[\]]+?)\]\((https?:\/\/[^\s)]+?)\)/g, '<a href="$2" target="_blank" style="color: var(--accent-light); text-decoration: none;">$1</a>');
            return out;
        }

        function extractYouTubeId(url) {
            const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
            return m ? m[1] : null;
        }

        function buildCodeWithLineNumbers(linesArray, isNpc = false) {
            const showLineNumbers = linesArray.length > 1;
            return linesArray.map((line, idx) => {
                return `<div style="display: flex; align-items: flex-start; line-height: 1.4; white-space: ${isNpc ? 'pre' : 'nowrap'};">` +
                       (showLineNumbers ? `<span class="line-num-node" style="color: var(--accent-light); opacity: 0.5; font-family: monospace; padding-right: 8px; margin-right: 8px; border-right: 1px solid var(--border-color); min-width: 20px; text-align: right; user-select: none;">${idx + 1}</span>` : '') +
                       `<span class="line-content-node" style="color: var(--text-bright); font-family: monospace; flex: 1;">${renderMcCodes(escape(line))}</span>` +
                       `</div>`;
            }).join('');
        }

        function isNakoAuthor(credit) {
            if (!credit) return true;
            const normalized = credit.toLowerCase().replace(/[\s_\-]/g, '');
            return normalized === 'nakohikari';
        }

        async function renderView(item) {
            const canvas = document.getElementById('app-view-router-canvas');
            canvas.innerHTML = ''; 

            const isExternalAuthor = !isNakoAuthor(item.credit);
            const creditDisplayName = item.credit ? item.credit : 'Nako Hikari';
            const bottomCreditContainer = document.getElementById('bottom-author-credit');
            const footerBrand = document.getElementById('footer-brand');

            if (isExternalAuthor) {
                bottomCreditContainer.innerHTML = `
                    <div class="author-credit-bar with-disclaimer">
                        <span>Creation by ${escape(creditDisplayName)}</span>
                        <span class="author-credit-disclaimer">I do not own this creation, all rights and ownership belong to the credited name.<br>If you own the command and think someone publish it with their name, contact me to straight things out</span>
                    </div>
                `;
                if (footerBrand) footerBrand.classList.add('dimmed');
            } else {
                bottomCreditContainer.innerHTML = `
                    <div class="author-credit-bar">
                        <span>Creation by ${escape(creditDisplayName)}</span>
                    </div>
                `;
                if (footerBrand) footerBrand.classList.remove('dimmed');
            }

            const mainCard = document.createElement('div');
            mainCard.className = 'card';
            mainCard.style.cssText = 'padding: 16px; display: block; width: 100%; box-sizing: border-box;';

            const topCreditBar = document.createElement('div');
            topCreditBar.className = 'author-credit-bar';
            topCreditBar.innerHTML = `<span>Creation by ${escape(creditDisplayName)}</span>`;
            mainCard.appendChild(topCreditBar);

            let topRow = document.createElement('div');
            topRow.style.cssText = 'display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 12px;';

            let meta = document.createElement('div');
            meta.style.cssText = 'display: flex; flex-direction: column; gap: 4px;';

            let shareBtn = document.createElement('button');
            shareBtn.className = 'primary';
            shareBtn.innerText = 'Share';
            shareBtn.onclick = () => {
                const label = `${window.location.host}${window.location.pathname}#${encodeURIComponent(item.file.replace(/\.txt$/i, ''))}`;
                navigator.clipboard.writeText(label);
                shareBtn.innerText = 'Copied!';
                shareBtn.classList.add('copy-success');
                setTimeout(() => { 
                    shareBtn.innerText = 'Share'; 
                    shareBtn.classList.remove('copy-success');
                }, 1200);
            };

            let wrapLabel = document.createElement('label');
            wrapLabel.style.cssText = 'display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; user-select: none; cursor: pointer; color: var(--text-main);';
            wrapLabel.innerHTML = `<input type="checkbox" id="wrap-toggle" style="cursor: pointer;"> Word Wrap`;
            
            wrapLabel.querySelector('input').onchange = (e) => {
                document.querySelectorAll('.output-box .line-content-node').forEach(node => {
                    node.style.whiteSpace = e.target.checked ? 'pre-wrap' : 'nowrap';
                    node.style.wordBreak = 'normal';
                    node.style.overflowWrap = e.target.checked ? 'break-word' : 'normal';
                });
                document.querySelectorAll('.output-box').forEach(box => {
                    box.style.overflowX = e.target.checked ? 'hidden' : 'auto';
                });
            };

            let actions = document.createElement('div');
            actions.style.cssText = 'display: flex; align-items: center; gap: 12px; flex-shrink: 0;';
            actions.appendChild(wrapLabel);
            if (item.file) actions.appendChild(shareBtn);

            let tagBox = document.createElement('div');
            tagBox.style.cssText = 'display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;';
            
            let contentFlow = document.createElement('div');
            contentFlow.style.cssText = 'display: flex; flex-direction: column; gap: 12px; width: 100%; box-sizing: border-box;';

            let currentChain = null;
            let chainIdx = 0;
            let currentChatBox = null; // { el, hasNpc } — shared container for consecutive CMD:CHAT/CMD:NPC rows

            const isFlipped = item.tags.some(t => t.toLowerCase() === 'flip');
            const rotation = isFlipped ? "0deg" : "180deg";

            // Flushes the pending NPC link tag and clears the shared chat/npc container.
            function closeChatBox() {
                if (currentChatBox && currentChatBox.hasNpc) {
                    let linkTag = document.createElement('div');
                    linkTag.style.cssText = 'font-family: monospace; font-size: 11px; color: var(--text-main); text-align: center; cursor: pointer; user-select: none; margin-top: -4px; margin-bottom: 12px;';
                    linkTag.innerText = '--- click here to know how to use NPC as setup ---';
                    linkTag.onclick = () => { window.open('https://github.com/nako-hikari/support-files/blob/main/npc-setup/npc-setup-tutorial.md', '_blank'); };
                    contentFlow.appendChild(linkTag);
                }
                currentChatBox = null;
            }

            function renderChatNpcRow(isNpc, payloadLines) {
                currentChain = null; // a chat/npc row breaks any open chain box

                if (!currentChatBox) {
                    let el = document.createElement('div');
                    el.style.cssText = 'display: flex; flex-direction: column; background: var(--input-bg); border: var(--border-width) solid var(--border-color); border-radius: 8px; margin: 8px 0; width: 100%; box-sizing: border-box;';
                    contentFlow.appendChild(el);
                    currentChatBox = { el, hasNpc: false, rowCount: 0 };
                }
                if (isNpc) currentChatBox.hasNpc = true;
                currentChatBox.rowCount++;

                let npcRow = document.createElement('div');
                npcRow.style.cssText = `display: flex; gap: 8px; align-items: center; padding: 8px; min-height: 40px; width: 100%; box-sizing: border-box;${currentChatBox.rowCount > 1 ? ' border-top: 1px solid var(--border-color);' : ''}`;

                let img = document.createElement('img');
                img.className = 'content-image';
                img.style.cssText = 'width: 32px; height: 32px; object-fit: contain; image-rendering: pixelated;';
                img.src = isNpc ? `${ASSETS}/npc.png` : `${ASSETS}/chat.png`;

                let idx = document.createElement('div');
                idx.style.cssText = 'font-family: monospace; font-weight: bold; width: 22px; text-align: center; color: var(--text-main); font-size: 12px;';
                idx.innerText = String(currentChatBox.rowCount);

                let block = document.createElement('div');
                block.className = 'output-box';
                block.style.cssText = 'flex: 1; font-family: monospace; background: var(--bg-color); border: 1px solid var(--border-color); padding: 8px; border-radius: 4px; font-size: 12.5px; overflow-x: auto; min-width: 0; scrollbar-width: none;';
                block.style.setProperty('-ms-overflow-style', 'none');
                block.innerHTML = buildCodeWithLineNumbers(payloadLines, true);

                let copy = document.createElement('button');
                copy.className = 'secondary interactive';
                copy.style.cssText = 'width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0;';
                copy.innerHTML = `<img src="${ASSETS}/copy.png" style="width: 16px; height: 16px; image-rendering: pixelated;" alt="Copy">`;
                copy.onclick = () => {
                    navigator.clipboard.writeText(payloadLines.join('\n'));
                    copy.classList.add('copy-success');
                    setTimeout(() => { copy.classList.remove('copy-success'); }, 800);
                };

                npcRow.appendChild(idx);
                npcRow.appendChild(img);
                npcRow.appendChild(block);
                npcRow.appendChild(copy);
                currentChatBox.el.appendChild(npcRow);
            }

            // Codeblock: just a code box + copy button, deliberately with no
            // command-block texture/background — distinct from Chain/Impulse/
            // Repeat rows and from the Chat/NPC dialogue-style box.
            function renderCodeblockRow(payloadLines) {
                currentChain = null;
                closeChatBox();

                let wrap = document.createElement('div');
                wrap.style.cssText = 'display: flex; align-items: flex-start; gap: 8px; margin: 8px 0; width: 100%; box-sizing: border-box;';

                let block = document.createElement('div');
                block.className = 'output-box';
                block.style.cssText = 'flex: 1; font-family: monospace; background: var(--input-bg); border: var(--border-width) solid var(--border-color); padding: 8px; border-radius: 6px; font-size: 12.5px; overflow-x: auto; min-width: 0; scrollbar-width: none;';
                block.style.setProperty('-ms-overflow-style', 'none');
                block.innerHTML = buildCodeWithLineNumbers(payloadLines, true);

                let copy = document.createElement('button');
                copy.className = 'secondary interactive';
                copy.style.cssText = 'width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0;';
                copy.innerHTML = `<img src="${ASSETS}/copy.png" style="width: 16px; height: 16px; image-rendering: pixelated;" alt="Copy">`;
                copy.onclick = () => {
                    navigator.clipboard.writeText(payloadLines.join('\n'));
                    copy.classList.add('copy-success');
                    setTimeout(() => { copy.classList.remove('copy-success'); }, 800);
                };

                wrap.appendChild(block);
                wrap.appendChild(copy);
                contentFlow.appendChild(wrap);
            }

            function renderChainRow(headerLine, payload) {
                closeChatBox(); // a chain row breaks any open chat/npc box
                if (!currentChain) {
                    currentChain = document.createElement('div');
                    currentChain.style.cssText = 'display: flex; flex-direction: column; background: var(--input-bg); border: var(--border-width) solid var(--border-color); border-radius: 6px; margin: 8px 0; width: 100%; box-sizing: border-box;';
                    contentFlow.appendChild(currentChain);
                    chainIdx = 0;
                }

                chainIdx++;
                const tokens = headerLine.split(':');
                const mode = (tokens[1] || 'C').toUpperCase();
                const active = (tokens[2] || 'AA').toUpperCase();
                const cond = (tokens[3] || 'U').toUpperCase();
                const tick = tokens[4] || '0';

                const bName = mode === 'I' ? 'Impulse' : mode === 'R' ? 'Repeat' : 'Chain';
                const cText = cond.startsWith('C') ? 'Conditional' : 'Unconditional';
                const aText = active === 'AA' ? 'Always Active' : 'Needs Redstone';

                let graphic = `${ASSETS}/${mode.toLowerCase()}-${cond.toLowerCase().startsWith('c') ? 'cn' : 'un'}.png`;

                let row = document.createElement('div');
                row.style.cssText = 'display: flex; align-items: center; padding: 4px 8px; gap: 8px; position: relative; min-height: 40px; width: 100%; box-sizing: border-box;';

                let tipStyles = `
                    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) scale(0.9);
                    background: var(--bg-color); border: 2px solid var(--border-color); border-radius: 4px; padding: 8px 12px;
                    color: var(--text-bright); font-family: monospace; font-size: 12px; font-weight: bold;
                    line-height: 1.4; white-space: pre; text-align: left; opacity: 0; pointer-events: none; z-index: 99;
                    box-shadow: var(--shadow-soft, 0 8px 20px rgba(0,0,0,0.4)); transition: opacity 0.15s ease, transform 0.15s ease;
                `;

                let blockGraphicContainer = document.createElement('div');
                blockGraphicContainer.className = 'interactive';
                blockGraphicContainer.style.cssText = 'position: relative; width: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; flex-shrink: 0;';
                blockGraphicContainer.tabIndex = 0;

                let blockImg = document.createElement('img');
                blockImg.className = 'content-image';
                blockImg.src = graphic;
                blockImg.style.cssText = `width: 32px; height: 32px; object-fit: contain; image-rendering: pixelated; transform: rotate(${rotation});`;
                blockImg.alt = "Block";

                // Tick is now always visible here instead of only on hover —
                // the other details (type/condition/active) stay in the
                // tooltip below since those are less frequently needed at a glance.
                let tickLabel = document.createElement('div');
                tickLabel.style.cssText = 'font-family: monospace; font-size: 9px; font-weight: bold; color: var(--text-main); line-height: 1; user-select: none; white-space: nowrap;';
                tickLabel.innerText = `T${tick}`;

                let tooltipNode = document.createElement('div');
                tooltipNode.style.cssText = tipStyles;
                tooltipNode.innerText = `${bName}\n${cText}\n${aText}\nTick = ${tick}`;

                blockGraphicContainer.appendChild(blockImg);
                blockGraphicContainer.appendChild(tickLabel);
                blockGraphicContainer.appendChild(tooltipNode);

                blockGraphicContainer.onmouseenter = () => {
                    tooltipNode.style.opacity = '1';
                    tooltipNode.style.transform = 'translateX(-50%) scale(1)';
                };
                blockGraphicContainer.onmouseleave = () => {
                    tooltipNode.style.opacity = '0';
                    tooltipNode.style.transform = 'translateX(-50%) scale(0.9)';
                };
                blockGraphicContainer.onfocus = () => {
                    tooltipNode.style.opacity = '1';
                    tooltipNode.style.transform = 'translateX(-50%) scale(1)';
                };
                blockGraphicContainer.onblur = () => {
                    tooltipNode.style.opacity = '0';
                    tooltipNode.style.transform = 'translateX(-50%) scale(0.9)';
                };

                let outputBox = document.createElement('div');
                outputBox.className = 'output-box';
                outputBox.style.cssText = 'flex: 1; margin: 0; font-size: 12.5px; padding: 8px; overflow-x: auto; min-width: 0; scrollbar-width: none;';
                outputBox.style.setProperty('-ms-overflow-style', 'none');

                outputBox.innerHTML = buildCodeWithLineNumbers([payload], false);

                let copyBtn = document.createElement('button');
                copyBtn.className = 'secondary interactive';
                copyBtn.style.cssText = 'width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0;';
                copyBtn.innerHTML = `<img src="${ASSETS}/copy.png" style="width: 16px; height: 16px; image-rendering: pixelated;" alt="Copy">`;
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(payload);
                    copyBtn.classList.add('copy-success');
                    setTimeout(() => { copyBtn.classList.remove('copy-success'); }, 800);
                };

                let rowIdxNode = document.createElement('div');
                rowIdxNode.style.cssText = 'font-family: monospace; font-weight: bold; width: 22px; text-align: center; color: var(--text-main); font-size: 12px;';
                rowIdxNode.innerText = chainIdx;

                row.appendChild(rowIdxNode);
                row.appendChild(blockGraphicContainer);
                row.appendChild(outputBox);
                row.appendChild(copyBtn);
                currentChain.appendChild(row);
            }

            item.payload.split('\n\n').forEach(seg => {
                const lines = seg.split('\n').filter(l => l.trim().length > 0);
                if (lines.length === 0) return;

                const head = lines[0].trim();
                currentChain = null;
                closeChatBox();

                let v;

                if ((v = matchMeta(head, 'TITLE')) !== null) {
                    const headerEl = document.getElementById('app-display-header');
                    if (headerEl) headerEl.innerText = v;
                } 
                else if ((v = matchMeta(head, 'DESC')) !== null) {
                    let d = document.createElement('div');
                    d.style.cssText = 'font-size: 14px; color: var(--text-main);';
                    d.innerText = v;
                    meta.appendChild(d);
                } 
                else if ((v = matchMeta(head, 'TAG')) !== null) {
                    v.split(',').forEach(t => {
                        let pill = document.createElement('span');
                        let isFlipTag = t.trim().toLowerCase() === 'flip';
                        pill.style.cssText = isFlipTag
                            ? `background: color-mix(in srgb, var(--red) 18%, var(--input-bg)); border: var(--border-width) solid var(--red); color: var(--red); padding: 2px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; text-transform: uppercase;`
                            : `background: var(--input-bg); border: var(--border-width) solid var(--border-color); color: var(--accent-light); padding: 2px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; text-transform: uppercase;`;
                        pill.innerText = t.trim();
                        tagBox.appendChild(pill);
                    });
                }
                else if (matchMeta(head, 'CREDIT') !== null) {
                    // Already applied via extractMeta(); skip so it's not rendered as content.
                }
                else if (/^H[1-5]:/i.test(head)) {
                    currentChain = null;
                    const tier = head.match(/^H[1-5]/i)[0].toLowerCase();
                    let h = document.createElement('div');
                    h.style.cssText = tier === 'h1' ? 'font-size: 1.6rem; color: var(--text-bright); font-weight: 600; margin-top: 12px;' : 'font-size: 1.1rem; color: var(--text-bright); font-weight: 600; margin-top: 12px; text-transform: uppercase; letter-spacing: 0.5px;';
                    h.innerText = head.replace(/^H[1-5]:/i, '').trim();
                    contentFlow.appendChild(h);
                }
                else if ((v = matchMeta(head, 'TEXT')) !== null) {
                    currentChain = null;
                    let p = document.createElement('p');
                    p.style.cssText = 'font-size: 14px; color: var(--text-main); line-height: 1.5; margin: 0;';
                    const bodyLines = [v, ...lines.slice(1)];
                    p.innerHTML = bodyLines.map(l => parseMd(l)).join('<br>');
                    contentFlow.appendChild(p);
                }
                else if ((v = matchMeta(head, 'NOTE')) !== null) {
                    currentChain = null;
                    // NOTE: <text>  OR  NOTE:GREEN|RED|YELLOW: <text>
                    const colorMatch = head.match(/^\s*NOTE\s*:\s*(GREEN|RED|YELLOW)\s*:\s*(.*)$/i);
                    const noteColor = colorMatch ? colorMatch[1].toLowerCase() : 'default';
                    const firstLine = colorMatch ? colorMatch[2] : v;
                    const noteStyles = {
                        green: 'var(--green)', red: 'var(--red)', yellow: 'var(--yellow)', default: 'var(--border-color)'
                    };
                    let n = document.createElement('p');
                    n.style.cssText = noteColor === 'default'
                        ? `font-style: italic; color: var(--text-main); padding-left: 8px; border-left: 2px solid ${noteStyles[noteColor]}; margin: 0;`
                        : `font-style: italic; color: var(--text-main); padding: 8px; border: 1px solid ${noteStyles[noteColor]}; border-left: 6px solid ${noteStyles[noteColor]}; border-radius: 4px; margin: 0;`;
                    const bodyLines = [firstLine, ...lines.slice(1)];
                    n.innerHTML = bodyLines.map(l => parseMd(l)).join('<br>');
                    contentFlow.appendChild(n);
                }
                else if ((v = matchMeta(head, 'BULLET')) !== null) {
                    currentChain = null;
                    const style = (v || 'dot').toLowerCase();
                    const items = lines.slice(1);
                    const isOrdered = style === 'num' || style === 'abc';
                    let list = document.createElement(isOrdered ? 'ol' : 'ul');
                    const listStyleType = { dot: 'disc', dash: 'none', num: 'decimal', abc: 'lower-alpha' }[style] || 'disc';
                    list.style.cssText = `list-style-type: ${listStyleType}; padding-left: 20px; margin: 0; display: flex; flex-direction: column; gap: 4px;`;
                    items.forEach(itemLine => {
                        let li = document.createElement('li');
                        li.style.cssText = 'font-size: 14px; color: var(--text-main); line-height: 1.5;';
                        li.innerHTML = (style === 'dash' ? '&ndash;&nbsp;' : '') + parseMd(itemLine);
                        list.appendChild(li);
                    });
                    contentFlow.appendChild(list);
                }
                else if ((v = matchMeta(head, 'VIDEO')) !== null || (v = matchMeta(head, 'YOUTUBE')) !== null) {
                    currentChain = null;
                    // URL may be inline on the header line or on the line(s) below.
                    const candidateText = [v, ...lines.slice(1)].join(' ').trim();
                    const ytId = extractYouTubeId(candidateText);
                    if (ytId) {
                        let wrap = document.createElement('div');
                        wrap.style.cssText = 'position: relative; width: 100%; padding-top: 56.25%; border-radius: 8px; overflow: hidden; margin: 8px 0; background: #000;';
                        wrap.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${ytId}" title="YouTube video" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>`;
                        contentFlow.appendChild(wrap);
                    } else if (candidateText) {
                        let p = document.createElement('p');
                        p.style.cssText = 'font-size: 14px; color: var(--text-main); line-height: 1.5; margin: 0;';
                        p.innerHTML = parseMd(`[Watch video](${candidateText})`);
                        contentFlow.appendChild(p);
                    }
                }
                else if ((v = matchMeta(head, 'SOCIAL')) !== null) {
                    currentChain = null;
                    let url = '', avatar = '', platform = '', username = '';
                    const stats = [];
                    lines.slice(1).forEach(ln => {
                        let m2;
                        if ((m2 = matchMeta(ln, 'URL')) !== null) url = m2;
                        else if ((m2 = matchMeta(ln, 'AVATAR')) !== null) avatar = m2;
                        else if ((m2 = matchMeta(ln, 'PLATFORM')) !== null) platform = m2;
                        else if ((m2 = matchMeta(ln, 'USERNAME')) !== null) username = m2;
                        else if ((m2 = matchMeta(ln, 'STAT')) !== null) {
                            const parts = m2.split('|');
                            const label = (parts[0] || '').trim();
                            if (label) stats.push({ label, value: (parts[1] || '').trim() });
                        }
                    });
                    contentFlow.appendChild(buildSocialCard(v, url, avatar, stats, platform, username));
                }
                else if ((v = matchMeta(head, 'DONATE')) !== null) {
                    currentChain = null;
                    let url = '', avatar = '', platform = '';
                    lines.slice(1).forEach(ln => {
                        let m2;
                        if ((m2 = matchMeta(ln, 'URL')) !== null) url = m2;
                        else if ((m2 = matchMeta(ln, 'AVATAR')) !== null) avatar = m2;
                        else if ((m2 = matchMeta(ln, 'PLATFORM')) !== null) platform = m2;
                    });
                    contentFlow.appendChild(buildDonationCard(v, url, avatar, platform));
                }
                else if (headIs(head, 'CMD:')) {
                    // Group by each CMD: header so mixed chat/chain content renders in order.
                    let groups = [];
                    let curGroup = null;
                    lines.forEach(ln => {
                        const t = ln.trim();
                        if (headIs(t, 'CMD:')) {
                            curGroup = { header: t, payload: [] };
                            groups.push(curGroup);
                        } else if (curGroup) {
                            curGroup.payload.push(ln);
                        }
                    });

                    groups.forEach(grp => {
                        const isNpc = headIs(grp.header, 'CMD:NPC');
                        const isChat = headIs(grp.header, 'CMD:CHAT');
                        const isCode = headIs(grp.header, 'CMD:CODE');

                        if (isCode) {
                            renderCodeblockRow(grp.payload);
                        } else if (isNpc || isChat) {
                            renderChatNpcRow(isNpc, grp.payload);
                        } else {
                            renderChainRow(grp.header, grp.payload[0] || '');
                        }
                    });
                }
                else {
                    // Unrecognized header: render as plain text instead of silently dropping it.
                    currentChain = null;
                    let p = document.createElement('p');
                    p.style.cssText = 'font-size: 14px; color: var(--text-main); line-height: 1.5; margin: 0;';
                    p.innerHTML = lines.map(l => parseMd(l)).join('<br>');
                    contentFlow.appendChild(p);
                }
            });
            closeChatBox();

            if (meta.children.length > 0) topRow.appendChild(meta);
            topRow.appendChild(actions);
            mainCard.appendChild(topRow);

            if (tagBox.children.length > 0) mainCard.appendChild(tagBox);
            if (meta.children.length > 0 || tagBox.children.length > 0) {
                let hr = document.createElement('hr');
                hr.style.cssText = 'border: none; border-bottom: 1px solid var(--border-color); margin: 0 0 16px 0;';
                mainCard.appendChild(hr);
            }

            mainCard.appendChild(contentFlow);
            canvas.appendChild(mainCard);
            
            if (!document.getElementById('nako-scrollbar-override-rules')) {
                const styles = document.createElement('style');
                styles.id = 'nako-scrollbar-override-rules';
                styles.innerHTML = `
                    .output-box::-webkit-scrollbar, .output-box *::-webkit-scrollbar { display: none !important; }
                    .output-box { -ms-overflow-style: none !important; scrollbar-width: none !important; }
                `;
                document.head.appendChild(styles);
            }
        }

        // Brand icon + display label for known platforms, used as a fallback
        // face when no avatar was retrieved/provided. Icons come from the
        // same simple-icons CDN already used in the footer.
        const PLATFORM_META = {
            youtube:        { label: 'YouTube',        icon: 'youtube',        color: '#FF0000' },
            tiktok:         { label: 'TikTok',          icon: 'tiktok',         color: '#000000' },
            instagram:      { label: 'Instagram',       icon: 'instagram',      color: '#E4405F' },
            twitter:        { label: 'X (Twitter)',     icon: 'x',              color: '#000000' },
            facebook:       { label: 'Facebook',        icon: 'facebook',       color: '#1877F2' },
            twitch:         { label: 'Twitch',          icon: 'twitch',         color: '#9146FF' },
            reddit:         { label: 'Reddit',          icon: 'reddit',         color: '#FF4500' },
            github:         { label: 'GitHub',          icon: 'github',         color: '#181717' },
            pinterest:      { label: 'Pinterest',       icon: 'pinterest',      color: '#BD081C' },
            linkedin:       { label: 'LinkedIn',        icon: 'linkedin',       color: '#0A66C2' },
            threads:        { label: 'Threads',         icon: 'threads',        color: '#000000' },
            bluesky:        { label: 'Bluesky',         icon: 'bluesky',        color: '#0085FF' },
            telegram:       { label: 'Telegram',        icon: 'telegram',       color: '#26A5E4' },
            trakteer:       { label: 'Trakteer',        icon: null,             color: '#FA5B0F' },
            saweria:        { label: 'Saweria',         icon: null,             color: '#FFCD29' },
            kofi:           { label: 'Ko-fi',           icon: 'kofi',           color: '#FF5E5B' },
            buymeacoffee:   { label: 'Buy Me a Coffee', icon: 'buymeacoffee',   color: '#FFDD00' },
            patreon:        { label: 'Patreon',         icon: 'patreon',        color: '#FF424D' },
            paypal:         { label: 'PayPal',          icon: 'paypal',         color: '#00457C' },
            streamlabs:     { label: 'Streamlabs',      icon: 'streamlabs',     color: '#80F5D2' },
            streamelements:  { label: 'StreamElements',  icon: 'streamelements', color: '#4A00E0' },
            karyakarsa:     { label: 'Karyakarsa',      icon: null,             color: '#F6C445' },
            sociabuzz:      { label: 'Sociabuzz',       icon: null,             color: '#2FB6A3' }
        };

        // Builds a small circular fallback "avatar" out of the platform's
        // brand icon (or its initial, if no icon is available) — used
        // whenever no real PFP was retrieved/provided.
        function buildPlatformFallbackAvatar(platform, sizePx) {
            const meta = PLATFORM_META[(platform || '').toLowerCase()];
            const el = document.createElement('div');
            el.className = 'content-image';
            el.style.cssText = `width: ${sizePx}px; height: ${sizePx}px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ${meta ? meta.color : 'var(--input-bg)'};`;
            if (meta && meta.icon) {
                el.innerHTML = `<img class="content-image" src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/${meta.icon}.svg" alt="" style="width: ${Math.round(sizePx * 0.55)}px; height: ${Math.round(sizePx * 0.55)}px; filter: invert(1);">`;
            } else {
                el.style.fontSize = Math.round(sizePx * 0.45) + 'px';
                el.style.fontWeight = 'bold';
                el.style.color = '#ffffff';
                el.innerText = meta ? meta.label.charAt(0).toUpperCase() : '?';
            }
            return el;
        }

        // Renders a SOCIAL: block as a clickable profile card: PFP (or a
        // platform-branded fallback) on the left, display name / @username /
        // stat lines stacked on the right.
        function buildSocialCard(name, url, avatar, stats, platform, username) {
            const card = document.createElement(url ? 'a' : 'div');
            if (url) {
                card.href = url;
                card.target = '_blank';
            }
            card.className = url ? 'card interactive' : 'card';
            card.style.cssText = 'display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: inherit; width: 100%; box-sizing: border-box;';

            if (avatar) {
                const img = document.createElement('img');
                img.className = 'content-image';
                img.src = avatar;
                img.alt = name;
                img.style.cssText = 'width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0;';
                card.appendChild(img);
            } else {
                card.appendChild(buildPlatformFallbackAvatar(platform, 48));
            }

            const body = document.createElement('div');
            body.style.cssText = 'display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1;';

            const nameEl = document.createElement('div');
            nameEl.style.cssText = 'font-size: 15px; font-weight: bold; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;';
            nameEl.innerText = name;
            body.appendChild(nameEl);

            if (username) {
                const userEl = document.createElement('div');
                userEl.style.cssText = 'font-size: 12.5px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;';
                userEl.innerText = username.startsWith('@') ? username : '@' + username;
                body.appendChild(userEl);
            }

            if (stats.length > 0) {
                const statRow = document.createElement('div');
                statRow.style.cssText = 'display: flex; flex-wrap: wrap; gap: 10px; margin-top: 2px;';
                stats.forEach(s => {
                    const statEl = document.createElement('span');
                    statEl.style.cssText = 'font-size: 12px; color: var(--text-main);';
                    statEl.innerHTML = `<strong style="color: var(--accent-light);">${escape(s.value)}</strong> ${escape(s.label)}`;
                    statRow.appendChild(statEl);
                });
                body.appendChild(statRow);
            }

            card.appendChild(body);

            if (url) {
                const chevron = document.createElement('span');
                chevron.style.cssText = 'color: var(--text-main); font-size: 18px; flex-shrink: 0;';
                chevron.innerText = '›';
                card.appendChild(chevron);
            }

            return card;
        }

        // Renders a DONATE: block: PFP (or platform fallback) + creator name
        // on the left, a purely-visual "Donate" pill on the right. The whole
        // card is the click target — the pill itself has no separate handler.
        function buildDonationCard(name, url, avatar, platform) {
            const card = document.createElement(url ? 'a' : 'div');
            if (url) {
                card.href = url;
                card.target = '_blank';
            }
            card.className = url ? 'card interactive' : 'card';
            card.style.cssText = 'display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: inherit; width: 100%; box-sizing: border-box;';

            if (avatar) {
                const img = document.createElement('img');
                img.className = 'content-image';
                img.src = avatar;
                img.alt = name;
                img.style.cssText = 'width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0;';
                card.appendChild(img);
            } else {
                card.appendChild(buildPlatformFallbackAvatar(platform, 40));
            }

            const nameEl = document.createElement('div');
            nameEl.style.cssText = 'font-size: 14.5px; font-weight: bold; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;';
            nameEl.innerText = name;
            card.appendChild(nameEl);

            const donateBtn = document.createElement('span');
            donateBtn.style.cssText = 'flex-shrink: 0; background: var(--accent-dark); color: var(--text-on-brand, #fff); font-size: 12.5px; font-weight: bold; padding: 6px 14px; border-radius: var(--radius-full, 999px);';
            donateBtn.innerText = 'Donate';
            card.appendChild(donateBtn);

            return card;
        }

        function goHome() {
            window.location.hash = '';
            const backBtn = document.getElementById('back-btn');
            if (backBtn) backBtn.style.display = 'flex';
            document.getElementById('app-display-header').innerText = "Command Block Creation";
            renderGrid();
        }

        function escape(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>

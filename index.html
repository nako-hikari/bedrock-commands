<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Block Creation</title>
    <style>
        :root {
            color-scheme: light dark;

            /* Nako-Default-Purple Color Palette */
            --bg-color: #0e0e11;
            --container-bg: #18181f;
            --input-bg: #0f0f12;
            --box-bg: #0f0f12;
            --border-color: #2d2d38;
            --accent-dark: #663657;
            --accent-dark-hover: #81456e;
            --accent-light: #A77A99;
            --accent-light-hover: #c5a4bc;

            /* Unused color tokens */
            --accent-dark2: #4a2340;
            --accent-dark-hover2: #5e2f52;  
            --accent-light2: #8b5fa3;
            --accent-light-hover2: #a67bc0; 
            --primary: #8b5fa3;
            --primary-hover: #a67bc0;
            --secondary: #4a2340;
            --secondary-hover: #5e2f52;

            /* Typography */
            --text-bright: #ffffff;
            --text-main: #b4b4bc;
            --text-muted: #5a5a66;
            --text-codeblock: #C77E4F;
            --text-clickable-link: #52BBE8;
            --text-pale-purple: #9575cd;

            /* Alert / Dangerous */
            --red: #e05c5c;
            --red-pale: #241616;
            
            /* Green Note Tokens */
            --green: #4fbc75;
            --green-pale: #132118;

            /* Yellow Note Tokens */
            --yellow: #dfb142;
            --yellow-pale: #242014;

            /* Extra Feedback Utility Elements */
            --success-bg: #2a4f32;
            --success-border: #3b6e47;
            --impulse: #C77E4F;
            --impulse-pale: #261b14;
            --chain: #76B297;
            --chain-pale: #18221e;
            --repeat: #6A4FC7;
            --repeat-pale: #171424;

            /* Spacing & Layout Scale */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 20px;
            --space-2xl: 24px;
            --max-width: 900px;

            /* Borders & Depth Elevation */
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --border-width: 1px;
            --shadow-deep: 0 6px 16px rgba(0, 0, 0, 0.6);
            --shadow-soft: 0 2px 6px rgba(0, 0, 0, 0.3);

            /* Animation & Transitions */
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        img {
            color-scheme: only light !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
            padding: var(--space-2xl) var(--space-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (max-width: 600px) {
            body {
                padding: var(--space-lg) var(--space-sm);
            }
        }

        .wrapper {
            width: 100%;
            max-width: var(--max-width);
            display: flex;
            flex-direction: column;
            gap: var(--space-xl);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border-width) solid var(--border-color);
            padding-bottom: var(--space-md);
        }

        .title-block {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.3;
            color: var(--text-bright);
            margin: 0;
            cursor: pointer;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .upload-btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--box-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-md);
            transition: border-color var(--transition-fast), background var(--transition-fast);
        }
        .upload-btn-link:hover {
            border-color: var(--accent-light);
        }
        .upload-btn-link:active {
            border-color: var(--accent-light-hover);
            background: #1e1924;
            transform: scale(0.98);
        }
        .upload-btn-link img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .search-container {
            width: 100%;
        }

        .search-box {
            width: 100%;
            background: var(--input-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--space-md) var(--space-lg);
            color: var(--text-bright);
            font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", monospace;
            font-size: 14px;
            outline: none;
        }
        .search-box:focus {
            border-color: var(--accent-light);
        }

        .creation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: var(--space-lg);
        }

        .creation-card {
            background: var(--container-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            box-shadow: var(--shadow-deep);
            cursor: pointer;
            transition: border-color var(--transition-fast);
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }
        .creation-card:hover {
            border-color: var(--accent-light);
        }
        .creation-card:active {
            border-color: var(--accent-light-hover);
            background: #1e1924;
            transform: scale(0.98);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-bright);
        }
        .card-desc {
            font-size: 14px;
            color: var(--text-main);
            flex: 1;
        }

        .tag-pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
        }
        .tag-pill {
            background: var(--box-bg);
            border: var(--border-width) solid var(--border-color);
            color: var(--accent-light);
            padding: 2px var(--space-sm);
            font-size: 12px;
            font-family: ui-monospace, "SF Mono", "JetBrains Mono", monospace;
            border-radius: var(--radius-sm);
        }

        .viewer-card {
            background: var(--container-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            box-shadow: var(--shadow-deep);
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        .viewer-action-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--space-lg);
        }

        .render-title {
            font-size: 1.5rem;
            color: var(--text-bright);
            font-weight: 600;
            margin: 0;
        }
        .render-desc {
            font-size: 14px;
            color: var(--text-main);
            margin: 0;
        }

        .view-h1 { font-size: 1.3rem; color: var(--text-bright); font-weight: 600; margin-top: 12px; }
        .view-h2 { font-size: 1.1rem; color: var(--text-bright); font-weight: 600; text-transform: uppercase; margin-top: 12px; }
        .view-text { font-size: 14px; color: var(--text-main); margin: 0; }

        .connected-chain-group {
            display: flex;
            flex-direction: column;
            background: var(--box-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-md);
            margin: 8px 0;
        }

        .view-cmd-row {
            display: flex;
            align-items: center;
            padding: 6px var(--space-sm);
            gap: var(--space-sm);
            position: relative;
        }

        .view-row-idx {
            font-family: ui-monospace, "SF Mono", monospace;
            width: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }

        .block-interactive-wrapper {
            position: relative;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .block-face-texture-node {
            width: 32px;
            height: 32px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .view-cmd-payload-box {
            flex: 1;
            font-family: ui-monospace, "SF Mono", "JetBrains Mono", monospace;
            background: var(--bg-color);
            border: var(--border-width) solid var(--border-color);
            color: var(--text-codeblock);
            padding: 6px var(--space-sm);
            border-radius: var(--radius-sm);
            font-size: 13px;
            white-space: nowrap;
            overflow-x: auto;
            min-width: 0;
        }

        .enable-word-wrap .view-cmd-payload-box {
            white-space: pre-wrap !important;
            word-break: break-all !important;
        }

        .toggle-wrap-container {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .icon-copy-action-btn {
            width: 32px;
            height: 32px;
            background: var(--bg-color);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background var(--transition-fast), border-color var(--transition-fast);
        }
        .icon-copy-action-btn:active {
            transform: scale(0.98);
        }
        .icon-copy-action-btn img {
            width: 14px;
            height: 14px;
        }

        .btn {
            background: var(--accent-dark);
            border: none;
            color: var(--text-bright);
            padding: var(--space-sm) var(--space-lg);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 600;
            transition: background var(--transition-fast);
        }
        .btn:hover {
            background: var(--accent-dark-hover);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background: var(--box-bg);
            border: var(--border-width) solid var(--border-color);
            color: var(--text-main);
        }
        .btn-secondary:hover {
            border-color: var(--accent-light);
            color: var(--text-bright);
        }

        /* Footer Rules */
        .footer {
            margin-top: var(--space-2xl, 32px);
            padding-bottom: var(--space-lg, 16px);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: var(--space-sm, 8px);
            align-items: center;
            width: 100%;
        }

        .footer-title {
            font-size: 12px;
            color: var(--text-muted, #5a5a66);
            opacity: 0.75;
            letter-spacing: 0.5px;
        }

        .footer-links {
            display: flex;
            gap: var(--space-md, 12px);
            flex-wrap: wrap;
            justify-content: center;
        }

        .footer-links a {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-light, #A77A99);
            text-decoration: none;
            font-size: 13px;
            opacity: 0.85;
            transition: opacity var(--transition-fast, 0.15s), color var(--transition-fast, 0.15s);
        }

        .footer-links a:hover {
            color: var(--accent-light-hover, #c5a4bc);
            opacity: 1;
        }

        .footer-links img {
            color-scheme: dark !important;
            width: 16px;
            height: 16px;
            filter: brightness(0) invert(1) !important;
            opacity: 0.9;
        }

        .footer-links a.kofi {
            color: #ff5fa2;
            font-weight: 500;
        }

        .footer-links a.kofi:hover {
            color: #ff8fc0;
        }

        .footer-links a.kofi img {
            width: 20px;
            height: 20px;
            filter: brightness(0) invert(1) !important; 
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <div class="title-block" id="header-title-block">
                <h1 id="app-display-header" onclick="routeReturnHomeDashboard()">Command Block Creation</h1>
            </div>
            <div class="header-actions">
                <a href="upload/formatter.html" class="upload-btn-link" title="Upload Formatter">
                    <img src="https://raw.githubusercontent.com/nako-hikari/support-files/main/assets/upload.png" alt="Upload">
                </a>
            </div>
        </header>

        <main id="app-view-router-canvas">
            <div style="text-align: center; color: var(--text-muted); padding: 32px;">Loading commands...</div>
        </main>

        <div class="footer">
            <div class="footer-title">By Nako Hikari</div>
            <div class="footer-links">
                <a href="https://github.com/nako-hikari/" target="_blank" class="social">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" alt="GitHub">
                    GitHub
                </a>
                <a href="https://m.youtube.com/@NaCryst" target="_blank" class="social">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="YouTube">
                    YouTube
                </a>
                <a href="https://www.tiktok.com/@nako_hikari_mc" target="_blank" class="social">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg" alt="TikTok">
                    TikTok
                </a>
                <a href="https://ko-fi.com/arialicee" target="_blank" class="social kofi">
                    <img src="https://raw.githubusercontent.com/nako-hikari/support-files/main/assets/kofi-icon.png" alt="Ko-fi">
                    Support me on Ko-fi
                </a>
            </div>
        </div>
    </div>

    <script>
        const COMMAND_FILES = [
            "something.txt",
            "test.txt",
            "throw-tnt.txt",
            "yet-to-finish.txt"
        ];

        let cachedParsedIndexDataset = [];
        const CDNBASESRC = "https://raw.githubusercontent.com/nako-hikari/nako-hikari.github.io/main/assets/images";

        window.addEventListener('DOMContentLoaded', initializeApp);
        window.addEventListener('hashchange', readLocationHashRouteToken);

        async function initializeApp() {
            const fetchPromises = COMMAND_FILES.map(async (fileName) => {
                try {
                    const res = await fetch(`commands/${fileName}`);
                    if (!res.ok) throw new Error();
                    const data = await res.text();

                    let cleanName = fileName.substring(0, fileName.lastIndexOf('.')).replace(/_/g, ' ');
                    let title = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
                    let desc = "No descriptor statement declared.";
                    let tags = [];
                    let credit = null;

                    const segments = data.split('\n\n');
                    if (segments[0]) {
                        segments[0].split('\n').forEach(line => {
                            if (line.startsWith('TITLE:')) title = line.replace('TITLE:', '').trim();
                            if (line.startsWith('DESC:')) desc = line.replace('DESC:', '').trim();
                            if (line.startsWith('TAG:')) tags = line.replace('TAG:', '').split(',').map(t => t.trim());
                            if (line.startsWith('CREDIT:')) credit = line.replace('CREDIT:', '').trim();
                        });
                    }

                    return { file: fileName, parsedTitle: title, parsedDesc: desc, parsedTags: tags, parsedCredit: credit, rawPayload: data };
                } catch {
                    let cleanName = fileName.substring(0, fileName.lastIndexOf('.'));
                    return { file: fileName, parsedTitle: cleanName, parsedDesc: "Failed to download asset.", parsedTags: [], parsedCredit: null, rawPayload: null };
                }
            });

            cachedParsedIndexDataset = await Promise.all(fetchPromises);
            readLocationHashRouteToken();
        }

        function readLocationHashRouteToken() {
            const currentHash = decodeURIComponent(window.location.hash.replace('#', '')).trim().toLowerCase();
            if (currentHash && cachedParsedIndexDataset.length > 0) {
                const match = cachedParsedIndexDataset.find(c => c.file.toLowerCase() === currentHash || c.file.toLowerCase() === currentHash + '.txt');
                if (match) {
                    renderFocusedDisplay(match);
                    return;
                }
            }
            renderHomeGrid();
        }

        function updateHeader(isViewer = false) {
            const titleBlock = document.getElementById('header-title-block');
            if (isViewer) {
                titleBlock.innerHTML = `
                    <button class="btn btn-secondary" onclick="routeReturnHomeDashboard()">←</button>
                    <h1 onclick="routeReturnHomeDashboard()">Command Block Creation</h1>
                `;
            } else {
                titleBlock.innerHTML = `<h1 onclick="routeReturnHomeDashboard()">Command Block Creation</h1>`;
            }
        }

        function renderHomeGrid() {
            updateHeader(false);
            const canvas = document.getElementById('app-view-router-canvas');
            canvas.innerHTML = `
                <div class="search-container">
                    <input type="text" class="search-box" placeholder="Search creations by title or tag keywords..." oninput="handleSearch(this.value)">
                </div>
                <div class="creation-grid" id="cards-container"></div>
            `;
            injectCards(cachedParsedIndexDataset);
        }

        function injectCards(dataset) {
            const container = document.getElementById('cards-container');
            if (!container) return;
            container.innerHTML = '';

            dataset.forEach(item => {
                const card = document.createElement('div');
                card.className = 'creation-card';
                card.onclick = () => { window.location.hash = encodeURIComponent(item.file); };

                let tagPillsStr = item.parsedTags.map(t => `<span class="tag-pill">${t}</span>`).join(' ');
                card.innerHTML = `
                    <div class="card-title">${escapeHtml(item.parsedTitle)}</div>
                    <div class="card-desc">${escapeHtml(item.parsedDesc)}</div>
                    <div class="tag-pill-container">${tagPillsStr}</div>
                `;
                container.appendChild(card);
            });
        }

        function handleSearch(q) {
            const query = q.toLowerCase().trim();
            if (!query) {
                injectCards(cachedParsedIndexDataset);
                return;
            }
            const filtered = cachedParsedIndexDataset.filter(item => 
                item.parsedTitle.toLowerCase().includes(query) || 
                item.parsedDesc.toLowerCase().includes(query) || 
                item.parsedTags.some(t => t.toLowerCase().includes(query))
            );
            injectCards(filtered);
        }

        function renderFocusedDisplay(item) {
            updateHeader(true);
            const canvas = document.getElementById('app-view-router-canvas');
            canvas.innerHTML = '';

            const container = document.createElement('div');
            container.className = 'viewer-card';

            const actionRow = document.createElement('div');
            actionRow.className = 'viewer-action-row';

            const metaCol = document.createElement('div');
            metaCol.innerHTML = `
                <div class="render-title">${escapeHtml(item.parsedTitle)}</div>
                <div class="render-desc">${escapeHtml(item.parsedDesc)}</div>
            `;

            const rightActions = document.createElement('div');
            rightActions.style.cssText = 'display: flex; align-items: center; gap: 12px;';
            rightActions.innerHTML = `
                <label class="toggle-wrap-container">
                    <input type="checkbox" onchange="document.getElementById('app-view-router-canvas').classList.toggle('enable-word-wrap', this.checked)"> Wrap
                </label>
                <button class="btn" onclick="copyShareLink('${encodeURIComponent(item.file)}', this)">Share</button>
            `;

            actionRow.appendChild(metaCol);
            actionRow.appendChild(rightActions);
            container.appendChild(actionRow);

            const elementsWrapper = document.createElement('div');
            elementsWrapper.style.cssText = 'display: flex; flex-direction: column; gap: 8px;';

            let activeChainStackElement = null;
            let currentChainRowIndex = 0;

            const segments = item.rawPayload ? item.rawPayload.split('\n\n') : [];
            segments.forEach(seg => {
                const lines = seg.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length === 0) return;

                const baseLine = lines[0];

                if (/^H[1-5]:/.test(baseLine)) {
                    activeChainStackElement = null;
                    const tier = baseLine.match(/^H[1-5]/)[0].toLowerCase();
                    const headerEl = document.createElement('div');
                    headerEl.className = `view-${tier}`;
                    headerEl.innerText = baseLine.replace(/^H[1-5]:/, '').trim();
                    elementsWrapper.appendChild(headerEl);
                } else if (baseLine.startsWith('TEXT:')) {
                    activeChainStackElement = null;
                    const textEl = document.createElement('p');
                    textEl.className = 'view-text';
                    textEl.innerText = baseLine.replace('TEXT:', '').trim();
                    elementsWrapper.appendChild(textEl);
                } else if (baseLine.startsWith('CMD:')) {
                    if (!activeChainStackElement) {
                        activeChainStackElement = document.createElement('div');
                        activeChainStackElement.className = 'connected-chain-group';
                        elementsWrapper.appendChild(activeChainStackElement);
                        currentChainRowIndex = 0;
                    }

                    for (let i = 0; i < lines.length; i += 2) {
                        if (!lines[i] || !lines[i].startsWith('CMD:')) continue;
                        currentChainRowIndex++;
                        const metaTokens = lines[i].split(':');
                        const commandStringPayload = lines[i+1] || '';

                        const modeToken = (metaTokens[1] || 'C').toUpperCase();
                        const condToken = (metaTokens[3] || 'U').toUpperCase();

                        let filePrefix = modeToken.toLowerCase();
                        let fileSuffix = condToken.toLowerCase().startsWith('c') ? 'cn' : 'un';
                        let blockGraphicSrc = `${CDNBASESRC}/${filePrefix}-${fileSuffix}.png`;

                        const rowNode = document.createElement('div');
                        rowNode.className = 'view-cmd-row';
                        rowNode.innerHTML = `
                            <div class="view-row-idx">${currentChainRowIndex}</div>
                            <div class="block-interactive-wrapper">
                                <img src="${blockGraphicSrc}" class="block-face-texture-node" alt="Block">
                            </div>
                            <div class="view-cmd-payload-box">${escapeHtml(commandStringPayload)}</div>
                            <div class="icon-copy-action-btn" onclick="copyRowPayload(this)"><img src="${CDNBASESRC}/copy.png" alt="Copy"></div>
                        `;
                        activeChainStackElement.appendChild(rowNode);
                    }
                }
            });

            container.appendChild(elementsWrapper);
            canvas.appendChild(container);
        }

        function routeReturnHomeDashboard() {
            window.location.hash = '';
            renderHomeGrid();
        }

        function copyShareLink(fileHash, btn) {
            navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}#${fileHash}`);
            btn.innerText = 'Copied!';
            setTimeout(() => { btn.innerText = 'Share'; }, 1200);
        }

        function copyRowPayload(btnNode) {
            const txt = btnNode.parentElement.querySelector('.view-cmd-payload-box').innerText;
            navigator.clipboard.writeText(txt);
            btnNode.style.background = 'var(--success-bg)';
            btnNode.style.borderColor = 'var(--success-border)';
            setTimeout(() => {
                btnNode.style.background = '';
                btnNode.style.borderColor = '';
            }, 800);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Submissions</title>

    <style>
        :root {
            --bg: #0e0e11;
            --card: #18181f;
            --input: #0f0f12;
            --border: #2d2d38;
            --text: #b4b4bc;
            --bright: #ffffff;
            --accent: #663657;
            --accent-hover: #81456e;
            --danger: #4a2323;
            --danger-hover: #6e3333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .wrapper {
            width: 100%;
            max-width: 950px;
            margin: auto;
        }

        h1 {
            margin: 0 0 20px;
            color: var(--bright);
            font-size: 1.4rem;
        }

        /* LOGIN */

        #login-screen {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .login-card h1 {
            margin-bottom: 8px;
        }

        .login-card p {
            font-size: 13px;
            margin: 0 0 16px;
        }

        .login-input {
            width: 100%;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 10px;
            color: var(--bright);
            outline: none;
            margin-bottom: 10px;
        }

        .login-input:focus {
            border-color: #a77a99;
        }

        .login-button {
            width: 100%;
        }

        .login-error {
            color: #d47c7c;
            font-size: 12px;
            margin-top: 10px;
        }

        /* ADMIN */

        #admin-screen {
            display: none;
        }

        .admin-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .admin-toolbar h1 {
            margin: 0;
        }

        #submissions {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .submission {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .submission-title {
            margin: 0 0 10px;
            color: var(--bright);
            font-size: 1.1rem;
        }

        .meta {
            color: var(--text);
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .content {
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family:
                ui-monospace,
                "SF Mono",
                "JetBrains Mono",
                monospace;
            color: #c77e4f;
            font-size: 13px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        button {
            border: none;
            border-radius: 4px;
            padding: 8px 14px;
            color: white;
            background: var(--accent);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .reject-btn {
            background: var(--danger);
        }

        .reject-btn:hover {
            background: var(--danger-hover);
        }

        .logout-btn {
            background: var(--input);
            border: 1px solid var(--border);
        }

        .logout-btn:hover {
            border-color: #a77a99;
        }

        .empty {
            color: #5a5a66;
            text-align: center;
            padding: 30px;
        }

        .error {
            color: #d47c7c;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
        }
    </style>
</head>

<body>

<!-- LOGIN -->

<div id="login-screen">

    <div class="login-card">

        <h1>Admin Login</h1>

        <p>
            Enter the admin key to manage command submissions.
        </p>

        <input
            id="admin-key"
            class="login-input"
            type="password"
            placeholder="Admin key"
            autocomplete="current-password"
        >

        <button
            id="login-button"
            class="login-button"
        >
            LOGIN
        </button>

        <div
            id="login-error"
            class="login-error"
        ></div>

    </div>

</div>


<!-- ADMIN -->

<div
    id="admin-screen"
    class="wrapper"
>

    <div class="admin-toolbar">

        <h1>Pending Command Submissions</h1>

        <button
            id="logout-button"
            class="logout-btn"
        >
            LOGOUT
        </button>

    </div>

    <div id="submissions">
        Loading...
    </div>

</div>


<script>

async function checkAuthentication() {

    try {

        const response =
            await fetch("/api/admin-auth");

        if (response.ok) {

            showAdminScreen();
            loadSubmissions();

        } else {

            showLoginScreen();

        }

    } catch {

        showLoginScreen();

    }
}


function showLoginScreen() {

    document.getElementById(
        "login-screen"
    ).style.display = "flex";

    document.getElementById(
        "admin-screen"
    ).style.display = "none";
}


function showAdminScreen() {

    document.getElementById(
        "login-screen"
    ).style.display = "none";

    document.getElementById(
        "admin-screen"
    ).style.display = "block";
}


/*
 * LOGIN
 */

document
    .getElementById("login-button")
    .addEventListener("click", login);


document
    .getElementById("admin-key")
    .addEventListener("keydown", event => {

        if (event.key === "Enter") {
            login();
        }

    });


async function login() {

    const input =
        document.getElementById("admin-key");

    const button =
        document.getElementById("login-button");

    const error =
        document.getElementById("login-error");

    const key =
        input.value;

    if (!key) {

        error.textContent =
            "Enter the admin key.";

        return;
    }

    button.disabled = true;
    button.textContent = "LOGGING IN...";
    error.textContent = "";

    try {

        const response =
            await fetch("/api/admin-login", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    key: key
                })

            });

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "Login failed"
            );

        }

        input.value = "";

        showAdminScreen();

        loadSubmissions();

    } catch (err) {

        error.textContent =
            err.message;

    } finally {

        button.disabled = false;
        button.textContent = "LOGIN";

    }
}


/*
 * LOAD SUBMISSIONS
 */

async function loadSubmissions() {

    const container =
        document.getElementById(
            "submissions"
        );

    container.innerHTML =
        "Loading...";

    try {

        const response =
            await fetch("/api/pending");

        if (response.status === 401) {

            showLoginScreen();

            return;
        }

        if (!response.ok) {

            throw new Error(
                "Failed to load submissions"
            );

        }

        const submissions =
            await response.json();

        if (submissions.length === 0) {

            container.innerHTML =
                '<div class="empty">No pending submissions.</div>';

            return;
        }

        container.innerHTML = "";

        submissions.forEach(
            submission => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "submission";

                const titleMatch =
                    submission.content.match(
                        /^TITLE: (.*)$/m
                    );

                const title =
                    titleMatch
                        ? titleMatch[1]
                        : "Untitled";

                card.innerHTML = `

                    <h2 class="submission-title">
                        ${escapeHtml(title)}
                    </h2>

                    <div class="meta">

                        <strong>Author:</strong>
                        ${escapeHtml(
                            submission.author
                        )}

                        <br>

                        <strong>ID:</strong>
                        ${escapeHtml(
                            submission.id
                        )}

                        <br>

                        <strong>Submitted:</strong>
                        ${escapeHtml(
                            submission.submittedAt
                        )}

                    </div>

                    <div class="content"></div>

                    <div class="actions">

                        <button class="approve-btn">
                            APPROVE
                        </button>

                        <button class="reject-btn">
                            REJECT
                        </button>

                    </div>
                `;

                card.querySelector(
                    ".content"
                ).textContent =
                    submission.content;


                /*
                 * APPROVE
                 */

                card.querySelector(
                    ".approve-btn"
                ).addEventListener(
                    "click",
                    async () => {

                        const approveButton =
                            card.querySelector(
                                ".approve-btn"
                            );

                        const rejectButton =
                            card.querySelector(
                                ".reject-btn"
                            );

                        approveButton.disabled =
                            true;

                        rejectButton.disabled =
                            true;

                        approveButton.textContent =
                            "APPROVING...";

                        try {

                            const response =
                                await fetch(
                                    "/api/approve",
                                    {
                                        method: "POST",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        body:
                                            JSON.stringify({
                                                filename:
                                                    submission.filename
                                            })
                                    }
                                );

                            const result =
                                await response.json();

                            if (!response.ok) {

                                throw new Error(
                                    result.details ||
                                    result.error ||
                                    "Approval failed"
                                );

                            }

                            card.remove();

                        } catch (error) {

                            alert(
                                "Approval failed: " +
                                error.message
                            );

                            approveButton.disabled =
                                false;

                            rejectButton.disabled =
                                false;

                            approveButton.textContent =
                                "APPROVE";

                        }

                    }
                );


                /*
                 * REJECT
                 */

                card.querySelector(
                    ".reject-btn"
                ).addEventListener(
                    "click",
                    async () => {

                        const approveButton =
                            card.querySelector(
                                ".approve-btn"
                            );

                        const rejectButton =
                            card.querySelector(
                                ".reject-btn"
                            );

                        const confirmed =
                            confirm(
                                "Reject this command submission?"
                            );

                        if (!confirmed) {
                            return;
                        }

                        approveButton.disabled =
                            true;

                        rejectButton.disabled =
                            true;

                        rejectButton.textContent =
                            "REJECTING...";

                        try {

                            const response =
                                await fetch(
                                    "/api/reject",
                                    {
                                        method: "POST",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        body:
                                            JSON.stringify({
                                                filename:
                                                    submission.filename
                                            })
                                    }
                                );

                            const result =
                                await response.json();

                            if (!response.ok) {

                                throw new Error(
                                    result.details ||
                                    result.error ||
                                    "Rejection failed"
                                );

                            }

                            card.remove();

                        } catch (error) {

                            alert(
                                "Rejection failed: " +
                                error.message
                            );

                            approveButton.disabled =
                                false;

                            rejectButton.disabled =
                                false;

                            rejectButton.textContent =
                                "REJECT";

                        }

                    }
                );


                container.appendChild(
                    card
                );

            }
        );

    } catch (error) {

        container.innerHTML = `
            <div class="error">
                Error:
                ${escapeHtml(error.message)}
            </div>
        `;

    }
}


/*
 * LOGOUT
 *
 * The session cookie is HttpOnly,
 * so JavaScript cannot directly delete it.
 *
 * For now this simply returns to
 * the login screen. The session itself
 * expires after 24 hours.
 */

document
    .getElementById("logout-button")
    .addEventListener("click", () => {

        showLoginScreen();

    });


function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}


/*
 * START
 */

checkAuthentication();

</script>

</body>
</html>

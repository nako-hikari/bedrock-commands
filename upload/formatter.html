<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Chain Formatter</title>
    <link rel="stylesheet" href="/css/nako.css">
    <style>
        body { align-items: center; justify-content: flex-start; }

        .select-inline { width: auto; }

        .form-row {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 150px;
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .meta-card {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .tag-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: var(--space-sm);
            background: var(--input-bg);
            padding: var(--space-sm);
            border-radius: var(--radius-sm);
            border: var(--border-width) solid var(--border-color);
        }

        .tag-checkbox-label {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: var(--fs-xs);
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
        }

        .controls-toolbar {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            align-items: center;
            padding: var(--space-sm) var(--space-md);
        }

        .toolbar-divider {
            border-left: var(--border-width) solid var(--border-color);
            height: 20px;
            margin: 0 var(--space-xs);
        }

        .group-block {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            position: relative;
            transition: transform var(--transition-slow), box-shadow var(--transition-slow), background-color var(--transition-normal);
        }

        .group-block[data-item-type="header"] { border-left: 4px solid var(--accent-light); }
        .group-block[data-item-type="text"] { border-left: 4px solid var(--accent-dark-300); }
        .group-block[data-item-type="note"] { border-left: 4px solid var(--accent-light); }
        .group-block[data-item-type="note"][data-note-color="green"] { border-left-color: var(--green); }
        .group-block[data-item-type="note"][data-note-color="red"] { border-left-color: var(--red); }
        .group-block[data-item-type="note"][data-note-color="yellow"] { border-left-color: var(--yellow); }
        .group-block[data-item-type="chain-group"] { border-left: 4px solid var(--accent-dark); }
        .group-block[data-item-type="link-group"] { border-left: 4px solid var(--accent-dark-700); }
        .group-block[data-item-type="img-group"] { border-left: 4px solid var(--accent-dark-300); }
        .group-block[data-item-type="embed-group"] { border-left: 4px solid var(--accent-dark-700); }
        .group-block[data-item-type="bullet-group"] { border-left: 4px solid var(--accent-dark-100); }

        .block-moving-flash {
            background-color: var(--accent-dark-50) !important;
            box-shadow: var(--shadow-soft);
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border-width) solid var(--border-color);
            padding-bottom: var(--space-xs);
            gap: var(--space-sm);
        }

        .group-title {
            font-size: var(--fs-xs);
            text-transform: uppercase;
            letter-spacing: var(--ls-wide);
            font-weight: var(--fw-bold, var(--fw-semibold));
            color: var(--accent-light);
        }

        .group-block.is-collapsed > *:not(.group-header) { display: none; }

        .block-action-cluster {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .connected-chain-stack {
            display: flex;
            flex-direction: column;
            background: var(--input-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .cmd-row-node {
            display: flex;
            flex-direction: column;
            padding: var(--space-sm);
            gap: var(--space-sm);
            border-bottom: var(--border-width) solid var(--border-color);
            position: relative;
            padding-left: 36px;
            transition: transform var(--transition-slow), background-color var(--transition-normal);
        }

        .cmd-row-node:last-child { border-bottom: none; }

        .cmd-row-node.color-c { background-color: color-mix(in srgb, var(--chain) 6%, transparent); }
        .cmd-row-node.color-i { background-color: color-mix(in srgb, var(--impulse) 6%, transparent); }
        .cmd-row-node.color-r { background-color: color-mix(in srgb, var(--repeat) 6%, transparent); }
        .cmd-row-node.color-chat { background-color: color-mix(in srgb, var(--accent-light) 6%, transparent); }
        .cmd-row-node.color-npc { background-color: color-mix(in srgb, var(--accent-dark) 10%, transparent); }
        .cmd-row-node.color-code { background-color: color-mix(in srgb, var(--accent-dark-700) 8%, transparent); }
        .cmd-row-node.cond-border { box-shadow: inset 0 0 0 var(--border-width) var(--text-bright); }

        .row-index-container {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background-color: var(--chain);
            padding: 4px 0;
        }

        .row-index {
            font-family: var(--font-mono);
            font-weight: var(--fw-bold, var(--fw-semibold));
            color: var(--text-on-brand);
            font-size: var(--fs-xs);
            user-select: none;
        }

        .row-nav-btn {
            background: none;
            border: none;
            color: var(--text-on-brand);
            font-size: 9px;
            cursor: pointer;
            padding: 2px;
            line-height: 1;
            opacity: 0.7;
            transition: opacity var(--transition-fast);
            user-select: none;
        }
        .row-nav-btn:hover { opacity: 1; }

        .cmd-row-node.color-c .row-index-container { background-color: var(--chain); }
        .cmd-row-node.color-i .row-index-container { background-color: var(--impulse); }
        .cmd-row-node.color-r .row-index-container { background-color: var(--repeat); }
        .cmd-row-node.color-chat .row-index-container { background-color: var(--accent-light); }
        .cmd-row-node.color-npc .row-index-container { background-color: var(--accent-dark); }
        .cmd-row-node.color-code .row-index-container { background-color: var(--accent-dark-700); }

        .row-controls-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            row-gap: var(--space-xs);
            gap: var(--space-sm);
            width: 100%;
        }

        .row-controls-line > .remove-row-btn {
            flex-shrink: 0;
        }

        .inline-selector-set {
            display: flex;
            flex-wrap: wrap;
            row-gap: 4px;
            gap: 4px;
            flex-shrink: 1;
            min-width: 0;
            align-items: center;
        }

        .inline-selector-set select {
            padding: 4px var(--space-xs);
            font-size: var(--fs-xs);
            font-weight: var(--fw-bold, var(--fw-semibold));
            height: 28px;
            width: auto !important;
            min-width: 0;
            flex-shrink: 0;
        }

        .inline-selector-set input.row-tick {
            width: 34px !important;
            min-width: 0;
            max-width: 34px;
            flex-shrink: 0;
            box-sizing: border-box;
            text-align: center;
            padding: 4px 2px;
            font-size: var(--fs-xs);
            height: 28px;
        }

        .cmd-input-container {
            display: flex;
            width: 100%;
            gap: var(--space-sm);
        }

        .cmd-input-field { flex: 1; }

        textarea.cmd-input-field {
            height: 72px;
            resize: vertical;
            line-height: var(--lh-normal);
        }

        .bulk-paste-zone {
            background: var(--accent-dark-50);
            border: var(--border-width) dashed var(--border-color);
            padding: var(--space-sm);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .bulk-paste-zone textarea { height: 55px; font-size: var(--fs-xs); }

        .bullet-item-stack {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .bullet-item-row {
            display: flex;
            align-items: flex-start;
            gap: var(--space-sm);
        }

        .bullet-item-row .bullet-item-val {
            flex: 1;
            height: 44px;
            font-family: inherit;
            resize: vertical;
        }

        .link-extra-fields {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            padding: var(--space-sm);
            background: var(--input-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-sm);
        }

        .conditional-field-row {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .output-container-actions {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }

        .mode-picker-btn {
            height: 28px;
            padding: 0 10px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: var(--fs-xs);
            font-weight: var(--fw-bold, var(--fw-semibold));
            color: var(--text-on-brand);
            cursor: pointer;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .mode-picker-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .mode-option-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            border: var(--border-width) solid var(--border-color);
            background: var(--input-bg);
            cursor: pointer;
            font-size: var(--fs-md);
            color: var(--text-bright);
            text-align: center;
            width: 100%;
            position: relative;
        }

        .mode-option-row:hover { background: var(--accent-dark-50); }
        .mode-option-row.is-current { border-color: var(--accent-light); }

        .mode-check {
            position: absolute;
            right: var(--space-md);
            top: 50%;
            transform: translateY(-50%);
        }

        .mode-swatch {
            width: 16px;
            height: 16px;
            border-radius: var(--radius-full);
            flex-shrink: 0;
        }

        /* Shares .theme-toggle's box (size/shape/border) from nako.css so
           the two buttons are visually identical; only the fill differs. */
        .fs-trigger-btn {
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--accent-dark);
            padding: 0;
        }

        .fs-editor-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            z-index: calc(var(--z-modal) - 1);
            display: none;
            flex-direction: column;
        }

        .fs-editor-header {
            display: flex;
            align-items: center;
            padding: var(--space-md);
            border-bottom: var(--border-width) solid var(--border-color);
            flex-shrink: 0;
            gap: var(--space-md);
        }

        .fs-editor-body {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .fs-editor-body textarea {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            background: var(--bg-color);
            color: var(--text-bright);
            font-family: var(--font-mono);
            font-size: var(--fs-lg);
            padding: var(--space-lg);
            line-height: var(--lh-relaxed);
        }

        .mc-color-preview {
            display: none;
            margin-top: 4px;
            padding: 6px 8px;
            background: var(--input-bg);
            border: var(--border-width) dashed var(--border-color);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono, monospace);
            font-size: var(--fs-xs);
            white-space: pre-wrap;
            word-break: break-word;
            line-height: var(--lh-normal);
        }

        .draft-restore-note {
            font-size: var(--fs-xs);
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            body { padding: var(--space-lg) var(--space-sm); }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="theme-toggle-row">
            <button class="theme-toggle fs-trigger-btn interactive" id="fullscreen-edit-trigger" aria-label="Expand editor">
                <img class="icon icon-on-brand" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/expand.png" alt="">
            </button>
            <button class="theme-toggle interactive" onclick="toggleTheme()" aria-label="Toggle theme">
                <img id="theme-icon" class="icon" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/moon.png" alt="">
            </button>
        </div>

        <header style="display: flex; align-items: center; gap: var(--space-md); justify-content: center; position: relative;">
            <button class="icon-button interactive" style="position: absolute; left: 0;" onclick="confirmBackToMain()" aria-label="Back">
                <img class="icon icon-lg" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/back_arrow.png" alt="Back">
            </button>
            <h1>Command Chain Formatter</h1>
        </header>

        <section class="card meta-card">
            <button class="secondary interactive" style="width: 100%;" onclick="openEditImportModal()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/edit_pencil.png" alt=""> Edit Existing Creation
            </button>
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Creation Title</label>
                    <input type="text" id="meta-title" placeholder="yo cmd name here..">
                </div>
                <div class="form-group">
                    <label class="field-label">Credit</label>
                    <input type="text" id="meta-credit" value="Nako Hikari" placeholder="Nako Hikari">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Description</label>
                    <input type="text" id="meta-desc" placeholder="desc if u ain't lazy here..">
                </div>
            </div>
            <div class="form-group">
                <label class="field-label">Tags Selection</label>
                <div class="tag-grid" id="tag-checkbox-list">
                    <label class="tag-checkbox-label"><input type="checkbox" value="particle" onchange="compilerCoreEngine()"> particle</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="functional" onchange="compilerCoreEngine()"> functional</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="weapon" onchange="compilerCoreEngine()"> weapon</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="random" onchange="compilerCoreEngine()"> random</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="technique" onchange="compilerCoreEngine()"> technique</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="complex" onchange="compilerCoreEngine()"> complex</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="visual" onchange="compilerCoreEngine()"> visual</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="fun" onchange="compilerCoreEngine()"> fun</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="playanimation" onchange="compilerCoreEngine()"> playanimation</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="fmbe" onchange="compilerCoreEngine()"> fmbe</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="experimental" onchange="compilerCoreEngine()"> experimental</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="unique" onchange="compilerCoreEngine()"> unique</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="minigame" onchange="compilerCoreEngine()"> minigame</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="boss" onchange="compilerCoreEngine()"> boss</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="tools" onchange="compilerCoreEngine()"> tools</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="game-breaking" onchange="compilerCoreEngine()"> game breaking</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="text-score" onchange="compilerCoreEngine()"> text & score</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="quirks" onchange="compilerCoreEngine()"> quirks</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="how-to-use" onchange="compilerCoreEngine()"> how to use</label>
                </div>
            </div>
        </section>

        <section class="card controls-toolbar">
            <button class="primary interactive" onclick="addChainGroup()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/command_block.png" alt=""> Add Command Block
            </button>
            <div class="toolbar-divider"></div>

            <button type="button" id="header-tier-picker-btn" class="mode-picker-btn interactive" data-tier="H1" style="background: var(--accent-dark);" onclick="openHeaderTierPicker()">H1</button>
            <button class="secondary interactive" onclick="addHeaderBlock()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/header_text.png" alt=""> Add Header
            </button>
            <button class="secondary interactive" onclick="addBodyTextBlock()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/paragraph_text.png" alt=""> Add Body Text
            </button>
            <button class="secondary interactive" onclick="addNoteBlock()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/note.png" alt=""> Add Note
            </button>
            <button class="secondary interactive" onclick="addBulletGroup()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/bullet_list.png" alt=""> Add Bullet List
            </button>

            <div class="toolbar-divider"></div>
            <button class="secondary interactive" onclick="addLinkBlock()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/link_chain.png" alt=""> Add Link
            </button>
            <button class="secondary interactive" onclick="addImageBlock()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/image.png" alt=""> Add Image
            </button>
            <button class="secondary interactive" onclick="addEmbedBlock()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/video_embed.png" alt=""> Add Embed

            <div class="toolbar-divider"></div>
            <button class="secondary interactive" onclick="insertLineBreak()" title="Click into a Body Text, Note or Bullet Item field first, then press this to drop in a break at your cursor">

            </button>

        <main id="builder-canvas"></main>

        <section class="card">
            <div class="group-header">
                <span class="group-title">Formatted Raw Text String Output</span>
            </div>
            <div class="output-box output-container" id="raw-string-output">Your output lines are generated automatically...</div>
            <div class="output-container-actions">

                <button class="secondary interactive" onclick="exportAsTxtFile()">

                </button>
                <button class="secondary interactive" onclick="previewCreation()">

                </button>
                <button class="primary interactive" onclick="uploadContent()">
                    <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/upload.png" alt=""> Upload
                </button>
            </div>
        </section>

        <div class="footer">
            <div class="footer-title">Nako Hikari</div>
            <div class="footer-links">
                <a href="https://github.com/nako-hikari/" target="_blank" class="social">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" alt="GitHub">
                    GitHub
                </a>
                <a href="https://m.youtube.com/@NaCryst" target="_blank" class="social">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="YouTube">
                    YouTube
                </a>
                <a href="https://www.tiktok.com/@nako_hikari_mc" target="_blank" class="social">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg" alt="TikTok">
                    TikTok
                </a>
                <a href="https://ko-fi.com/arialicee" target="_blank" class="social kofi">
                    <img src="https://raw.githubusercontent.com/nako-hikari/support-files/main/assets/kofi-icon.png" alt="Ko-fi">
                    Support me on Ko-fi
                </a>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="nakoModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="nakoModalTitle"></h2>
                <button class="modal-close interactive" onclick="closeNakoModal()" aria-label="Close">
                    <img class="icon" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/close.png" alt="">
                </button>
            </div>
            <div class="modal-body" id="nakoModalBody"></div>
            <div class="modal-footer" id="nakoModalFooter"></div>
        </div>
    </div>

    <div class="fs-editor-overlay" id="fullscreen-editor-overlay">
        <div class="fs-editor-header">
            <button class="icon-button interactive" id="fullscreen-editor-close" aria-label="Close editor">
                <img class="icon icon-lg" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/close.png" alt="">
            </button>
            <span class="group-title">Editing</span>
        </div>
        <div class="fs-editor-body" id="fullscreen-editor-body"></div>
    </div>

    <script>
        const canvas = document.getElementById('builder-canvas');
        const creditInput = document.getElementById('meta-credit');
        const DRAFT_KEY = 'nako_formatter_draft';

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        /* LIVE §-CODE COLOR PREVIEW — shows how Minecraft "§" formatting
           codes will render, right under the field, updated as you type.
           This intentionally does NOT touch the real field itself (no
           transparent-text/backdrop-overlay trick): that approach previously
           caused a background rendering bug in light theme. A separate
           read-only preview line is simpler and can't affect the field's
           own theming. The §-code marker itself is kept visible (not
           hidden), colored to match what it does, at 50% opacity so it
           reads as a marker rather than content. */
        const MC_COLORS = {
            '0': '#000000', '1': '#0000AA', '2': '#00AA00', '3': '#00AAAA',
            '4': '#AA0000', '5': '#AA00AA', '6': '#FFAA00', '7': '#AAAAAA',
            '8': '#555555', '9': '#5555FF', 'a': '#55FF55', 'b': '#55FFFF',
            'c': '#FF5555', 'd': '#FF55FF', 'e': '#FFFF55', 'f': '#FFFFFF'
        };

        function renderMcPreviewHtml(rawStr) {
            const escaped = escapeHtml(rawStr);
            let html = '', buffer = '', color = null, styles = [];
            const flush = () => {
                if (!buffer) return;
                const styleAttr = (color ? `color:${color};` : '') + styles.join('');
                html += styleAttr ? `<span style="${styleAttr}">${buffer}</span>` : buffer;
                buffer = '';
            };
            for (let i = 0; i < escaped.length; i++) {
                if (escaped[i] === '§' && i + 1 < escaped.length) {
                    flush();
                    const rawCode = escaped[i + 1];
                    const code = rawCode.toLowerCase();

                    let markerColor = MC_COLORS[code] || null;
                    let markerStyles = [];
                    if (code === 'l') markerStyles.push('font-weight:bold;');
                    else if (code === 'm') markerStyles.push('text-decoration:line-through;');
                    else if (code === 'n') markerStyles.push('text-decoration:underline;');
                    else if (code === 'o') markerStyles.push('font-style:italic;');
                    const markerStyleAttr = 'opacity:0.5;' + (markerColor ? `color:${markerColor};` : '') + markerStyles.join('');
                    html += `<span style="${markerStyleAttr}">§${rawCode}</span>`;

                    if (MC_COLORS[code]) { color = MC_COLORS[code]; styles = []; }
                    else if (code === 'r') { color = null; styles = []; }
                    else if (code === 'l') styles.push('font-weight:bold;');
                    else if (code === 'm') styles.push('text-decoration:line-through;');
                    else if (code === 'n') styles.push('text-decoration:underline;');
                    else if (code === 'o') styles.push('font-style:italic;');
                    i++;
                    continue;
                }
                buffer += escaped[i];
            }
            flush();
            return html;
        }

        function attachMcPreview(fieldEl) {
            if (!fieldEl || fieldEl.dataset.mcPreviewAttached) return;
            fieldEl.dataset.mcPreviewAttached = '1';

            const preview = document.createElement('div');
            preview.className = 'mc-color-preview';
            fieldEl.insertAdjacentElement('afterend', preview);

            const sync = () => {
                const val = fieldEl.value;
                if (val.includes('§')) {
                    preview.innerHTML = renderMcPreviewHtml(val);
                    preview.style.display = 'block';
                } else {
                    preview.style.display = 'none';
                }
            };
            fieldEl.addEventListener('input', sync);
            sync();
        }

        /* THEME TOGGLE */
        function toggleTheme() {
            const root = document.documentElement;
            const btn = document.querySelector('.theme-toggle');
            const icon = document.getElementById('theme-icon');
            const goingLight = root.getAttribute('data-theme') !== 'light';

            btn.classList.add('spinning');
            setTimeout(() => btn.classList.remove('spinning'), 400);

            if (goingLight) {
                root.setAttribute('data-theme', 'light');
                icon.src = 'https://raw.githubusercontent.com/nako-hikari/assets/main/ui/sun.png';
                localStorage.setItem('nako-theme', 'light');
            } else {
                root.removeAttribute('data-theme');
                icon.src = 'https://raw.githubusercontent.com/nako-hikari/assets/main/ui/moon.png';
                localStorage.setItem('nako-theme', 'dark');
            }
        }

        (function() {
            if (localStorage.getItem('nako-theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('theme-icon').src = 'https://raw.githubusercontent.com/nako-hikari/assets/main/ui/sun.png';
            }
        })();

        /* MODAL SYSTEM */
        function showModal(title, message, options) {
            options = options || {};
            document.getElementById('nakoModalTitle').textContent = title;
            document.getElementById('nakoModalBody').textContent = message;

            const footer = document.getElementById('nakoModalFooter');
            footer.innerHTML = '';

            if (options.onConfirm) {
                const cancel = document.createElement('button');
                cancel.className = 'secondary interactive';
                cancel.textContent = options.cancelText || 'Cancel';
                cancel.onclick = () => { closeNakoModal(); if (options.onCancel) options.onCancel(); };
                footer.appendChild(cancel);

                const confirmBtn = document.createElement('button');
                confirmBtn.className = options.danger ? 'danger interactive' : 'primary interactive';
                confirmBtn.textContent = options.confirmText || (options.danger ? 'Delete' : 'Confirm');
                confirmBtn.onclick = () => { closeNakoModal(); options.onConfirm(); };
                footer.appendChild(confirmBtn);
            } else {
                const ok = document.createElement('button');
                ok.className = 'secondary interactive';
                ok.textContent = 'OK';
                ok.onclick = () => { closeNakoModal(); if (options.onOk) options.onOk(); };
                footer.appendChild(ok);
            }

            document.getElementById('nakoModal').classList.add('open');
        }

        // Same shared modal shell, but the body takes real markup (e.g. the
        // raw-string import textarea) instead of plain text.
        function showModalHtml(title, bodyHtml, options) {
            options = options || {};
            document.getElementById('nakoModalTitle').textContent = title;
            document.getElementById('nakoModalBody').innerHTML = bodyHtml;

            const footer = document.getElementById('nakoModalFooter');
            footer.innerHTML = '';

            (options.buttons || []).forEach(btnDef => {
                const btn = document.createElement('button');
                btn.className = (btnDef.class || 'secondary') + ' interactive';
                btn.textContent = btnDef.label;
                btn.onclick = () => { closeNakoModal(); if (btnDef.onClick) btnDef.onClick(); };
                footer.appendChild(btn);
            });

            document.getElementById('nakoModal').classList.add('open');
        }

        function closeNakoModal() {
            document.getElementById('nakoModal').classList.remove('open');
        }

        document.getElementById('nakoModal').addEventListener('click', e => {
            if (e.target.id === 'nakoModal') closeNakoModal();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeNakoModal();
        });

        /* FULLSCREEN FIELD EDITOR — works for any input/textarea in the
           canvas so long text (chat lines, NPC scripts, notes) isn't
           cramped into a tiny box. Bug fix: CHAT rows used to be a
           single-line <input>, which silently ate newlines the moment you
           opened this editor and typed more than one line — CHAT is now a
           textarea (see addCommandRowToGroup/updateRowColorTheme) so real
           multi-line entry actually sticks here. */
        const fsTriggerBtn = document.getElementById('fullscreen-edit-trigger');
        const fsOverlay = document.getElementById('fullscreen-editor-overlay');
        const fsBody = document.getElementById('fullscreen-editor-body');
        const fsCloseBtn = document.getElementById('fullscreen-editor-close');
        let activeEditField = null;

        function isFullscreenEligible(el) {
            return !!(el && el.matches && el.matches('input[type="text"], textarea'));
        }

        canvas.addEventListener('focusin', (e) => {
            if (isFullscreenEligible(e.target)) {
                activeEditField = e.target;
                fsTriggerBtn.style.display = 'flex';
            }
        });

        // On mobile, opening the keyboard shrinks the visual viewport
        // without moving the layout viewport, which can push
        // position:fixed elements (like this row) out of the visible area —
        // that's why the expand button used to disappear once a field was
        // focused and the keyboard came up. Re-anchor to the visual
        // viewport's live offset so it stays reachable.
        if (window.visualViewport) {
            const repositionToggleRow = () => {
                const vv = window.visualViewport;
                const toggleRow = document.querySelector('.theme-toggle-row');
                if (toggleRow) toggleRow.style.top = (vv.offsetTop + 20) + 'px';
            };
            window.visualViewport.addEventListener('resize', repositionToggleRow);
            window.visualViewport.addEventListener('scroll', repositionToggleRow);
        }

        canvas.addEventListener('focusout', () => {
            setTimeout(() => {
                const overlayOpen = fsOverlay.style.display === 'flex';
                if (overlayOpen) return;
                if (document.activeElement === fsTriggerBtn) return;
                if (isFullscreenEligible(document.activeElement) && canvas.contains(document.activeElement)) {
                    activeEditField = document.activeElement;
                    return;
                }
                fsTriggerBtn.style.display = 'none';
                activeEditField = null;
            }, 120);
        });

        fsTriggerBtn.onclick = () => {
            if (activeEditField) openFullscreenEditor(activeEditField);
        };

        function openFullscreenEditor(fieldEl) {
            fsBody.innerHTML = '';

            const ta = document.createElement('textarea');
            ta.value = fieldEl.value;
            fsBody.appendChild(ta);

            ta.addEventListener('input', () => {
                fieldEl.value = ta.value;
                fieldEl.dispatchEvent(new Event('input', { bubbles: true }));
            });

            fsOverlay.style.display = 'flex';
            ta.focus();
        }

        function closeFullscreenEditor() {
            fsOverlay.style.display = 'none';
            if (activeEditField) activeEditField.focus();
        }
        fsCloseBtn.onclick = closeFullscreenEditor;
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && fsOverlay.style.display === 'flex') closeFullscreenEditor();
        });

        creditInput.addEventListener('focus', () => {
            if (creditInput.value === 'Nako Hikari') {
                creditInput.value = '';
            }
        });

        creditInput.addEventListener('blur', () => {
            if (creditInput.value.trim() === '') {
                creditInput.value = 'Nako Hikari';
            }
            compilerCoreEngine();
        });

        ['meta-title', 'meta-credit', 'meta-desc'].forEach(id => {
            document.getElementById(id).addEventListener('input', compilerCoreEngine);
        });

        function shiftBlockPosition(button, offsetDirection) {
            const currentBlock = button.closest('.group-block');

            if (offsetDirection === -1) {
                const targetSibling = currentBlock.previousElementSibling;
                if (targetSibling) {
                    currentBlock.style.transform = 'translateY(-10px)';
                    setTimeout(() => {
                        canvas.insertBefore(currentBlock, targetSibling);
                        currentBlock.style.transform = 'translateY(0)';
                        applyVisualFlashFeedback(currentBlock);
                    }, 80);
                }
            } else if (offsetDirection === 1) {
                const targetSibling = currentBlock.nextElementSibling;
                if (targetSibling) {
                    currentBlock.style.transform = 'translateY(10px)';
                    setTimeout(() => {
                        canvas.insertBefore(targetSibling, currentBlock);
                        currentBlock.style.transform = 'translateY(0)';
                        applyVisualFlashFeedback(currentBlock);
                    }, 80);
                }
            }
            compilerCoreEngine();
        }

        function shiftRowPosition(button, offsetDirection) {
            const currentRow = button.closest('.cmd-row-node');
            const stack = currentRow.parentNode;

            if (offsetDirection === -1) {
                const prevRow = currentRow.previousElementSibling;
                if (prevRow) {
                    currentRow.style.transform = 'translateY(-8px)';
                    setTimeout(() => {
                        stack.insertBefore(currentRow, prevRow);
                        currentRow.style.transform = 'translateY(0)';
                        applyVisualFlashFeedback(currentRow);
                        rebuildRowNumberingIndexes(stack);
                    }, 60);
                }
            } else if (offsetDirection === 1) {
                const nextRow = currentRow.nextElementSibling;
                if (nextRow) {
                    currentRow.style.transform = 'translateY(8px)';
                    setTimeout(() => {
                        stack.insertBefore(nextRow, currentRow);
                        currentRow.style.transform = 'translateY(0)';
                        applyVisualFlashFeedback(currentRow);
                        rebuildRowNumberingIndexes(stack);
                    }, 60);
                }
            }
        }

        function applyVisualFlashFeedback(domElement) {
            domElement.classList.add('block-moving-flash');
            setTimeout(() => {
                domElement.classList.remove('block-moving-flash');
            }, 400);
        }

        function rebuildRowNumberingIndexes(stackElement) {
            const allRows = stackElement.querySelectorAll('.cmd-row-node');
            allRows.forEach((row, i) => {
                row.querySelector('.row-index').innerText = i + 1;
            });
            compilerCoreEngine();
        }

        function confirmDeleteBlock(buttonEl) {
            const block = buttonEl.closest('.group-block');
            showModal('Confirm Deletion', 'Are you sure you want to remove this element block?', {
                danger: true,
                confirmText: 'Delete',
                onConfirm: () => {
                    block.remove();
                    compilerCoreEngine();
                }
            });
        }

        function duplicateBlock(buttonEl) {
            const block = buttonEl.closest('.group-block');
            const clone = block.cloneNode(true);
            block.after(clone);
            applyVisualFlashFeedback(clone);
            compilerCoreEngine();
        }

        function toggleBlockCollapse(buttonEl) {
            const block = buttonEl.closest('.group-block');
            block.classList.toggle('is-collapsed');
            const icon = buttonEl.querySelector('img');
            icon.src = block.classList.contains('is-collapsed')
                ? 'https://raw.githubusercontent.com/nako-hikari/assets/main/ui/expand.png'
                : 'https://raw.githubusercontent.com/nako-hikari/assets/main/ui/collapse.png';
        }

        function createStandardBlockHeader(titleText, belongsToGroup) {
            let addBtn = '';
            if (belongsToGroup === 'chain') {
                addBtn = `<button class="secondary interactive" onclick="addCommandRowToGroup(this.closest('.group-block'))"><img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/plus.png" alt=""> Add Row</button>`;
            } else if (belongsToGroup === 'bullet') {
                addBtn = `<button class="secondary interactive" onclick="addBulletItem(this.closest('.group-block'))"><img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/plus.png" alt=""> Add Item</button>`;
            }
            return `
                <div class="group-header">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="group-title">${titleText}</span>
                    </div>
                    <div class="block-action-cluster">
                        <button class="icon-button interactive" onclick="toggleBlockCollapse(this)" aria-label="Collapse">
                            <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/collapse.png" alt="">
                        </button>
                        <button class="icon-button interactive" onclick="shiftBlockPosition(this, -1)" aria-label="Move up">
                            <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/chevron_up.png" alt="">
                        </button>
                        <button class="icon-button interactive" onclick="shiftBlockPosition(this, 1)" aria-label="Move down">
                            <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/chevron_down.png" alt="">
                        </button>
                        <button class="icon-button interactive" onclick="duplicateBlock(this)" aria-label="Duplicate">
                            <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/duplicate.png" alt="">
                        </button>
                        ${addBtn}
                        <button class="icon-button danger interactive" onclick="confirmDeleteBlock(this)" aria-label="Remove">
                            <img class="icon icon-sm icon-on-brand" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/trash.png" alt="">
                        </button>
                    </div>
                </div>
            `;
        }

        function addChainGroup() {
            const group = document.createElement('div');
            group.className = 'card group-block';
            group.dataset.itemType = 'chain-group';

            group.innerHTML = `
                ${createStandardBlockHeader('Command Block Group', 'chain')}
                <div class="bulk-paste-zone">
                    <label class="field-label">Bulk Paste Multi-Line Split Input Tool</label>
                    <textarea placeholder="Paste lines of commands directly here. Each line auto-creates a linked sub-row entry block..." oninput="handleBulkPasteEngine(this)"></textarea>
                </div>
                <div class="connected-chain-stack"></div>
            `;

            canvas.appendChild(group);
            compilerCoreEngine();
            return group;
        }

        const CMD_MODE_META = {
            C:    { label: 'Chain',     color: 'var(--chain)' },
            I:    { label: 'Impulse',   color: 'var(--impulse)' },
            R:    { label: 'Repeat',    color: 'var(--repeat)' },
            CHAT: { label: 'Chat',      color: 'var(--accent-light)' },
            NPC:  { label: 'NPC',       color: 'var(--accent-dark)' },
            CODE: { label: 'Codeblock', color: 'var(--accent-dark-700)' }
        };

        function modePickerBtnHtml(mode) {
            const meta = CMD_MODE_META[mode];
            return `<button type="button" class="mode-picker-btn interactive" data-mode="${mode}" style="background: ${meta.color};" onclick="openModePicker(this)">${meta.label}</button>`;
        }

        function rowPlaceholder(mode) {
            if (mode === 'NPC') return 'Enter multi-line code execution sequences...';
            if (mode === 'CODE') return 'Enter code block content...';
            return 'Enter one or more chat lines...';
        }

        function addCommandRowToGroup(groupElement, targetCommandValue = '', config = {}) {
            const stack = groupElement.querySelector('.connected-chain-stack');
            const bulkBox = groupElement.querySelector('.bulk-paste-zone');

            if (bulkBox) bulkBox.style.display = 'none';

            const rowIndex = stack.children.length + 1;
            const rowNode = document.createElement('div');

            const mode = config.mode || 'C';
            const cond = config.cond || 'U';
            const active = config.active || 'AA';
            const tick = config.tick !== undefined ? config.tick : '0';
            const isMultiline = (mode === 'NPC' || mode === 'CHAT' || mode === 'CODE');

            rowNode.className = `cmd-row-node color-${mode.toLowerCase()}`;
            rowNode.dataset.mode = mode;
            if (cond === 'C') rowNode.classList.add('cond-border');

            rowNode.innerHTML = `
                <div class="row-index-container">
                    <button class="row-nav-btn" onclick="shiftRowPosition(this, -1)">▲</button>
                    <div class="row-index">${rowIndex}</div>
                    <button class="row-nav-btn" onclick="shiftRowPosition(this, 1)">▼</button>
                </div>
                <div class="row-controls-line">
                    <div class="inline-selector-set">
                        ${modePickerBtnHtml(mode)}
                        <select class="row-cond" style="${isMultiline ? 'display:none;' : ''}" onchange="updateRowColorTheme(this.closest('.cmd-row-node'))">
                            <option value="U" ${cond === 'U' ? 'selected' : ''}>UN</option>
                            <option value="C" ${cond === 'C' ? 'selected' : ''}>CN</option>
                        </select>
                        <select class="row-active" style="${isMultiline ? 'display:none;' : ''}" onchange="compilerCoreEngine()">
                            <option value="AA" ${active === 'AA' ? 'selected' : ''}>AA</option>
                            <option value="NR" ${active === 'NR' ? 'selected' : ''}>NR</option>
                        </select>
                        <input type="text" class="row-tick" style="${isMultiline ? 'display:none;' : ''}" value="${escapeHtml(tick)}" oninput="compilerCoreEngine()">
                    </div>
                    <button class="icon-button danger interactive remove-row-btn" style="width: 28px; height: 28px;" onclick="confirmRemoveRowNode(this)" aria-label="Remove row">
                        <img class="icon icon-sm icon-on-brand" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/trash.png" alt="">
                    </button>
                </div>
                <div class="cmd-input-container">
                    ${isMultiline
                        ? `<textarea class="cmd-input-field" placeholder="${rowPlaceholder(mode)}" oninput="compilerCoreEngine()">${escapeHtml(targetCommandValue)}</textarea>`
                        : `<input type="text" class="cmd-input-field" placeholder="Enter command string..." value="${escapeHtml(targetCommandValue)}" oninput="compilerCoreEngine()">`
                    }
                </div>
            `;

            stack.appendChild(rowNode);
            if (isMultiline) attachMcPreview(rowNode.querySelector('.cmd-input-field'));
            compilerCoreEngine();
            return rowNode;
        }

        let modePickerTargetRow = null;

        function openModePicker(triggerBtn) {
            modePickerTargetRow = triggerBtn.closest('.cmd-row-node');
            const currentMode = modePickerTargetRow.dataset.mode;

            const optionsHtml = Object.keys(CMD_MODE_META).map(key => {
                const meta = CMD_MODE_META[key];
                const isCurrent = key === currentMode;
                return `
                    <button type="button" class="mode-option-row interactive${isCurrent ? ' is-current' : ''}" onclick="applyModeChoice('${key}')">
                        <span class="mode-swatch" style="background: ${meta.color};"></span>
                        <span>${meta.label}</span>
                        ${isCurrent ? `<span class="mode-check"><img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/checkmark.png" alt="Current"></span>` : ''}
                    </button>
                `;
            }).join('');

            showModalHtml('Choose Command Block Type', `<div class="mode-picker-list">${optionsHtml}</div>`, {
                buttons: [{ label: 'Cancel', class: 'secondary' }]
            });
        }

        function applyModeChoice(key) {
            closeNakoModal();
            if (!modePickerTargetRow) return;
            const btn = modePickerTargetRow.querySelector('.mode-picker-btn');
            btn.dataset.mode = key;
            btn.textContent = CMD_MODE_META[key].label;
            btn.style.background = CMD_MODE_META[key].color;
            modePickerTargetRow.dataset.mode = key;
            updateRowColorTheme(modePickerTargetRow);
            modePickerTargetRow = null;
        }

        function openHeaderTierPicker() {
            const btn = document.getElementById('header-tier-picker-btn');
            const currentTier = btn.dataset.tier;
            const tiers = ['H1', 'H2', 'H3', 'H4', 'H5'];

            const optionsHtml = tiers.map(tier => {
                const isCurrent = tier === currentTier;
                return `
                    <button type="button" class="mode-option-row interactive${isCurrent ? ' is-current' : ''}" onclick="applyHeaderTierChoice('${tier}')">
                        <span>${tier}</span>
                        ${isCurrent ? `<span class="mode-check"><img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/checkmark.png" alt="Current"></span>` : ''}
                    </button>
                `;

            showModalHtml('Choose Header Size', `<div class="mode-picker-list">${optionsHtml}</div>`, {

        function confirmRemoveRowNode(buttonEl) {
            showModal('Confirm Deletion', 'Are you sure you want to remove this command row?', {

                onConfirm: () => { removeRowNodeElement(buttonEl); }
            });

        function removeRowNodeElement(buttonEl) {
            const stack = buttonEl.closest('.connected-chain-stack');
            const group = buttonEl.closest('.group-block');
            buttonEl.closest('.cmd-row-node').remove();

            const rows = stack.querySelectorAll('.cmd-row-node');
            if (rows.length === 0) {
                group.querySelector('.bulk-paste-zone').style.display = 'flex';
                group.querySelector('.bulk-paste-zone textarea').value = '';
            } else {
                rows.forEach((row, i) => { row.querySelector('.row-index').innerText = i + 1; });
            }
            compilerCoreEngine();
        }

        function handleBulkPasteEngine(textareaEl) {
            const lines = textareaEl.value.split('\n');
            const group = textareaEl.closest('.group-block');
            lines.forEach(line => {
                const clean = line.trim();
                if (clean) addCommandRowToGroup(group, clean);
            });
        }

        function updateRowColorTheme(rowNode) {
            const type = rowNode.dataset.mode;
            const condSelect = rowNode.querySelector('.row-cond');
            const activeSelect = rowNode.querySelector('.row-active');
            const tickInput = rowNode.querySelector('.row-tick');
            const inputContainer = rowNode.querySelector('.cmd-input-container');
            const isMultiline = (type === 'NPC' || type === 'CHAT' || type === 'CODE');

            const currentVal = rowNode.querySelector('.cmd-input-field').value;

            rowNode.className = 'cmd-row-node';
            rowNode.classList.add(`color-${type.toLowerCase()}`);

            if (isMultiline) {
                condSelect.style.display = 'none';
                activeSelect.style.display = 'none';
                tickInput.style.display = 'none';
                inputContainer.innerHTML = `<textarea class="cmd-input-field" placeholder="${rowPlaceholder(type)}" oninput="compilerCoreEngine()">${escapeHtml(currentVal)}</textarea>`;
                attachMcPreview(inputContainer.querySelector('.cmd-input-field'));
            } else {
                condSelect.style.display = '';
                activeSelect.style.display = '';
                tickInput.style.display = '';
                inputContainer.innerHTML = `<input type="text" class="cmd-input-field" placeholder="Enter command string..." value="${escapeHtml(currentVal)}" oninput="compilerCoreEngine()">`;
                if (condSelect.value === 'C') rowNode.classList.add('cond-border');
            }

            compilerCoreEngine();
        }

        function addBodyTextBlock(presetValue = '') {
            const block = document.createElement('div');

            block.innerHTML = `
                ${createStandardBlockHeader('Plain Body Text Block (TEXT)', 'standard')}

        // Manual line-break token: real newlines can't be used here since blank lines
        // separate blocks in the raw output; the parser turns this into a <br>.
        const LINE_BREAK_TOKEN = '[[br]]';
        let lastFocusedField = null;

        document.addEventListener('focusin', (e) => {
            if (e.target.matches && e.target.matches('.text-input-val, .note-input-val, .bullet-item-val')) {
                lastFocusedField = e.target;
            }
        });

        function insertLineBreak() {
            const field = lastFocusedField;

            if (!field || !document.body.contains(field)) {
                showModal('No Field Selected', 'Click into a Body Text, Note, or Bullet Item field first, then press this button again to insert a line break at your cursor. You can press it multiple times for multiple breaks.');
                return;
            }

            const start = field.selectionStart ?? field.value.length;
            const end = field.selectionEnd ?? field.value.length;
            field.value = field.value.slice(0, start) + LINE_BREAK_TOKEN + field.value.slice(end);
            const newPos = start + LINE_BREAK_TOKEN.length;
            field.focus();
            field.setSelectionRange(newPos, newPos);
            field.dispatchEvent(new Event('input', { bubbles: true }));
        }

        /* Platform detection — regex against the URL path, first match wins.
           Used for BOTH social profiles and donation/support links. */
        const SOCIAL_DETECT = [
            { key: 'youtube',   re: /youtube\.com\/@([\w.-]+)/i },
            { key: 'youtube',   re: /youtube\.com\/(?:channel|c|user)\/([\w.-]+)/i },
            { key: 'tiktok',    re: /tiktok\.com\/@([\w.-]+)/i },
            { key: 'instagram', re: /instagram\.com\/([\w.-]+)/i },
            { key: 'twitter',   re: /(?:twitter|x)\.com\/([\w]+)/i },
            { key: 'facebook',  re: /facebook\.com\/([\w.-]+)/i },
            { key: 'twitch',    re: /twitch\.tv\/([\w]+)/i },
            { key: 'reddit',    re: /reddit\.com\/(?:u|user)\/([\w-]+)/i },
            { key: 'github',    re: /github\.com\/([\w-]+)/i },
            { key: 'pinterest', re: /pinterest\.[\w.]+\/([\w-]+)/i },
            { key: 'linkedin',  re: /linkedin\.com\/in\/([\w-]+)/i },
            { key: 'threads',   re: /threads\.net\/@([\w.-]+)/i },
            { key: 'bluesky',   re: /bsky\.app\/profile\/([\w.-]+)/i },
            { key: 'telegram',  re: /t\.me\/([\w-]+)/i }
        ];

        const DONATE_DETECT = [
            { key: 'trakteer',       re: /trakteer\.id\/([\w-]+)/i },
            { key: 'saweria',        re: /saweria\.co\/([\w-]+)/i },
            { key: 'kofi',           re: /ko-fi\.com\/([\w-]+)/i },
            { key: 'buymeacoffee',   re: /buymeacoffee\.com\/([\w-]+)/i },
            { key: 'patreon',        re: /patreon\.com\/([\w-]+)/i },
            { key: 'paypal',         re: /paypal\.me\/([\w-]+)/i },
            { key: 'streamlabs',     re: /streamlabs\.com\/([\w-]+)/i },
            { key: 'streamelements', re: /streamelements\.com\/([\w-]+)/i },
            { key: 'karyakarsa',     re: /karyakarsa\.com\/([\w-]+)/i },
            { key: 'sociabuzz',      re: /sociabuzz\.com\/([\w-]+)/i }
        ];

        const PLATFORM_LABELS = {
            youtube: 'YouTube', tiktok: 'TikTok', instagram: 'Instagram', twitter: 'X (Twitter)',
            facebook: 'Facebook', twitch: 'Twitch', reddit: 'Reddit', github: 'GitHub',
            pinterest: 'Pinterest', linkedin: 'LinkedIn', threads: 'Threads', bluesky: 'Bluesky',
            telegram: 'Telegram', trakteer: 'Trakteer', saweria: 'Saweria', kofi: 'Ko-fi',
            buymeacoffee: 'Buy Me a Coffee', patreon: 'Patreon', paypal: 'PayPal',
            streamlabs: 'Streamlabs', streamelements: 'StreamElements', karyakarsa: 'Karyakarsa',
            sociabuzz: 'Sociabuzz'
        };

        function detectPlatform(url, list) {
            for (const p of list) {
                const m = url.match(p.re);
                if (m) return { platform: p.key, handle: m[1] };
            }
            return null;
        }

        /* LINK BLOCK — a plain clickable link, a social media profile card,
           or a donation/support link card. Deliberately no manual "follower

           platform's public API is genuinely reachable from the browser
           (GitHub, Bluesky) the picture/name/handle are looked up for real;

           to fill in (or leave blank — the card just omits what's empty). */
        function addLinkBlock(presetTitle = '', presetUrl = '', config = null) {

                        <option value="social" ${linkType === 'social' ? 'selected' : ''}>Social Media Profile</option>
                        <option value="donate" ${linkType === 'donate' ? 'selected' : ''}>Donation / Support Link</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="field-label link-title-label">${linkType === 'social' ? 'Display Name (optional)' : (linkType === 'donate' ? 'Creator Name' : 'Pressable Link Title')}</label>
                        <input type="text" class="link-title-val" placeholder="Enter the text that users click..." value="${escapeHtml(presetTitle)}" oninput="compilerCoreEngine()">

                    <div class="form-row">
                        <div class="form-group social-only-field" style="${showUsername ? '' : 'display:none;'}">
                            <label class="field-label">Username / Handle (optional)</label>

        function onLinkTypeChange(selectEl) {

            statusEl.textContent = '';

            urlLabel.textContent = type === 'plain' ? 'Actual Link URL' : 'Profile / Page URL';

        async function onLinkUrlBlur(urlInput) {
            const block = urlInput.closest('.group-block');
            const type = block.querySelector('.link-type-select').value;
            const url = urlInput.value.trim();
            if (!url || type === 'plain') return;

            if (type === 'social') await autoDetectSocial(url, block);
            else if (type === 'donate') autoDetectDonate(url, block);
        }

        async function autoDetectSocial(url, block) {
            const detected = detectPlatform(url, SOCIAL_DETECT);
            const statusEl = block.querySelector('.link-detect-status');
            if (!detected) {
                statusEl.style.display = 'none';
                return;
            }

            const platformField = block.querySelector('.link-platform-val');
            const usernameField = block.querySelector('.link-username-val');
            const titleField = block.querySelector('.link-title-val');
            const avatarField = block.querySelector('.link-avatar-val');
            const label = PLATFORM_LABELS[detected.platform] || detected.platform;

            platformField.value = detected.platform;
            if (!usernameField.value.trim()) usernameField.value = '@' + detected.handle;
            if (!titleField.value.trim()) titleField.value = detected.handle;

            if (detected.platform === 'github' || detected.platform === 'bluesky') {
                statusEl.style.display = '';
                statusEl.textContent = `Looking up ${label} profile...`;
                try {
                    let data;
                    if (detected.platform === 'github') {
                        const res = await fetch(`https://api.github.com/users/${encodeURIComponent(detected.handle)}`);
                        if (!res.ok) throw new Error();
                        const json = await res.json();
                        data = { name: json.name || json.login, avatar: json.avatar_url, username: '@' + json.login };
                    } else {
                        const res = await fetch(`https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor=${encodeURIComponent(detected.handle)}`);
                        if (!res.ok) throw new Error();
                        const json = await res.json();
                        data = { name: json.displayName || json.handle, avatar: json.avatar || '', username: '@' + json.handle };
                    }
                    titleField.value = data.name;
                    usernameField.value = data.username;
                    if (data.avatar) avatarField.value = data.avatar;
                    statusEl.textContent = `${label} profile found — name, username and picture filled in automatically.`;
                } catch (e) {
                    statusEl.textContent = `Couldn't reach ${label} right now — name/username were guessed from the URL. Picture can be added manually.`;
                }
            } else {
                statusEl.style.display = '';
                statusEl.textContent = `${label} detected. This platform doesn't allow automatic lookups from a browser, so add a picture manually if you'd like one — no follower counts are supported since they can't be verified.`;
            }
            compilerCoreEngine();
        }

        function autoDetectDonate(url, block) {
            const detected = detectPlatform(url, DONATE_DETECT);
            const statusEl = block.querySelector('.link-detect-status');
            if (!detected) {
                statusEl.style.display = 'none';
                return;
            }
            block.querySelector('.link-platform-val').value = detected.platform;
            const titleField = block.querySelector('.link-title-val');
            if (!titleField.value.trim()) titleField.value = detected.handle;

            const label = PLATFORM_LABELS[detected.platform] || detected.platform;
            statusEl.style.display = '';
            statusEl.textContent = `${label} detected — a Donate button will be shown on the card automatically.`;
            compilerCoreEngine();
        }

        /* LOGO PICKER — lists whatever .png files currently exist in
           nako-hikari/assets under ui/social/ or ui/donation/ (chosen by
           this link's type), fetched live via the GitHub API so new icons
           the user adds to that repo show up automatically without any
           code changes here. Filenames are prettified for display by
           stripping the .png extension and swapping "_"/"-" for spaces. */
        let logoPickerTargetBlock = null;

        async function openLogoPicker(triggerBtn) {
            const block = triggerBtn.closest('.group-block');
            logoPickerTargetBlock = block;
            const linkType = block.querySelector('.link-type-select').value;
            const folder = linkType === 'donate' ? 'donation' : 'social';

            showModalHtml('Choose Logo', `<div class="mode-picker-list" id="logo-picker-list"><div class="draft-restore-note">Loading available logos...</div></div>`, {
                buttons: [
                    { label: 'No Logo', class: 'secondary', onClick: () => applyLogoChoice('') },
                    { label: 'Cancel', class: 'secondary' }
                ]
            });

            try {
                const res = await fetch(`https://api.github.com/repos/nako-hikari/assets/contents/ui/${folder}`);
                if (!res.ok) throw new Error();
                const items = await res.json();
                const files = items.filter(i => i.type === 'file' && /\.png$/i.test(i.name));

                const listEl = document.getElementById('logo-picker-list');
                if (!listEl) return; // modal was already closed/replaced before this resolved

                if (files.length === 0) {
                    listEl.innerHTML = `<div class="draft-restore-note">No logos found in that folder yet.</div>`;
                    return;
                }

                listEl.innerHTML = files.map(f => {
                    const rawUrl = `https://raw.githubusercontent.com/nako-hikari/assets/main/ui/${folder}/${f.name}`;
                    const label = f.name.replace(/\.png$/i, '').replace(/[_-]/g, ' ');
                    return `
                        <button type="button" class="mode-option-row interactive" onclick="applyLogoChoice('${escapeHtml(rawUrl)}')">
                            <img src="${rawUrl}" alt="" style="width: 24px; height: 24px; object-fit: contain; flex-shrink: 0;">
                            <span style="text-transform: capitalize;">${escapeHtml(label)}</span>
                        </button>
                    `;
                }).join('');
            } catch (e) {
                const listEl = document.getElementById('logo-picker-list');
                if (listEl) listEl.innerHTML = `<div class="draft-restore-note">Couldn't load the logo list right now — try again in a moment.</div>`;
            }
        }

                preview.src = url;
                preview.style.display = '';
            } else {
                preview.style.display = 'none';
            }

            compilerCoreEngine();
        }

        function openEditImportModal() {
            showModalHtml('Import Creation Payload', `
                <label class="field-label">Paste your raw string payload below:</label>

        function confirmOverwriteExistingData(rawText) {
            showModal('Overwrite Warning', 'Continuing will completely overwrite your current work in progress. Are you sure you want to replace it?', {
                danger: true,
                confirmText: 'Yes, Overwrite',
                cancelText: 'Go Back',
                onConfirm: () => { executeRawStringImport(rawText); },
                onCancel: () => { openEditImportModal(); }

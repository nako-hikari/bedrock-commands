<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Chain Formatter</title>
    <link rel="stylesheet" href="/css/nako.css">
    <style>
        body { align-items: center; justify-content: flex-start; }

        .select-inline { width: auto; }

        .form-row {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 150px;
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .meta-card {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .tag-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: var(--space-sm);
            background: var(--input-bg);
            padding: var(--space-sm);
            border-radius: var(--radius-sm);
            border: var(--border-width) solid var(--border-color);
        }

        .tag-checkbox-label {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: var(--fs-xs);
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
        }

        .controls-toolbar {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            align-items: center;
            padding: var(--space-sm) var(--space-md);
        }

        .toolbar-divider {
            border-left: var(--border-width) solid var(--border-color);
            height: 20px;
            margin: 0 var(--space-xs);
        }

        .group-block {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            position: relative;
            transition: transform var(--transition-slow), box-shadow var(--transition-slow), background-color var(--transition-normal);
        }

        .group-block[data-item-type="header"] { border-left: 4px solid var(--accent-light); }
        .group-block[data-item-type="text"] { border-left: 4px solid var(--accent-dark-300); }
        .group-block[data-item-type="note"] { border-left: 4px solid var(--accent-light); }
        .group-block[data-item-type="note"][data-note-color="green"] { border-left-color: var(--green); }
        .group-block[data-item-type="note"][data-note-color="red"] { border-left-color: var(--red); }
        .group-block[data-item-type="note"][data-note-color="yellow"] { border-left-color: var(--yellow); }
        .group-block[data-item-type="chain-group"] { border-left: 4px solid var(--accent-dark); }
        .group-block[data-item-type="link-group"] { border-left: 4px solid var(--accent-dark-700); }
        .group-block[data-item-type="img-group"] { border-left: 4px solid var(--accent-dark-300); }
        .group-block[data-item-type="embed-group"] { border-left: 4px solid var(--accent-dark-700); }
        .group-block[data-item-type="bullet-group"] { border-left: 4px solid var(--accent-dark-100); }

        .block-moving-flash {
            background-color: var(--accent-dark-50) !important;
            box-shadow: var(--shadow-soft);
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border-width) solid var(--border-color);
            padding-bottom: var(--space-xs);
            gap: var(--space-sm);
        }

        .group-title {
            font-size: var(--fs-xs);
            text-transform: uppercase;
            letter-spacing: var(--ls-wide);
            font-weight: var(--fw-bold, var(--fw-semibold));
            color: var(--accent-light);
        }

        .group-block.is-collapsed > *:not(.group-header) { display: none; }

        .block-action-cluster {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .connected-chain-stack {
            display: flex;
            flex-direction: column;
            background: var(--input-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .cmd-row-node {
            display: flex;
            flex-direction: column;
            padding: var(--space-sm);
            gap: var(--space-sm);
            border-bottom: var(--border-width) solid var(--border-color);
            position: relative;
            padding-left: 36px;
            transition: transform var(--transition-slow), background-color var(--transition-normal);
        }

        .cmd-row-node:last-child { border-bottom: none; }

        .cmd-row-node.color-c { background-color: color-mix(in srgb, var(--chain) 6%, transparent); }
        .cmd-row-node.color-i { background-color: color-mix(in srgb, var(--impulse) 6%, transparent); }
        .cmd-row-node.color-r { background-color: color-mix(in srgb, var(--repeat) 6%, transparent); }
        .cmd-row-node.color-chat { background-color: color-mix(in srgb, var(--accent-light) 6%, transparent); }
        .cmd-row-node.color-npc { background-color: color-mix(in srgb, var(--accent-dark) 10%, transparent); }
        .cmd-row-node.cond-border { box-shadow: inset 0 0 0 var(--border-width) var(--text-bright); }

        .row-index-container {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background-color: var(--chain);
            padding: 4px 0;
        }

        .row-index {
            font-family: var(--font-mono);
            font-weight: var(--fw-bold, var(--fw-semibold));
            color: var(--text-on-brand);
            font-size: var(--fs-xs);
            user-select: none;
        }

        .row-nav-btn {
            background: none;
            border: none;
            color: var(--text-on-brand);
            font-size: 9px;
            cursor: pointer;
            padding: 2px;
            line-height: 1;
            opacity: 0.7;
            transition: opacity var(--transition-fast);
            user-select: none;
        }
        .row-nav-btn:hover { opacity: 1; }

        .cmd-row-node.color-c .row-index-container { background-color: var(--chain); }
        .cmd-row-node.color-i .row-index-container { background-color: var(--impulse); }
        .cmd-row-node.color-r .row-index-container { background-color: var(--repeat); }
        .cmd-row-node.color-chat .row-index-container { background-color: var(--accent-light); }
        .cmd-row-node.color-npc .row-index-container { background-color: var(--accent-dark); }

        .row-controls-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            row-gap: var(--space-xs);
            gap: var(--space-sm);
            width: 100%;
        }

        .row-controls-line > .remove-row-btn {
            flex-shrink: 0;
        }

        .inline-selector-set {
            display: flex;
            flex-wrap: wrap;
            row-gap: 4px;
            gap: 4px;
            flex-shrink: 1;
            min-width: 0;
            align-items: center;
        }

        .inline-selector-set select {
            padding: 4px var(--space-xs);
            font-size: var(--fs-xs);
            font-weight: var(--fw-bold, var(--fw-semibold));
            height: 28px;
            width: auto !important;
            min-width: 0;
            flex-shrink: 0;
        }

        .inline-selector-set input.row-tick {
            width: 34px !important;
            min-width: 0;
            max-width: 34px;
            flex-shrink: 0;
            box-sizing: border-box;
            text-align: center;
            padding: 4px 2px;
            font-size: var(--fs-xs);
            height: 28px;
        }

        .cmd-input-container {
            display: flex;
            width: 100%;
            gap: var(--space-sm);
        }

        .cmd-input-field { flex: 1; }

        textarea.cmd-input-field {
            height: 72px;
            resize: vertical;
            line-height: var(--lh-normal);
        }

        .bulk-paste-zone {
            background: var(--accent-dark-50);
            border: var(--border-width) dashed var(--border-color);
            padding: var(--space-sm);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .bulk-paste-zone textarea { height: 55px; font-size: var(--fs-xs); }

        .bullet-item-stack, .social-stat-stack {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .bullet-item-row, .social-stat-row {
            display: flex;
            align-items: flex-start;
            gap: var(--space-sm);
        }

        .bullet-item-row .bullet-item-val {
            flex: 1;
            height: 44px;
            font-family: inherit;
            resize: vertical;
        }

        .social-extra-fields {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            padding: var(--space-sm);
            background: var(--input-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-sm);
        }

        .social-stat-row .stat-label-val { max-width: 140px; }
        .social-stat-row .stat-value-val { flex: 1; }

        .conditional-field-row {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .output-container-actions {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }

        .mode-picker-btn {
            height: 28px;
            padding: 0 10px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: var(--fs-xs);
            font-weight: var(--fw-bold, var(--fw-semibold));
            color: var(--text-on-brand);
            cursor: pointer;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .mode-picker-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .mode-option-row {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            border: var(--border-width) solid var(--border-color);
            background: var(--input-bg);
            cursor: pointer;
            font-size: var(--fs-md);
            color: var(--text-bright);
            text-align: left;
            width: 100%;
        }

        .mode-option-row:hover { background: var(--accent-dark-50); }
        .mode-option-row.is-current { border-color: var(--accent-light); }

        .mode-swatch {
            width: 16px;
            height: 16px;
            border-radius: var(--radius-full);
            flex-shrink: 0;
        }

        /* Shares .theme-toggle's box (size/shape/border) from nako.css so
           the two buttons are visually identical; only the fill differs. */
        .fs-trigger-btn {
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--accent-dark);
            padding: 0;
        }

        .fs-editor-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            z-index: calc(var(--z-modal) - 1);
            display: none;
            flex-direction: column;
        }

        .fs-editor-header {
            display: flex;
            align-items: center;
            padding: var(--space-md);
            border-bottom: var(--border-width) solid var(--border-color);
            flex-shrink: 0;
            gap: var(--space-md);
        }

        .fs-editor-body {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .fs-editor-body textarea {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            background: var(--bg-color);
            color: var(--text-bright);
            font-family: var(--font-mono);
            font-size: var(--fs-lg);
            padding: var(--space-lg);
            line-height: var(--lh-relaxed);
        }

        .draft-restore-note {
            font-size: var(--fs-xs);
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            body { padding: var(--space-lg) var(--space-sm); }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="theme-toggle-row">
            <button class="theme-toggle fs-trigger-btn interactive" id="fullscreen-edit-trigger" aria-label="Expand editor">
                <img class="icon icon-on-brand" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/expand.png" alt="">
            </button>
            <button class="theme-toggle interactive" onclick="toggleTheme()" aria-label="Toggle theme">
                <img id="theme-icon" class="icon" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/moon.png" alt="">
            </button>
        </div>

        <header style="display: flex; align-items: center; gap: var(--space-md); justify-content: center; position: relative;">
            <button class="icon-button interactive" style="position: absolute; left: 0;" onclick="confirmBackToMain()" aria-label="Back">
                <img class="icon icon-lg" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/back_arrow.png" alt="Back">
            </button>
            <h1>Command Chain Formatter</h1>
        </header>

        <section class="card meta-card">
            <button class="secondary interactive" style="width: 100%;" onclick="openEditImportModal()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/edit_pencil.png" alt=""> Edit Existing Creation
            </button>
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Creation Title</label>
                    <input type="text" id="meta-title" placeholder="yo cmd name here..">
                </div>
                <div class="form-group">
                    <label class="field-label">Credit</label>
                    <input type="text" id="meta-credit" value="Nako Hikari" placeholder="Nako Hikari">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Description</label>
                    <input type="text" id="meta-desc" placeholder="desc if u ain't lazy here..">
                </div>
            </div>
            <div class="form-group">
                <label class="field-label">Tags Selection</label>
                <div class="tag-grid" id="tag-checkbox-list">
                    <label class="tag-checkbox-label"><input type="checkbox" value="particle" onchange="compilerCoreEngine()"> particle</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="functional" onchange="compilerCoreEngine()"> functional</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="weapon" onchange="compilerCoreEngine()"> weapon</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="random" onchange="compilerCoreEngine()"> random</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="technique" onchange="compilerCoreEngine()"> technique</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="complex" onchange="compilerCoreEngine()"> complex</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="visual" onchange="compilerCoreEngine()"> visual</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="fun" onchange="compilerCoreEngine()"> fun</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="playanimation" onchange="compilerCoreEngine()"> playanimation</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="fmbe" onchange="compilerCoreEngine()"> fmbe</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="experimental" onchange="compilerCoreEngine()"> experimental</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="unique" onchange="compilerCoreEngine()"> unique</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="minigame" onchange="compilerCoreEngine()"> minigame</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="boss" onchange="compilerCoreEngine()"> boss</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="tools" onchange="compilerCoreEngine()"> tools</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="game-breaking" onchange="compilerCoreEngine()"> game breaking</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="text-score" onchange="compilerCoreEngine()"> text & score</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="quirks" onchange="compilerCoreEngine()"> quirks</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="how-to-use" onchange="compilerCoreEngine()"> how to use</label>
                </div>
            </div>
        </section>

        <section class="card controls-toolbar">
            <button class="primary interactive" onclick="addChainGroup()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/command_block.png" alt=""> Add Command Block
            </button>
            <div class="toolbar-divider"></div>

            <select id="header-type-selector" class="select-inline">
                <option value="H1">H1</option>
                <option value="H2">H2</option>
                <option value="H3">H3</option>
                <option value="H4">H4</option>
                <option value="H5">H5</option>
            </select>
            <button class="secondary interactive" onclick="addHeaderBlock()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/header_text.png" alt=""> Add Header
            </button>
            <button class="secondary interactive" onclick="addBodyTextBlock()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/paragraph_text.png" alt=""> Add Body Text
            </button>
            <button class="secondary interactive" onclick="addNoteBlock()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/note.png" alt=""> Add Note
            </button>
            <button class="secondary interactive" onclick="addBulletGroup()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/bullet_list.png" alt=""> Add Bullet List
            </button>

            <div class="toolbar-divider"></div>
            <button class="secondary interactive" onclick="addLinkBlock()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/link_chain.png" alt=""> Add Link
            </button>
            <button class="secondary interactive" onclick="addImageBlock()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/image.png" alt=""> Add Image
            </button>
            <button class="secondary interactive" onclick="addEmbedBlock()">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/video_embed.png" alt=""> Add Embed
            </button>

            <div class="toolbar-divider"></div>
            <button class="secondary interactive" onclick="insertLineBreak()" title="Click into a Body Text, Note or Bullet Item field first, then press this to drop in a break at your cursor">
                <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/plus.png" alt=""> Insert Line Break
            </button>
        </section>

        <main id="builder-canvas"></main>

        <section class="card">
            <div class="group-header">
                <span class="group-title">Formatted Raw Text String Output</span>
            </div>
            <div class="output-box output-container" id="raw-string-output">Your output lines are generated automatically...</div>
            <div class="output-container-actions">
                <button class="secondary interactive" onclick="copyOutputToClipboard()">
                    <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/copy.png" alt=""> Copy Output
                </button>
                <button class="secondary interactive" onclick="exportAsTxtFile()">
                    <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/download.png" alt=""> Export as .txt
                </button>
                <button class="secondary interactive" onclick="previewCreation()">
                    <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/eye_open.png" alt=""> Preview
                </button>
                <button class="primary interactive" onclick="uploadContent()">
                    <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/upload.png" alt=""> Upload
                </button>
            </div>
        </section>

        <div class="footer">
            <div class="footer-title">Nako Hikari</div>
            <div class="footer-links">
                <a href="https://github.com/nako-hikari/" target="_blank" class="social">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" alt="GitHub">
                    GitHub
                </a>
                <a href="https://m.youtube.com/@NaCryst" target="_blank" class="social">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="YouTube">
                    YouTube
                </a>
                <a href="https://www.tiktok.com/@nako_hikari_mc" target="_blank" class="social">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg" alt="TikTok">
                    TikTok
                </a>
                <a href="https://ko-fi.com/arialicee" target="_blank" class="social kofi">
                    <img src="https://raw.githubusercontent.com/nako-hikari/support-files/main/assets/kofi-icon.png" alt="Ko-fi">
                    Support me on Ko-fi
                </a>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="nakoModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="nakoModalTitle"></h2>
                <button class="modal-close interactive" onclick="closeNakoModal()" aria-label="Close">
                    <img class="icon" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/close.png" alt="">
                </button>
            </div>
            <div class="modal-body" id="nakoModalBody"></div>
            <div class="modal-footer" id="nakoModalFooter"></div>
        </div>
    </div>

    <div class="fs-editor-overlay" id="fullscreen-editor-overlay">
        <div class="fs-editor-header">
            <button class="icon-button interactive" id="fullscreen-editor-close" aria-label="Close editor">
                <img class="icon icon-lg" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/close.png" alt="">
            </button>
            <span class="group-title">Editing</span>
        </div>
        <div class="fs-editor-body" id="fullscreen-editor-body"></div>
    </div>

    <script>
        const canvas = document.getElementById('builder-canvas');
        const creditInput = document.getElementById('meta-credit');
        const DRAFT_KEY = 'nako_formatter_draft';

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        /* THEME TOGGLE */
        function toggleTheme() {
            const root = document.documentElement;
            const btn = document.querySelector('.theme-toggle');
            const icon = document.getElementById('theme-icon');
            const goingLight = root.getAttribute('data-theme') !== 'light';

            btn.classList.add('spinning');
            setTimeout(() => btn.classList.remove('spinning'), 400);

            if (goingLight) {
                root.setAttribute('data-theme', 'light');
                icon.src = 'https://raw.githubusercontent.com/nako-hikari/assets/main/ui/sun.png';
                localStorage.setItem('nako-theme', 'light');
            } else {
                root.removeAttribute('data-theme');
                icon.src = 'https://raw.githubusercontent.com/nako-hikari/assets/main/ui/moon.png';
                localStorage.setItem('nako-theme', 'dark');
            }
        }

        (function() {
            if (localStorage.getItem('nako-theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('theme-icon').src = 'https://raw.githubusercontent.com/nako-hikari/assets/main/ui/sun.png';
            }
        })();

        /* MODAL SYSTEM */
        function showModal(title, message, options) {
            options = options || {};
            document.getElementById('nakoModalTitle').textContent = title;
            document.getElementById('nakoModalBody').textContent = message;

            const footer = document.getElementById('nakoModalFooter');
            footer.innerHTML = '';

            if (options.onConfirm) {
                const cancel = document.createElement('button');
                cancel.className = 'secondary interactive';
                cancel.textContent = options.cancelText || 'Cancel';
                cancel.onclick = () => { closeNakoModal(); if (options.onCancel) options.onCancel(); };

                const confirmBtn = document.createElement('button');
                confirmBtn.className = options.danger ? 'danger interactive' : 'primary interactive';
                confirmBtn.textContent = options.confirmText || (options.danger ? 'Delete' : 'Confirm');
                confirmBtn.onclick = () => { closeNakoModal(); options.onConfirm(); };
                footer.appendChild(confirmBtn);
            } else {
                const ok = document.createElement('button');
                ok.className = 'secondary interactive';
                ok.textContent = 'OK';
                ok.onclick = () => { closeNakoModal(); if (options.onOk) options.onOk(); };
                footer.appendChild(ok);
            }

            document.getElementById('nakoModal').classList.add('open');
        }

        // Same shared modal shell, but the body takes real markup (e.g. the
        // raw-string import textarea) instead of plain text.
        function showModalHtml(title, bodyHtml, options) {
            options = options || {};
            document.getElementById('nakoModalTitle').textContent = title;
            document.getElementById('nakoModalBody').innerHTML = bodyHtml;

            const footer = document.getElementById('nakoModalFooter');
            footer.innerHTML = '';

            (options.buttons || []).forEach(btnDef => {
                const btn = document.createElement('button');
                btn.className = (btnDef.class || 'secondary') + ' interactive';
                btn.textContent = btnDef.label;
                btn.onclick = () => { closeNakoModal(); if (btnDef.onClick) btnDef.onClick(); };
                footer.appendChild(btn);
            });

            document.getElementById('nakoModal').classList.add('open');
        }

        function closeNakoModal() {
            document.getElementById('nakoModal').classList.remove('open');
        }

        document.getElementById('nakoModal').addEventListener('click', e => {
            if (e.target.id === 'nakoModal') closeNakoModal();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeNakoModal();
        });

        /* FULLSCREEN FIELD EDITOR — works for any input/textarea in the
           canvas so long text (chat lines, NPC scripts, notes) isn't
           cramped into a tiny box. Bug fix: CHAT rows used to be a
           single-line <input>, which silently ate newlines the moment you
           opened this editor and typed more than one line — CHAT is now a
           textarea (see addCommandRowToGroup/updateRowColorTheme) so real
           multi-line entry actually sticks here. */
        const fsTriggerBtn = document.getElementById('fullscreen-edit-trigger');
        const fsOverlay = document.getElementById('fullscreen-editor-overlay');
        const fsBody = document.getElementById('fullscreen-editor-body');
        const fsCloseBtn = document.getElementById('fullscreen-editor-close');
        let activeEditField = null;

        function isFullscreenEligible(el) {
            return !!(el && el.matches && el.matches('input[type="text"], textarea'));
        }

        canvas.addEventListener('focusin', (e) => {
            if (isFullscreenEligible(e.target)) {
                activeEditField = e.target;
                fsTriggerBtn.style.display = 'flex';
            }
        });

        canvas.addEventListener('focusout', () => {
            setTimeout(() => {
                const overlayOpen = fsOverlay.style.display === 'flex';
                if (overlayOpen) return;
                if (document.activeElement === fsTriggerBtn) return;
                if (isFullscreenEligible(document.activeElement) && canvas.contains(document.activeElement)) {
                    activeEditField = document.activeElement;
                    return;
                }
                fsTriggerBtn.style.display = 'none';
                activeEditField = null;
            }, 120);
        });

        fsTriggerBtn.onclick = () => {
            if (activeEditField) openFullscreenEditor(activeEditField);
        };

        function openFullscreenEditor(fieldEl) {
            fsBody.innerHTML = '';

            const ta = document.createElement('textarea');
            ta.value = fieldEl.value;
            fsBody.appendChild(ta);

            ta.addEventListener('input', () => {
                fieldEl.value = ta.value;
                fieldEl.dispatchEvent(new Event('input', { bubbles: true }));
            });

            fsOverlay.style.display = 'flex';
            ta.focus();
        }

        function closeFullscreenEditor() {
            fsOverlay.style.display = 'none';
            if (activeEditField) activeEditField.focus();
        }
        fsCloseBtn.onclick = closeFullscreenEditor;
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && fsOverlay.style.display === 'flex') closeFullscreenEditor();
        });

        creditInput.addEventListener('focus', () => {
            if (creditInput.value === 'Nako Hikari') {
                creditInput.value = '';
            }
        });

        creditInput.addEventListener('blur', () => {
            if (creditInput.value.trim() === '') {
                creditInput.value = 'Nako Hikari';
            }
            compilerCoreEngine();
        });

        ['meta-title', 'meta-credit', 'meta-desc'].forEach(id => {
            document.getElementById(id).addEventListener('input', compilerCoreEngine);
        });

        function shiftBlockPosition(button, offsetDirection) {
            const currentBlock = button.closest('.group-block');

            if (offsetDirection === -1) {
                const targetSibling = currentBlock.previousElementSibling;
                if (targetSibling) {
                    currentBlock.style.transform = 'translateY(-10px)';
                    setTimeout(() => {
                        canvas.insertBefore(currentBlock, targetSibling);
                        currentBlock.style.transform = 'translateY(0)';
                        applyVisualFlashFeedback(currentBlock);
                    }, 80);
                }
            } else if (offsetDirection === 1) {
                const targetSibling = currentBlock.nextElementSibling;
                if (targetSibling) {
                    currentBlock.style.transform = 'translateY(10px)';
                    setTimeout(() => {
                        canvas.insertBefore(targetSibling, currentBlock);
                        currentBlock.style.transform = 'translateY(0)';
                        applyVisualFlashFeedback(currentBlock);
                    }, 80);
                }
            }
            compilerCoreEngine();
        }

        function shiftRowPosition(button, offsetDirection) {
            const currentRow = button.closest('.cmd-row-node');
            const stack = currentRow.parentNode;

            if (offsetDirection === -1) {
                const prevRow = currentRow.previousElementSibling;
                if (prevRow) {
                    currentRow.style.transform = 'translateY(-8px)';
                    setTimeout(() => {
                        stack.insertBefore(currentRow, prevRow);
                        currentRow.style.transform = 'translateY(0)';
                        applyVisualFlashFeedback(currentRow);
                        rebuildRowNumberingIndexes(stack);
                    }, 60);
                }
            } else if (offsetDirection === 1) {
                const nextRow = currentRow.nextElementSibling;
                if (nextRow) {
                    currentRow.style.transform = 'translateY(8px)';
                    setTimeout(() => {
                        stack.insertBefore(nextRow, currentRow);
                        currentRow.style.transform = 'translateY(0)';
                        applyVisualFlashFeedback(currentRow);
                        rebuildRowNumberingIndexes(stack);
                    }, 60);
                }
            }
        }

        function applyVisualFlashFeedback(domElement) {
            domElement.classList.add('block-moving-flash');
            setTimeout(() => {
                domElement.classList.remove('block-moving-flash');
            }, 400);
        }

        function rebuildRowNumberingIndexes(stackElement) {
            const allRows = stackElement.querySelectorAll('.cmd-row-node');
            allRows.forEach((row, i) => {
                row.querySelector('.row-index').innerText = i + 1;
            });
            compilerCoreEngine();
        }

        function confirmDeleteBlock(buttonEl) {

        const CMD_MODE_META = {
            C:    { label: 'Chain',   color: 'var(--chain)' },
            I:    { label: 'Impulse', color: 'var(--impulse)' },
            R:    { label: 'Repeat',  color: 'var(--repeat)' },

        function addCommandRowToGroup(groupElement, targetCommandValue = '', config = {}) {
            const stack = groupElement.querySelector('.connected-chain-stack');
            const bulkBox = groupElement.querySelector('.bulk-paste-zone');

            if (bulkBox) bulkBox.style.display = 'none';

            const rowIndex = stack.children.length + 1;
            const rowNode = document.createElement('div');

            const mode = config.mode || 'C';
            const cond = config.cond || 'U';
            const active = config.active || 'AA';
            const tick = config.tick !== undefined ? config.tick : '0';
            const isMultiline = (mode === 'NPC' || mode === 'CHAT');

            rowNode.className = `cmd-row-node color-${mode.toLowerCase()}`;
            rowNode.dataset.mode = mode;
            if (cond === 'C') rowNode.classList.add('cond-border');

            rowNode.innerHTML = `

                    <button class="row-nav-btn" onclick="shiftRowPosition(this, -1)">▲</button>

                    <div class="inline-selector-set">
                        ${modePickerBtnHtml(mode)}
                        <select class="row-cond" style="${isMultiline ? 'display:none;' : ''}" onchange="updateRowColorTheme(this.closest('.cmd-row-node'))">

                            <option value="NR" ${active === 'NR' ? 'selected' : ''}>NR</option>

                    </div>
                    <button class="icon-button danger interactive remove-row-btn" style="width: 28px; height: 28px;" onclick="confirmRemoveRowNode(this)" aria-label="Remove row">
                        <img class="icon icon-sm icon-on-brand" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/trash.png" alt="">
                    </button>
                </div>
                <div class="cmd-input-container">
                    ${isMultiline
                        ? `<textarea class="cmd-input-field" placeholder="${mode === 'NPC' ? 'Enter multi-line code execution sequences...' : 'Enter one or more chat lines...'}" oninput="compilerCoreEngine()">${escapeHtml(targetCommandValue)}</textarea>`
                        : `<input type="text" class="cmd-input-field" placeholder="Enter command string..." value="${escapeHtml(targetCommandValue)}" oninput="compilerCoreEngine()">`
                    }

            `;

            stack.appendChild(rowNode);
            compilerCoreEngine();
            return rowNode;

        let modePickerTargetRow = null;

        function openModePicker(triggerBtn) {
            modePickerTargetRow = triggerBtn.closest('.cmd-row-node');

            const stack = buttonEl.closest('.connected-chain-stack');
            const group = buttonEl.closest('.group-block');
            buttonEl.closest('.cmd-row-node').remove();

            const rows = stack.querySelectorAll('.cmd-row-node');
            if (rows.length === 0) {
                group.querySelector('.bulk-paste-zone').style.display = 'flex';
                group.querySelector('.bulk-paste-zone textarea').value = '';
            } else {
                rows.forEach((row, i) => { row.querySelector('.row-index').innerText = i + 1; });
            }
            compilerCoreEngine();
        }

            const lines = textareaEl.value.split('\n');
            const group = textareaEl.closest('.group-block');
            lines.forEach(line => {

                if (clean) addCommandRowToGroup(group, clean);

            } else {

        // Manual line-break token: real newlines can't be used here since blank lines
        // separate blocks in the raw output; the parser turns this into a <br>.
        const LINE_BREAK_TOKEN = '[[br]]';
        let lastFocusedField = null;

        document.addEventListener('focusin', (e) => {
            if (e.target.matches && e.target.matches('.text-input-val, .note-input-val, .bullet-item-val')) {
                lastFocusedField = e.target;
            }
        });

        function insertLineBreak() {
            const field = lastFocusedField;

            if (!field || !document.body.contains(field)) {
                showModal('No Field Selected', 'Click into a Body Text, Note, or Bullet Item field first, then press this button again to insert a line break at your cursor. You can press it multiple times for multiple breaks.');
                return;
            }

            const start = field.selectionStart ?? field.value.length;
            const end = field.selectionEnd ?? field.value.length;
            field.value = field.value.slice(0, start) + LINE_BREAK_TOKEN + field.value.slice(end);
            const newPos = start + LINE_BREAK_TOKEN.length;
            field.focus();
            field.setSelectionRange(newPos, newPos);
            field.dispatchEvent(new Event('input', { bubbles: true }));
        }

                    </div>
                </div>
                <div class="social-extra-fields" style="${isSocial ? '' : 'display:none;'}">
                    <div class="form-group">
                        <label class="field-label">Avatar / Profile Picture URL (optional)</label>
                        <input type="text" class="link-avatar-val" placeholder="https://..." value="${isSocial ? escapeHtml(socialConfig.avatar || '') : ''}" oninput="compilerCoreEngine()">
                    </div>
                    <div class="form-group">
                        <label class="field-label">Stats (optional)</label>
                        <div class="social-stat-stack"></div>
                        <button class="secondary interactive" style="align-self: flex-start;" onclick="addSocialStat(this.closest('.group-block'))">
                            <img class="icon icon-sm" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/plus.png" alt=""> Add Stat
                        </button>
                    </div>
                </div>
            `;
            canvas.appendChild(block);

            if (isSocial && socialConfig.stats && socialConfig.stats.length > 0) {
                socialConfig.stats.forEach(s => addSocialStat(block, s.label, s.value));
            }

            compilerCoreEngine();
            return block;
        }

        function toggleSocialFields(checkboxEl) {
            const block = checkboxEl.closest('.group-block');
            const extra = block.querySelector('.social-extra-fields');
            const isSocial = checkboxEl.checked;
            extra.style.display = isSocial ? '' : 'none';
            block.querySelector('.link-title-label').textContent = isSocial ? 'Display Name' : 'Pressable Link Title';
            block.querySelector('.link-url-label').textContent = isSocial ? 'Profile URL' : 'Actual Link URL';
            if (isSocial && block.querySelector('.social-stat-stack').children.length === 0) {
                addSocialStat(block);
            }
            compilerCoreEngine();
        }

        function addSocialStat(block, presetLabel = '', presetValue = '') {
            const stack = block.querySelector('.social-stat-stack');
            const row = document.createElement('div');
            row.className = 'social-stat-row';
            row.innerHTML = `
                <input type="text" class="stat-label-val" placeholder="Followers" value="${escapeHtml(presetLabel)}" oninput="compilerCoreEngine()">
                <input type="text" class="stat-value-val" placeholder="1.2M" value="${escapeHtml(presetValue)}" oninput="compilerCoreEngine()">
                <button class="icon-button danger interactive" onclick="removeSocialStat(this)" aria-label="Remove stat">
                    <img class="icon icon-sm icon-on-brand" src="https://raw.githubusercontent.com/nako-hikari/assets/main/ui/trash.png" alt="">
                </button>
            `;
            stack.appendChild(row);
            compilerCoreEngine();
            return row;
        }

        function removeSocialStat(buttonEl) {
            buttonEl.closest('.social-stat-row').remove();
            compilerCoreEngine();
        }

        /* IMAGE BLOCK — optionally clickable, wrapping the image in a link. */
        function addImageBlock(presetUrl = '', presetClickable = false, presetLinkUrl = '') {
            const block = document.createElement('div');
            block.className = 'card group-block';
            block.dataset.itemType = 'img-group';

            block.innerHTML = `
                ${createStandardBlockHeader('Image Asset Link (IMG)', 'standard')}
                <input type="text" class="img-url-val" placeholder="Enter image URL or raw GitHub asset string..." value="${escapeHtml(presetUrl)}" oninput="compilerCoreEngine()">
                <label class="tag-checkbox-label">
                    <input type="checkbox" class="img-clickable-check" ${presetClickable ? 'checked' : ''} onchange="toggleImgClickable(this)">
                    Clickable (opens a link when tapped)
                </label>
                <div class="form-group img-link-field" style="${presetClickable ? '' : 'display:none;'}">
                    <label class="field-label">Link URL</label>
                    <input type="text" class="img-link-val" placeholder="https://..." value="${escapeHtml(presetLinkUrl)}" oninput="compilerCoreEngine()">
                </div>
            `;
            canvas.appendChild(block);
            compilerCoreEngine();
            return block;
        }

        function toggleImgClickable(checkboxEl) {
            const block = checkboxEl.closest('.group-block');
            block.querySelector('.img-link-field').style.display = checkboxEl.checked ? '' : 'none';
            compilerCoreEngine();
        }

        function addEmbedBlock(presetUrl = '') {
            const block = document.createElement('div');
            block.className = 'card group-block';
            block.dataset.itemType = 'embed-group';

            block.innerHTML = `
                ${createStandardBlockHeader('Video Embed Resource (EMBED)', 'standard')}
                <input type="text" class="embed-url-val" placeholder="Enter the source video file or hosting URL string..." value="${escapeHtml(presetUrl)}" oninput="compilerCoreEngine()">
            `;
            canvas.appendChild(block);
            compilerCoreEngine();
            return block;
        }

        function openEditImportModal() {
            showModalHtml('Import Creation Payload', `
                <label class="field-label">Paste your raw string payload below:</label>
                <textarea id="edit-import-textarea" style="height: 140px; font-size: var(--fs-xs);" placeholder="Paste output formatted raw string here..."></textarea>
            `, {
                buttons: [
                    { label: 'Cancel', class: 'secondary' },
                    {
                        label: 'Process Raw String',
                        class: 'primary',
                        onClick: () => {
                            const raw = document.getElementById('edit-import-textarea').value;
                            if (!raw.trim()) return;
                            confirmOverwriteExistingData(raw);
                        }
                    }
                ]
            });
        }

        function confirmOverwriteExistingData(rawText) {
            showModal('Overwrite Warning', 'Continuing will completely overwrite your current work in progress. Are you sure you want to replace it?', {
                danger: true,
                confirmText: 'Yes, Overwrite',
                cancelText: 'Go Back',
                onConfirm: () => { executeRawStringImport(rawText); },
                onCancel: () => { openEditImportModal(); }
            });
        }

        // Groups the raw lines of a CMD: block by header (everything up to
        // the next CMD: line belongs to the previous one) instead of
        // assuming a rigid "header, then exactly one payload line" pairing.
        // Bug fix: the old i += 2 pairing silently dropped every line past
        // the first for any multi-line NPC/CHAT payload on import.
        function groupCmdLines(lines) {
            let groups = [];
            let cur = null;
            lines.forEach(ln => {
                if (ln.startsWith('CMD:')) {
                    cur = { header: ln, payload: [] };
                    groups.push(cur);
                } else if (cur) {
                    cur.payload.push(ln);
                }
            });
            return groups;
        }

        function executeRawStringImport(rawText) {
            canvas.innerHTML = '';
            document.getElementById('meta-title').value = '';
            document.getElementById('meta-desc').value = '';
            document.getElementById('meta-credit').value = 'Nako Hikari';

            const checkboxes = document.querySelectorAll('#tag-checkbox-list input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = false);

            const blocks = rawText.split(/\n\s*\n/);
            let activeChainGroup = null;

            blocks.forEach(block => {
                const trimmed = block.trim();
                if (!trimmed) return;

                const lines = trimmed.split('\n');

                if (lines[0].startsWith('credit :')) {
                    document.getElementById('meta-credit').value = lines[0].replace('credit :', '').trim() || 'Nako Hikari';
                    return;
                }

                let isMetaBlock = false;
                lines.forEach(line => {
                    if (line.startsWith('TITLE:')) {
                        document.getElementById('meta-title').value = line.replace('TITLE:', '').trim();
                        isMetaBlock = true;
                    } else if (line.startsWith('DESC:')) {
                        document.getElementById('meta-desc').value = line.replace('DESC:', '').trim();
                        isMetaBlock = true;
                    } else if (line.startsWith('TAG:')) {
                        const tags = line.replace('TAG:', '').split(',').map(t => t.trim());
                        checkboxes.forEach(cb => {
                            if (tags.includes(cb.value)) cb.checked = true;
                        });
                        isMetaBlock = true;
                    }
                });
                if (isMetaBlock) return;

                if (/^H[1-5]:/.test(trimmed)) {
                    activeChainGroup = null;
                    const tier = trimmed.match(/^H[1-5]/)[0];
                    addHeaderBlock(trimmed.replace(new RegExp('^' + tier + ':'), '').trim(), tier);
                } else if (trimmed.startsWith('TEXT:')) {
                    activeChainGroup = null;
                    addBodyTextBlock(trimmed.replace('TEXT:', '').trim());
                } else if (/^NOTE\b/i.test(trimmed)) {
                    activeChainGroup = null;
                    const noteMatch = trimmed.match(/^NOTE(?:\s*:\s*(GREEN|RED|YELLOW))?\s*:\s*([\s\S]*)$/i);
                    const noteColor = (noteMatch && noteMatch[1]) ? noteMatch[1].toLowerCase() : 'default';
                    const noteText = noteMatch ? noteMatch[2] : '';
                    addNoteBlock(noteText, noteColor);
                } else if (/^BULLET:/i.test(trimmed)) {
                    activeChainGroup = null;
                    const styleMatch = trimmed.match(/^BULLET:(\w+)/i);
                    const style = styleMatch ? styleMatch[1].toLowerCase() : 'dot';
                    const group = addBulletGroup();
                    group.dataset.bulletStyle = style;
                    const styleSelect = group.querySelector('.bullet-style-select');
                    if (styleSelect) styleSelect.value = style;
                    const stack = group.querySelector('.bullet-item-stack');
                    stack.innerHTML = '';
                    lines.slice(1).forEach(ln => { if (ln.trim()) addBulletItem(group, ln); });
                    if (stack.children.length === 0) addBulletItem(group);
                } else if (/^SOCIAL\s*:/i.test(trimmed)) {
                    activeChainGroup = null;
                    const nameMatch = trimmed.match(/^SOCIAL\s*:\s*(.*)$/i);
                    const name = nameMatch ? nameMatch[1].trim() : '';
                    let url = '', avatar = '';
                    const stats = [];
                    lines.slice(1).forEach(ln => {
                        let m;
                        if ((m = ln.match(/^\s*URL\s*:\s*(.*)$/i))) url = m[1].trim();
                        else if ((m = ln.match(/^\s*AVATAR\s*:\s*(.*)$/i))) avatar = m[1].trim();
                        else if ((m = ln.match(/^\s*STAT\s*:\s*(.*)$/i))) {
                            const parts = m[1].split('|');
                            if (parts[0] && parts[0].trim()) stats.push({ label: parts[0].trim(), value: (parts[1] || '').trim() });
                        }
                    });
                    addLinkBlock(name, url, { avatar, stats });
                } else if (trimmed.startsWith('[link]')) {
                    activeChainGroup = null;
                    const match = trimmed.match(/\[link\]\[(.*?)\]\((.*?)\)/);
                    if (match) addLinkBlock(match[1], match[2]);
                } else if (trimmed.startsWith('[img]')) {
                    activeChainGroup = null;
                    const match = trimmed.match(/\[img\]\((.*?)\)/);
                    if (match) {
                        const inner = match[1];
                        const pipeIdx = inner.indexOf('|');
                        if (pipeIdx !== -1) {
                            addImageBlock(inner.slice(0, pipeIdx), true, inner.slice(pipeIdx + 1));
                        } else {
                            addImageBlock(inner);
                        }
                    }
                } else if (trimmed.startsWith('[embed]')) {
                    activeChainGroup = null;
                    const match = trimmed.match(/\[embed\]\((.*?)\)/);
                    if (match) addEmbedBlock(match[1]);
                } else if (trimmed.startsWith('CMD:')) {
                    if (!activeChainGroup) {
                        activeChainGroup = addChainGroup();
                    }

                    groupCmdLines(lines).forEach(grp => {
                        const headerParts = grp.header.split(':');
                        const mode = headerParts[1] || 'C';

                        if (mode === 'NPC' || mode === 'CHAT') {
                            addCommandRowToGroup(activeChainGroup, grp.payload.join('\n'), { mode });
                        } else {
                            const active = headerParts[2] || 'AA';
                            const cond = headerParts[3] || 'U';
                            const tick = headerParts[4] || '0';
                            addCommandRowToGroup(activeChainGroup, grp.payload[0] || '', { mode, cond, active, tick });
                        }
                    });
                }
            });

            compilerCoreEngine();
        }

        function compilerCoreEngine() {
            let sections = [];

            const creditVal = document.getElementById('meta-credit').value.trim() || 'Nako Hikari';
            sections.push(`credit : ${creditVal}`);

            const title = document.getElementById('meta-title').value.trim();
            const desc = document.getElementById('meta-desc').value.trim();
            const checkedBoxes = document.querySelectorAll('#tag-checkbox-list input:checked');
            const tagsArr = Array.from(checkedBoxes).map(cb => cb.value);

            let metaBlock = '';
            if (title) metaBlock += `TITLE: ${title}\n`;
            if (desc)  metaBlock += `DESC: ${desc}\n`;
            if (tagsArr.length > 0)  metaBlock += `TAG: ${tagsArr.join(',')}\n`;

            if (metaBlock) sections.push(metaBlock.trim());

            const elements = canvas.children;
            for (let i = 0; i < elements.length; i++) {
                const el = elements[i];
                const type = el.dataset.itemType;

                if (type === 'header') {
                    const tier = el.dataset.headerTier;
                    const val = el.querySelector('.header-input-val').value.trim();
                    if (val) sections.push(`${tier}: ${val}`);
                }
                else if (type === 'text') {
                    const val = el.querySelector('.text-input-val').value.trim();
                    if (val) sections.push(`TEXT: ${val}`);
                }
                else if (type === 'note') {
                    const val = el.querySelector('.note-input-val').value.trim();
                    const color = el.dataset.noteColor || 'default';
                    if (val) {
                        sections.push(color === 'default' ? `NOTE: ${val}` : `NOTE:${color.toUpperCase()}: ${val}`);
                    }
                }
                else if (type === 'bullet-group') {
                    const style = el.dataset.bulletStyle || 'dot';
                    const items = Array.from(el.querySelectorAll('.bullet-item-val'))
                        .map(t => t.value.trim())
                        .filter(v => v.length > 0);
                    if (items.length > 0) {
                        sections.push(`BULLET:${style}\n` + items.join('\n'));
                    }
                }
                else if (type === 'link-group') {
                    const isSocial = el.querySelector('.link-social-check').checked;
                    const textTitle = el.querySelector('.link-title-val').value.trim();
                    const targetUrl = el.querySelector('.link-url-val').value.trim();

                    if (isSocial) {
                        const avatar = el.querySelector('.link-avatar-val').value.trim();
                        const stats = Array.from(el.querySelectorAll('.social-stat-row')).map(row => ({
                            label: row.querySelector('.stat-label-val').value.trim(),
                            value: row.querySelector('.stat-value-val').value.trim()
                        })).filter(s => s.label);

                        let block = `SOCIAL: ${textTitle}\nURL: ${targetUrl}`;
                        if (avatar) block += `\nAVATAR: ${avatar}`;
                        stats.forEach(s => { block += `\nSTAT: ${s.label}|${s.value}`; });
                        sections.push(block);
                    } else {
                        sections.push(`[link][${textTitle}](${targetUrl})`);
                    }
                }
                else if (type === 'img-group') {
                    const targetUrl = el.querySelector('.img-url-val').value.trim();
                    const clickable = el.querySelector('.img-clickable-check').checked;
                    const linkUrl = clickable ? el.querySelector('.img-link-val').value.trim() : '';
                    sections.push((clickable && linkUrl) ? `[img](${targetUrl}|${linkUrl})` : `[img](${targetUrl})`);
                }
                else if (type === 'embed-group') {
                    const targetUrl = el.querySelector('.embed-url-val').value.trim();
                    sections.push(`[embed](${targetUrl})`);
                }
                else if (type === 'chain-group') {
                    let groupOutput = '';
                    const rows = el.querySelectorAll('.cmd-row-node');
                    rows.forEach(row => {
                        const m = row.dataset.mode;
                        const cmd = row.querySelector('.cmd-input-field').value.trim();

                        if (m === 'NPC' || m === 'CHAT') {
                            groupOutput += `CMD:${m}\n${cmd}\n`;
                        } else {
                            const c = row.querySelector('.row-cond').value;
                            const a = row.querySelector('.row-active').value;
                            const t = row.querySelector('.row-tick').value.trim() || '0';
                            groupOutput += `CMD:${m}:${a}:${c}:${t}\n${cmd}\n`;
                        }
                    });

                    if (groupOutput) sections.push(groupOutput.trim());
                }
            }

            const output = sections.join('\n\n');
            document.getElementById('raw-string-output').innerText = output;
            saveDraftToLocalStorage(sections.length, output);
        }

        /* DRAFT AUTOSAVE — a lightweight safety net against a closed tab or
           crashed browser. Doesn't replace the Preview round-trip's bfcache
           reliance, just backstops it. */
        function saveDraftToLocalStorage(sectionCount, output) {
            try {
                if (sectionCount > 1) {
                    localStorage.setItem(DRAFT_KEY, output);
                } else {
                    localStorage.removeItem(DRAFT_KEY);
                }
            } catch (err) { /* storage unavailable (private mode etc.) — skip silently */ }
        }

        function checkForDraft() {
            let draft = null;
            try { draft = localStorage.getItem(DRAFT_KEY); } catch (err) { /* ignore */ }
            if (draft && draft.trim()) {
                showModal('Restore Draft?', 'We found an unsaved draft from your last session. Would you like to restore it, or start fresh?', {
                    confirmText: 'Restore',
                    cancelText: 'Start Fresh',
                    onConfirm: () => { executeRawStringImport(draft); },
                    onCancel: () => { try { localStorage.removeItem(DRAFT_KEY); } catch (err) {} }
                });
            }
        }

        function displayModal({ title, message, actions }) {
            // Back-compat shim so any leftover legacy call sites keep working.
            const opts = {};
            const confirmAction = (actions || []).find(a => a.class !== 'btn-secondary' && a.label !== 'Cancel');
            if (actions && actions.length > 1 && confirmAction) {
                opts.onConfirm = confirmAction.onClick || (() => {});
                opts.confirmText = confirmAction.label;
                opts.danger = confirmAction.class === 'btn-danger';
                const cancelAction = actions.find(a => a !== confirmAction);
                if (cancelAction) opts.cancelText = cancelAction.label;
            }
            showModal(title, message, opts);
        }

        /* UPLOAD FLOW LOGIC */
        function uploadContent() {
            const creditField = document.getElementById('meta-credit');
            const currentCredit = creditField.value.trim();

            if (currentCredit === 'Nako Hikari') {
                showModal('Credit is still unchanged', 'Your credit is still set to Nako Hikari. Continuing will result in this creation being credited to Nako Hikari.', {
                    confirmText: 'Proceed',
                    cancelText: 'Change credit',
                    onConfirm: () => { showGeneralConfirmation(); },
                    onCancel: () => { creditField.focus(); }
                });
            } else {
                showGeneralConfirmation();
            }
        }

        function showGeneralConfirmation() {
            showModal('Confirm Upload', 'Make sure everything is correct before uploading. You will not be able to edit the submission after uploading.', {
                confirmText: 'Upload',
                cancelText: 'Let me check',
                onConfirm: () => { executeUploadRequest(); }
            });
        }

        async function executeUploadRequest() {
            const outputText = document.getElementById('raw-string-output').innerText;
            const creditVal = document.getElementById('meta-credit').value.trim() || 'Nako Hikari';

            try {
                const response = await fetch("/api/upload", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: outputText, author: creditVal })
                });

                if (!response.ok) {
                    throw new Error(`Server returned HTTP status ${response.status}`);
                }

                await response.json();
                try { localStorage.removeItem(DRAFT_KEY); } catch (err) {}

                showModal('Upload Successful', 'Command creation is on review and will show on the main page after approval.');
            } catch (error) {
                showModal('Upload Failed', 'Upload failed: ' + error.message, { danger: false });
            }
        }

        function confirmBackToMain() {
            showModal('Leave Formatter?', 'Are you sure going back to main page? Your progress will be reset.', {
                danger: true,
                confirmText: 'Yes',
                cancelText: 'No, stay here',
                onConfirm: () => { window.location.href = '../index.html'; }
            });
        }

        history.pushState({ nakoFormatterGuard: true }, '', location.href);
        window.addEventListener('popstate', () => {
            history.pushState({ nakoFormatterGuard: true }, '', location.href);
            if (sessionStorage.getItem('nako_skip_back_guard_once') === '1') {
                sessionStorage.removeItem('nako_skip_back_guard_once');
                return;
            }
            if (fsOverlay.style.display === 'flex') {
                closeFullscreenEditor();
                return;
            }
            confirmBackToMain();
        });

        function previewCreation() {
            const outputText = document.getElementById('raw-string-output').innerText;
            if (!outputText || outputText.startsWith('Your output')) {
                showModal('Nothing to Preview', 'Add some content first, then press Preview again.');
                return;
            }
            sessionStorage.setItem('nako_preview_payload', outputText);
            sessionStorage.setItem('nako_skip_back_guard_once', '1');
            window.location.href = '../index.html#preview';
        }

        function copyOutputToClipboard() {
            const rawText = document.getElementById('raw-string-output').innerText;
            navigator.clipboard.writeText(rawText).then(() => {
                showModal('Copied!', 'Output string copied to clipboard successfully.');
            }).catch(err => {
                showModal('Copy Failed', 'Failed to copy output string: ' + err);
            });
        }

        function exportAsTxtFile() {
            const rawText = document.getElementById('raw-string-output').innerText;
            const titleInput = document.getElementById('meta-title').value.trim();

            const filename = titleInput ? titleInput.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_chain.txt' : 'command_chain_output.txt';
            const blob = new Blob([rawText], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement("a");

            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        addChainGroup();
        checkForDraft();
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Chain Formatter</title>
    <style>
        :root {
            --bg-color: #0e0e11;
            --container-bg: #18181f;
            --input-bg: #0f0f12;
            --box-bg: #0f0f12;
            --border-color: #2d2d38;
            --accent-dark: #663657;
            --accent-dark-hover: #81456e;
            --accent-light: #A77A99;
            --accent-light-hover: #c5a4bc;
            --text-bright: #ffffff;
            --text-main: #b4b4bc;
            --text-muted: #5a5a66;
            --text-codeblock: #C77E4F;
            
            /* Minecraft Block Palette */
            --mc-impulse: #C77E4F;
            --mc-chain: #76B297;
            --mc-repeat: #6A4FC7;
            --mc-chat: #BFBFBF;
            --mc-npc: #111111;

            /* Stripe Left Colors */
            --stripe-header: #ffffff;
            --stripe-body: #5a5a66;
            --stripe-note: #d47c34;
            --stripe-command: #2b8c83;
            --stripe-link: #3a7bd5;
            --stripe-img: #10b981;
            --stripe-embed: #ec4899;
            --stripe-bullet: #38bdf8;

            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 20px;
            --space-2xl: 24px;
            --max-width: 950px;
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --border-width: 1px;
            --shadow-deep: 0 6px 16px rgba(0, 0, 0, 0.6);
            --shadow-soft: 0 2px 6px rgba(0, 0, 0, 0.3);
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-move: 0.6s cubic-bezier(0.2, 1, 0.2, 1);
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: var(--space-2xl) var(--space-lg);
        }

        .wrapper {
            width: 100%;
            max-width: var(--max-width);
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-bright);
            margin: 0;
        }

        .meta-card {
            background: var(--container-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--space-md);
            box-shadow: var(--shadow-deep);
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .form-row {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 150px;
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-bright);
            font-weight: 600;
        }

        .tag-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: var(--space-sm);
            background: var(--input-bg);
            padding: var(--space-sm);
            border-radius: var(--radius-sm);
            border: var(--border-width) solid var(--border-color);
        }

        .tag-checkbox-label {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: 12px;
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
        }

        .tag-checkbox-label input {
            margin: 0;
            width: auto;
            cursor: pointer;
        }

        input[type="text"], textarea, select {
            background: var(--input-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 6px var(--space-sm);
            color: var(--text-bright);
            font-family: ui-monospace, "SF Mono", "JetBrains Mono", monospace;
            font-size: 13px;
            width: 100%;
            outline: none;
            transition: border-color var(--transition-fast);
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--accent-light);
        }

        .controls-toolbar {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            background: var(--container-bg);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-lg);
            border: var(--border-width) solid var(--border-color);
            align-items: center;
        }

        .group-block {
            background: var(--container-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--space-md);
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            box-shadow: var(--shadow-soft);
            position: relative;
            transition: transform var(--transition-move), box-shadow var(--transition-move), background-color 0.4s ease;
        }

        .group-block[data-item-type="header"] { border-left: 4px solid var(--stripe-header); }
        .group-block[data-item-type="text"] { border-left: 4px solid var(--stripe-body); }
        .group-block[data-item-type="note"] { border-left: 4px solid var(--stripe-note); }
        .group-block[data-item-type="chain-group"] { border-left: 4px solid var(--stripe-command); }
        .group-block[data-item-type="link-group"] { border-left: 4px solid var(--stripe-link); }
        .group-block[data-item-type="img-group"] { border-left: 4px solid var(--stripe-img); }
        .group-block[data-item-type="embed-group"] { border-left: 4px solid var(--stripe-embed); }
        .group-block[data-item-type="bullet-group"] { border-left: 4px solid var(--stripe-bullet); }

        .block-moving-flash {
            background-color: rgba(167, 122, 153, 0.1) !important;
            box-shadow: 0 0 14px rgba(167, 122, 153, 0.3);
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border-width) solid var(--border-color);
            padding-bottom: var(--space-xs);
        }

        .group-title {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            color: var(--accent-light);
        }

        .block-action-cluster {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .connected-chain-stack {
            display: flex;
            flex-direction: column;
            background: var(--input-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .cmd-row-node {
            display: flex;
            flex-direction: column;
            padding: var(--space-sm);
            gap: var(--space-sm);
            border-bottom: var(--border-width) solid var(--border-color);
            position: relative;
            padding-left: 36px;
            transition: transform var(--transition-move), background-color 0.4s ease;
        }

        .cmd-row-node:last-child { border-bottom: none; }

        .cmd-row-node.color-c { background-color: rgba(118, 178, 151, 0.04); }
        .cmd-row-node.color-i { background-color: rgba(199, 126, 79, 0.04); }
        .cmd-row-node.color-r { background-color: rgba(106, 79, 199, 0.04); }
        .cmd-row-node.color-chat { background-color: rgba(191, 191, 191, 0.04); }
        .cmd-row-node.color-npc { background-color: rgba(17, 17, 17, 0.2); }
        .cmd-row-node.cond-border { box-shadow: inset 0 0 0 1px #ffffff; }

        .row-index-container {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background-color: var(--mc-chain); 
            padding: 4px 0;
        }

        .row-index {
            font-family: monospace;
            font-weight: bold;
            color: var(--text-bright);
            font-size: 11px;
            user-select: none;
        }

        .row-nav-btn {
            background: none;
            border: none;
            color: var(--text-bright);
            font-size: 9px;
            cursor: pointer;
            padding: 2px;
            line-height: 1;
            opacity: 0.6;
            transition: opacity var(--transition-fast);
            user-select: none;
        }
        .row-nav-btn:hover { opacity: 1; }

        .cmd-row-node.color-c .row-index-container { background-color: var(--mc-chain); }
        .cmd-row-node.color-i .row-index-container { background-color: var(--mc-impulse); }
        .cmd-row-node.color-r .row-index-container { background-color: var(--mc-repeat); }
        .cmd-row-node.color-chat .row-index-container { background-color: var(--mc-chat); }
        .cmd-row-node.color-chat .row-index, .cmd-row-node.color-chat .row-nav-btn { color: #111111; }
        .cmd-row-node.color-npc .row-index-container { background-color: var(--mc-npc); border-right: 1px solid var(--border-color); }

        .row-controls-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-sm);
            width: 100%;
        }

        .inline-selector-set {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            align-items: center;
        }

        .inline-selector-set select {
            padding: 4px var(--space-xs);
            font-size: 11px;
            font-weight: bold;
            border-radius: var(--radius-sm);
            background: var(--bg-color);
            height: 28px;
            width: auto;
        }

        .inline-selector-set input {
            width: 32px;
            text-align: center;
            padding: 4px var(--space-xs);
            font-size: 11px;
            border-radius: var(--radius-sm);
            background: var(--bg-color);
            height: 28px;
        }

        .cmd-input-container {
            display: flex;
            width: 100%;
            gap: var(--space-sm);
        }

        .cmd-input-field {
            flex: 1;
            border: var(--border-width) solid var(--border-color) !important;
            background: var(--bg-color) !important;
            padding: 4px var(--space-sm) !important;
            border-radius: var(--radius-sm);
            height: 32px;
        }

        textarea.cmd-input-field {
            height: 72px;
            resize: vertical;
            padding: var(--space-xs) var(--space-sm) !important;
            line-height: 1.4;
        }

        .bulk-paste-zone {
            background: rgba(255, 255, 255, 0.02);
            border: var(--border-width) dashed var(--border-color);
            padding: var(--space-sm);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .bulk-paste-zone textarea { height: 55px; font-size: 12px; }

        .bullet-item-stack {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .bullet-item-row {
            display: flex;
            align-items: flex-start;
            gap: var(--space-sm);
        }

        .bullet-item-row .bullet-item-val {
            flex: 1;
            height: 44px;
            font-size: 13px;
            font-family: inherit;
            resize: vertical;
        }

        .bullet-item-row .btn-danger {
            margin-top: 2px;
            flex-shrink: 0;
        }

        .btn {
            background: var(--accent-dark);
            border: none;
            color: var(--text-bright);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            transition: var(--transition-fast);
        }
        .btn:hover { background: var(--accent-dark-hover); }
        .btn:active { transform: scale(0.98); }

        .btn-sm { padding: var(--space-xs) var(--space-sm); font-size: 10px; }
        .btn-danger { background: #4a2323; }
        .btn-danger:hover { background: #6e3333; }
        .btn-secondary { background: var(--box-bg); border: var(--border-width) solid var(--border-color); color: var(--text-main); }
        .btn-secondary:hover { border-color: var(--accent-light); color: var(--text-bright); }

        .header-type-select {
            padding: var(--space-xs) var(--space-sm);
            font-size: 11px;
            background: var(--box-bg);
            color: var(--text-bright);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-sm);
            width: auto;
        }

        .output-box {
            background: var(--input-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--space-md);
            font-family: ui-monospace, "SF Mono", "JetBrains Mono", monospace;
            color: var(--text-codeblock);
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 220px;
            overflow-y: auto;
            font-size: 13px;
        }

        /* Modal Overlay System */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-fast);
            padding: var(--space-md);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--container-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            max-width: 460px;
            width: 100%;
            box-shadow: var(--shadow-deep);
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-bright);
            margin: 0;
        }

        .modal-body {
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .modal-actions {
            display: flex;
            gap: var(--space-sm);
            justify-content: flex-end;
            margin-top: var(--space-xs);
        }

        .footer {
            margin-top: 32px;
            padding-bottom: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            width: 100%;
        }
        .footer-title { font-size: 12px; color: var(--text-muted); opacity: 0.75; letter-spacing: 0.5px; }
        .footer-links { display: flex; gap: var(--space-md); flex-wrap: wrap; justify-content: center; }
        .footer-links a { display: flex; align-items: center; gap: 6px; color: var(--accent-light); text-decoration: none; font-size: 13px; opacity: 0.85; transition: opacity var(--transition-fast), color var(--transition-fast); }
        .footer-links a:hover { color: var(--accent-light-hover); opacity: 1; }
        .footer-links img { width: 16px; height: 16px; filter: brightness(0) invert(1) !important; opacity: 0.9; }
        .footer-links a.kofi { color: #ff5fa2; font-weight: 500; }
        .footer-links a.kofi:hover { color: #ff8fc0; }
        .footer-links a.kofi img { width: 20px; height: 20px; filter: brightness(0) invert(1) !important; opacity: 0.95; }

        @media (max-width: 600px) {
            body { padding: var(--space-lg) var(--space-sm); }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header style="display: flex; align-items: center; gap: 12px; justify-content: center; position: relative;">
            <button id="back-btn" class="btn btn-secondary" style="position: absolute; left: 0; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; font-family: monospace; font-size: 26px; line-height: 1;" onclick="confirmBackToMain()">←</button>
            <h1>Command Chain Formatter</h1>
        </header>

        <section class="meta-card">
            <div>
                <button class="btn btn-secondary" style="width: 100%; margin-bottom: 4px;" onclick="openEditImportModal()">✎ Edit Existing Creation</button>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Creation Title</label>
                    <input type="text" id="meta-title" placeholder="yo cmd name here..">
                </div>
                <div class="form-group">
                    <label>Credit</label>
                    <input type="text" id="meta-credit" value="Nako Hikari" placeholder="Nako Hikari">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="meta-desc" placeholder="desc if u ain't lazy here..">
                </div>
            </div>
            <div class="form-group">
                <label>Tags Selection</label>
                <div class="tag-grid" id="tag-checkbox-list">
                    <label class="tag-checkbox-label"><input type="checkbox" value="particle" onchange="compilerCoreEngine()"> particle</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="functional" onchange="compilerCoreEngine()"> functional</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="weapon" onchange="compilerCoreEngine()"> weapon</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="random" onchange="compilerCoreEngine()"> random</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="technique" onchange="compilerCoreEngine()"> technique</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="complex" onchange="compilerCoreEngine()"> complex</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="visual" onchange="compilerCoreEngine()"> visual</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="fun" onchange="compilerCoreEngine()"> fun</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="playanimation" onchange="compilerCoreEngine()"> playanimation</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="fmbe" onchange="compilerCoreEngine()"> fmbe</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="experimental" onchange="compilerCoreEngine()"> experimental</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="unique" onchange="compilerCoreEngine()"> unique</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="minigame" onchange="compilerCoreEngine()"> minigame</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="boss" onchange="compilerCoreEngine()"> boss</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="tools" onchange="compilerCoreEngine()"> tools</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="game-breaking" onchange="compilerCoreEngine()"> game breaking</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="text-score" onchange="compilerCoreEngine()"> text & score</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="quirks" onchange="compilerCoreEngine()"> quirks</label>
                    <label class="tag-checkbox-label"><input type="checkbox" value="how-to-use" onchange="compilerCoreEngine()"> how to use</label>
                </div>
            </div>
        </section>

        <section class="controls-toolbar">
            <button class="btn" onclick="addChainGroup()">+ Add Command Block</button>
            <div style="border-left: 1px solid var(--border-color); height: 20px; margin: 0 var(--space-xs);"></div>
            
            <select id="header-type-selector" class="header-type-select">
                <option value="H1">H1</option>
                <option value="H2">H2</option>
            </select>
            <button class="btn btn-secondary" onclick="addHeaderBlock()">+ Add Header</button>
            <button class="btn btn-secondary" onclick="addBodyTextBlock()">+ Add Body Text</button>
            <button class="btn btn-secondary" onclick="addNoteBlock()">+ Add Note</button>
            <button class="btn btn-secondary" onclick="addBulletGroup()">+ Add Bullet List</button>
            
            <div style="border-left: 1px solid var(--border-color); height: 20px; margin: 0 var(--space-xs);"></div>
            <button class="btn btn-secondary" onclick="addLinkBlock()">+ Add Link</button>
            <button class="btn btn-secondary" onclick="addImageBlock()">+ Add Image</button>
            <button class="btn btn-secondary" onclick="addEmbedBlock()">+ Add Embed</button>

            <div style="border-left: 1px solid var(--border-color); height: 20px; margin: 0 var(--space-xs);"></div>
            <select id="linebreak-count-selector" class="header-type-select">
                <option value="1">1x Break</option>
                <option value="3">3x Break</option>
                <option value="6">6x Break</option>
            </select>
            <button class="btn btn-secondary" onclick="insertLineBreak()" title="Click into a Body Text, Note or Bullet Item field first">+ Insert Line Break</button>
        </section>

        <main id="builder-canvas"></main>

        <section class="meta-card">
            <div class="group-header">
                <span class="group-title">Formatted Raw Text String Output</span>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-secondary" onclick="copyOutputToClipboard()">Copy Output</button>
                    <button class="btn btn-secondary" onclick="exportAsTxtFile()">Export as .txt</button>
                    <button class="btn btn-secondary" onclick="previewCreation()">Preview</button>
                    <button class="btn" onclick="uploadContent()">UPLOAD</button>
                </div>
            </div>
            <div class="output-box" id="raw-string-output">Your output lines are generated automatically...</div>
        </section>

        <div class="footer">
            <div class="footer-title">By Nako Hikari</div>
            <div class="footer-links">
                <a href="https://github.com/nako-hikari/" target="_blank">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" alt="GitHub"> GitHub
                </a>
                <a href="https://m.youtube.com/@NaCryst" target="_blank">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="YouTube"> YouTube
                </a>
                <a href="https://www.tiktok.com/@nako_hikari_mc" target="_blank">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg" alt="TikTok"> TikTok
                </a>
                <a href="https://ko-fi.com/arialicee" target="_blank" class="social kofi">
                    <img src="https://raw.githubusercontent.com/nako-hikari/support-files/main/assets/kofi-icon.png" alt="Ko-fi"> Support me on Ko-fi
                </a>
            </div>
        </div>
    </div>

    <!-- Reusable Confirmation / Info Modal -->
    <div id="app-modal-overlay" class="modal-overlay">
        <div class="modal-card">
            <h3 id="modal-title" class="modal-title">Notice</h3>
            <div id="modal-body" class="modal-body">Modal body text goes here.</div>
            <div id="modal-actions" class="modal-actions"></div>
        </div>
    </div>

    <!-- Fullscreen field editor: for large-text editing of any field other
         than title/credit/description -->
    <button id="fullscreen-edit-trigger" style="position: fixed; top: 20px; right: 12px; z-index: 900; display: none; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: var(--accent-dark); border: var(--border-width) solid var(--border-color); cursor: pointer; padding: 0;">
        <img src="https://raw.githubusercontent.com/nako-hikari/support-files/main/assets/eye_open.png" style="width: 20px; height: 20px;" alt="Expand editor">
    </button>
    <div id="fullscreen-editor-overlay" style="position: fixed; inset: 0; background: var(--bg-color); z-index: 1000; display: none; flex-direction: column;">
        <div style="display: flex; align-items: center; padding: 12px; border-bottom: var(--border-width) solid var(--border-color); flex-shrink: 0;">
            <button id="fullscreen-editor-close" class="btn btn-danger" style="padding: 6px 14px; font-size: 16px; line-height: 1;">X</button>
            <span style="margin-left: 12px; font-weight: 600; color: var(--text-main); text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px;">Editing</span>
        </div>
        <div id="fullscreen-editor-body" style="flex: 1; display: flex; min-height: 0;"></div>
    </div>

    <script>
        const canvas = document.getElementById('builder-canvas');
        const creditInput = document.getElementById('meta-credit');

        /* Live "§" highlighting: a non-interactive backdrop overlay behind a
           text-transparent field, since inputs/textareas can't style runs. */
        const MC_COLORS = {
            '0': '#000000', '1': '#0000AA', '2': '#00AA00', '3': '#00AAAA',
            '4': '#AA0000', '5': '#AA00AA', '6': '#FFAA00', '7': '#AAAAAA',
            '8': '#555555', '9': '#5555FF', 'a': '#55FF55', 'b': '#55FFFF',
            'c': '#FF5555', 'd': '#FF55FF', 'e': '#FFFF55', 'f': '#FFFFFF'
        };

        function escapeHtmlFmt(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function renderMcHighlightHtml(rawStr) {
            if (!rawStr) return '';
            const escaped = escapeHtmlFmt(rawStr);
            let html = '', buffer = '', color = null, styles = [];
            const flush = () => {
                if (!buffer) return;
                const styleAttr = (color ? `color:${color};` : '') + styles.join('');
                html += styleAttr ? `<span style="${styleAttr}">${buffer}</span>` : buffer;
                buffer = '';
            };
            for (let i = 0; i < escaped.length; i++) {
                if (escaped[i] === '§' && i + 1 < escaped.length) {
                    flush();
                    const rawCode = escaped[i + 1];
                    const code = rawCode.toLowerCase();

                    // The marker itself shows what it does (its own color/weight/etc.),
                    // dimmed to half opacity — not just a flat gray marker.
                    let markerColor = null, markerStyles = [];
                    if (MC_COLORS[code]) markerColor = MC_COLORS[code];
                    else if (code === 'l') markerStyles.push('font-weight:bold;');
                    else if (code === 'm') markerStyles.push('text-decoration:line-through;');
                    else if (code === 'n') markerStyles.push('text-decoration:underline;');
                    else if (code === 'o') markerStyles.push('font-style:italic;');
                    const markerStyleAttr = 'opacity:0.5;' + (markerColor ? `color:${markerColor};` : '') + markerStyles.join('');
                    html += `<span style="${markerStyleAttr}">§${rawCode}</span>`;

                    if (MC_COLORS[code]) { color = MC_COLORS[code]; styles = []; }
                    else if (code === 'r') { color = null; styles = []; }
                    else if (code === 'l') styles.push('font-weight:bold;');
                    else if (code === 'm') styles.push('text-decoration:line-through;');
                    else if (code === 'n') styles.push('text-decoration:underline;');
                    else if (code === 'o') styles.push('font-style:italic;');
                    i++;
                    continue;
                }
                buffer += escaped[i];
            }
            flush();
            return html;
        }

        function attachMcHighlight(fieldEl) {
            if (!fieldEl || fieldEl.dataset.mcHighlighted) return;
            fieldEl.dataset.mcHighlighted = '1';

            const cs = getComputedStyle(fieldEl);
            const origColor = cs.color, origBg = cs.backgroundColor;
            const fontFamily = cs.fontFamily, fontSize = cs.fontSize, lineHeight = cs.lineHeight;
            const padding = cs.padding, borderRadius = cs.borderRadius, borderWidth = cs.borderWidth;
            const origFlex = cs.flex;

            const wrapper = document.createElement('div');
            wrapper.style.cssText = `position: relative; width: 100%; min-width: 0; flex: ${origFlex};`;
            fieldEl.parentNode.insertBefore(wrapper, fieldEl);
            wrapper.appendChild(fieldEl);

            const backdrop = document.createElement('div');
            wrapper.insertBefore(backdrop, fieldEl);
            backdrop.style.cssText = `
                position: absolute; top: 0; left: 0; right: 0; bottom: 0;
                margin: 0; pointer-events: none; overflow: hidden; box-sizing: border-box;
                font-family: ${fontFamily}; font-size: ${fontSize}; line-height: ${lineHeight};
                padding: ${padding}; border: ${borderWidth} solid transparent;
                white-space: ${fieldEl.tagName === 'TEXTAREA' ? 'pre-wrap' : 'pre'};
                word-wrap: break-word; color: ${origColor}; background: ${origBg}; border-radius: ${borderRadius};
            `;

            fieldEl.style.position = 'relative';
            fieldEl.style.setProperty('background', 'transparent', 'important');
            fieldEl.style.setProperty('color', 'transparent', 'important');
            fieldEl.style.caretColor = origColor;

            const sync = () => {
                backdrop.innerHTML = renderMcHighlightHtml(fieldEl.value);
                backdrop.scrollTop = fieldEl.scrollTop;
                backdrop.scrollLeft = fieldEl.scrollLeft;
            };
            fieldEl.addEventListener('input', sync);
            fieldEl.addEventListener('scroll', sync);
            sync();
        }

        /* Fullscreen large-text editor: a floating button appears while
           editing any field in the canvas (i.e. anything except the
           title/credit/description meta fields), opening a fullscreen
           textarea mirroring that field for easier editing of long text. */
        const fsTriggerBtn = document.getElementById('fullscreen-edit-trigger');
        const fsOverlay = document.getElementById('fullscreen-editor-overlay');
        const fsBody = document.getElementById('fullscreen-editor-body');
        const fsCloseBtn = document.getElementById('fullscreen-editor-close');
        let activeEditField = null;

        function isFullscreenEligible(el) {
            return !!(el && el.matches && el.matches('input[type="text"], textarea'));
        }

        canvas.addEventListener('focusin', (e) => {
            if (isFullscreenEligible(e.target)) {
                activeEditField = e.target;
                fsTriggerBtn.style.display = 'flex';
            }
        });

        canvas.addEventListener('focusout', () => {
            setTimeout(() => {
                const overlayOpen = fsOverlay.style.display === 'flex';
                if (overlayOpen) return; // editing inside the fullscreen view, keep the trigger as-is
                if (document.activeElement === fsTriggerBtn) return;
                if (isFullscreenEligible(document.activeElement) && canvas.contains(document.activeElement)) {
                    activeEditField = document.activeElement;
                    return;
                }
                fsTriggerBtn.style.display = 'none';
                activeEditField = null;
            }, 120);
        });

        fsTriggerBtn.onclick = () => {
            if (activeEditField) openFullscreenEditor(activeEditField);
        };

        // On mobile, opening the keyboard shrinks/shifts the *visual* viewport
        // while position:fixed elements can stay anchored to the *layout*
        // viewport, making the button appear to jump. Track visualViewport
        // (when available) and reposition it to the actual visible top edge.
        if (window.visualViewport) {
            const repositionFsBtn = () => {
                const vv = window.visualViewport;
                fsTriggerBtn.style.top = (vv.offsetTop + 20) + 'px';
            };
            window.visualViewport.addEventListener('resize', repositionFsBtn);
            window.visualViewport.addEventListener('scroll', repositionFsBtn);
            repositionFsBtn();
        }

        function openFullscreenEditor(fieldEl) {
            fsBody.innerHTML = '';

            const ta = document.createElement('textarea');
            ta.value = fieldEl.value;
            ta.style.cssText = 'flex: 1; width: 100%; height: 100%; border: none; outline: none; resize: none; background: var(--bg-color); color: var(--text-bright); font-family: ui-monospace, "SF Mono", "JetBrains Mono", monospace; font-size: 16px; padding: 16px; line-height: 1.6; box-sizing: border-box;';
            fsBody.appendChild(ta);

            ta.addEventListener('input', () => {
                fieldEl.value = ta.value;
                fieldEl.dispatchEvent(new Event('input', { bubbles: true }));
            });

            // Mirror live "§" highlighting here too, if the small field has it.
            if (fieldEl.dataset.mcHighlighted) {
                attachMcHighlight(ta);
            }

            fsOverlay.style.display = 'flex';
            ta.focus();
        }

        function closeFullscreenEditor() {
            fsOverlay.style.display = 'none';
            if (activeEditField) activeEditField.focus();
        }
        fsCloseBtn.onclick = closeFullscreenEditor;
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && fsOverlay.style.display === 'flex') closeFullscreenEditor();
        });

        creditInput.addEventListener('focus', () => {
            if (creditInput.value === 'Nako Hikari') {
                creditInput.value = '';
            }
        });

        creditInput.addEventListener('blur', () => {
            if (creditInput.value.trim() === '') {
                creditInput.value = 'Nako Hikari';
            }
            compilerCoreEngine();
        });

        ['meta-title', 'meta-credit', 'meta-desc'].forEach(id => {
            document.getElementById(id).addEventListener('input', compilerCoreEngine);
        });

        function shiftBlockPosition(button, offsetDirection) {
            const currentBlock = button.closest('.group-block');
            
            if (offsetDirection === -1) {
                const targetSibling = currentBlock.previousElementSibling;
                if (targetSibling) {
                    currentBlock.style.transform = 'translateY(-10px)';
                    setTimeout(() => {
                        canvas.insertBefore(currentBlock, targetSibling);
                        currentBlock.style.transform = 'translateY(0)';
                        applyVisualFlashFeedback(currentBlock);
                    }, 80);
                }
            } else if (offsetDirection === 1) {
                const targetSibling = currentBlock.nextElementSibling;
                if (targetSibling) {
                    currentBlock.style.transform = 'translateY(10px)';
                    setTimeout(() => {
                        canvas.insertBefore(targetSibling, currentBlock);
                        currentBlock.style.transform = 'translateY(0)';
                        applyVisualFlashFeedback(currentBlock);
                    }, 80);
                }
            }
            compilerCoreEngine();
        }

        function shiftRowPosition(button, offsetDirection) {
            const currentRow = button.closest('.cmd-row-node');
            const stack = currentRow.parentNode;
            
            if (offsetDirection === -1) {
                const prevRow = currentRow.previousElementSibling;
                if (prevRow) {
                    currentRow.style.transform = 'translateY(-8px)';
                    setTimeout(() => {
                        stack.insertBefore(currentRow, prevRow);
                        currentRow.style.transform = 'translateY(0)';
                        applyVisualFlashFeedback(currentRow);
                        rebuildRowNumberingIndexes(stack);
                    }, 60);
                }
            } else if (offsetDirection === 1) {
                const nextRow = currentRow.nextElementSibling;
                if (nextRow) {
                    currentRow.style.transform = 'translateY(8px)';
                    setTimeout(() => {
                        stack.insertBefore(nextRow, currentRow);
                        currentRow.style.transform = 'translateY(0)';
                        applyVisualFlashFeedback(currentRow);
                        rebuildRowNumberingIndexes(stack);
                    }, 60);
                }
            }
        }

        function applyVisualFlashFeedback(domElement) {
            domElement.classList.add('block-moving-flash');
            setTimeout(() => {
                domElement.classList.remove('block-moving-flash');
            }, 400);
        }

        function rebuildRowNumberingIndexes(stackElement) {
            const allRows = stackElement.querySelectorAll('.cmd-row-node');
            allRows.forEach((row, i) => {
                row.querySelector('.row-index').innerText = i + 1;
            });
            compilerCoreEngine();
        }

        function confirmDeleteBlock(buttonEl) {
            const block = buttonEl.closest('.group-block');
            displayModal({
                title: 'Confirm Deletion',
                message: 'Are you sure you want to remove this element block?',
                actions: [
                    { label: 'Cancel', class: 'btn-secondary' },
                    {
                        label: 'Delete',
                        class: 'btn-danger',
                        onClick: () => {
                            block.remove();
                            compilerCoreEngine();
                        }
                    }
                ]
            });
        }

        function createStandardBlockHeader(titleText, belongsToGroup) {
            let addBtn = '';
            if (belongsToGroup === 'chain') {
                addBtn = `<button class="btn btn-sm" onclick="addCommandRowToGroup(this.closest('.group-block'))">+ Add Row</button>`;
            } else if (belongsToGroup === 'bullet') {
                addBtn = `<button class="btn btn-sm" onclick="addBulletItem(this.closest('.group-block'))">+ Add Item</button>`;
            }
            return `
                <div class="group-header">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="group-title">${titleText}</span>
                    </div>
                    <div class="block-action-cluster">
                        <button class="btn btn-sm btn-secondary" onclick="shiftBlockPosition(this, -1)">▲ Up</button>
                        <button class="btn btn-sm btn-secondary" onclick="shiftBlockPosition(this, 1)">▼ Down</button>
                        ${addBtn}
                        <button class="btn btn-sm btn-danger" onclick="confirmDeleteBlock(this)">Remove</button>
                    </div>
                </div>
            `;
        }

        function addChainGroup() {
            const group = document.createElement('div');
            group.className = 'group-block';
            group.dataset.itemType = 'chain-group';

            group.innerHTML = `
                ${createStandardBlockHeader('Command Block Group', 'chain')}
                <div class="bulk-paste-zone">
                    <label>Bulk Paste Multi-Line Split Input Tool</label>
                    <textarea placeholder="Paste lines of commands directly here. Each line auto-creates a linked sub-row entry block..." oninput="handleBulkPasteEngine(this)"></textarea>
                </div>
                <div class="connected-chain-stack"></div>
            `;

            canvas.appendChild(group);
            compilerCoreEngine();
            return group;
        }

        function addCommandRowToGroup(groupElement, targetCommandValue = '', config = {}) {
            const stack = groupElement.querySelector('.connected-chain-stack');
            const bulkBox = groupElement.querySelector('.bulk-paste-zone');
            
            if (bulkBox) bulkBox.style.display = 'none';

            const rowIndex = stack.children.length + 1;
            const rowNode = document.createElement('div');
            
            const mode = config.mode || 'C';
            const cond = config.cond || 'U';
            const active = config.active || 'AA';
            const tick = config.tick !== undefined ? config.tick : '0';

            rowNode.className = `cmd-row-node color-${mode.toLowerCase()}`;
            if (cond === 'C') rowNode.classList.add('cond-border');

            rowNode.innerHTML = `
                <div class="row-index-container">
                    <button class="row-nav-btn" onclick="shiftRowPosition(this, -1)">▲</button>
                    <div class="row-index">${rowIndex}</div>
                    <button class="row-nav-btn" onclick="shiftRowPosition(this, 1)">▼</button>
                </div>
                <div class="row-controls-line">
                    <div class="inline-selector-set">
                        <select class="row-mode" onchange="updateRowColorTheme(this)">
                            <option value="C" ${mode === 'C' ? 'selected' : ''}>C</option>
                            <option value="I" ${mode === 'I' ? 'selected' : ''}>I</option>
                            <option value="R" ${mode === 'R' ? 'selected' : ''}>R</option>
                            <option value="CHAT" ${mode === 'CHAT' ? 'selected' : ''}>CHAT</option>
                            <option value="NPC" ${mode === 'NPC' ? 'selected' : ''}>NPC</option>
                        </select>
                        <select class="row-cond" style="${(mode === 'CHAT' || mode === 'NPC') ? 'display:none;' : ''}" onchange="updateRowColorTheme(this)">
                            <option value="U" ${cond === 'U' ? 'selected' : ''}>UN</option>
                            <option value="C" ${cond === 'C' ? 'selected' : ''}>CN</option>
                        </select>
                        <select class="row-active" style="${(mode === 'CHAT' || mode === 'NPC') ? 'display:none;' : ''}" onchange="compilerCoreEngine()">
                            <option value="AA" ${active === 'AA' ? 'selected' : ''}>AA</option>
                            <option value="NR" ${active === 'NR' ? 'selected' : ''}>NR</option>
                        </select>
                        <input type="text" class="row-tick" style="${(mode === 'CHAT' || mode === 'NPC') ? 'display:none;' : ''}" value="${tick}" oninput="compilerCoreEngine()">
                    </div>
                    <button class="btn btn-sm btn-danger" style="padding: 2px 8px;" onclick="confirmRemoveRowNode(this)">X</button>
                </div>
                <div class="cmd-input-container">
                    ${mode === 'NPC' 
                        ? `<textarea class="cmd-input-field" placeholder="Enter multi-line code execution sequences..." oninput="compilerCoreEngine()">${targetCommandValue}</textarea>`
                        : `<input type="text" class="cmd-input-field" placeholder="Enter command string..." value="${targetCommandValue.replace(/"/g, '&quot;')}" oninput="compilerCoreEngine()">`
                    }
                </div>
            `;

            stack.appendChild(rowNode);
            if (mode === 'CHAT' || mode === 'NPC') {
                attachMcHighlight(rowNode.querySelector('.cmd-input-field'));
            }
            compilerCoreEngine();
            return rowNode;
        }

        function confirmRemoveRowNode(buttonEl) {
            displayModal({
                title: 'Confirm Deletion',
                message: 'Are you sure you want to remove this command row?',
                actions: [
                    { label: 'Cancel', class: 'btn-secondary' },
                    {
                        label: 'Delete',
                        class: 'btn-danger',
                        onClick: () => {
                            removeRowNodeElement(buttonEl);
                        }
                    }
                ]
            });
        }

        function removeRowNodeElement(buttonEl) {
            const stack = buttonEl.closest('.connected-chain-stack');
            const group = buttonEl.closest('.group-block');
            buttonEl.closest('.cmd-row-node').remove();

            const rows = stack.querySelectorAll('.cmd-row-node');
            if (rows.length === 0) {
                group.querySelector('.bulk-paste-zone').style.display = 'flex';
                group.querySelector('.bulk-paste-zone textarea').value = '';
            } else {
                rows.forEach((row, i) => { row.querySelector('.row-index').innerText = i + 1; });
            }
            compilerCoreEngine();
        }

        function handleBulkPasteEngine(textareaEl) {
            const lines = textareaEl.value.split('\n');
            const group = textareaEl.closest('.group-block');
            lines.forEach(line => {
                const clean = line.trim();
                if (clean) addCommandRowToGroup(group, clean);
            });
        }

        function updateRowColorTheme(selectEl) {
            const rowNode = selectEl.closest('.cmd-row-node');
            const type = rowNode.querySelector('.row-mode').value;
            const condSelect = rowNode.querySelector('.row-cond');
            const activeSelect = rowNode.querySelector('.row-active');
            const tickInput = rowNode.querySelector('.row-tick');
            const inputContainer = rowNode.querySelector('.cmd-input-container');
            
            const currentVal = rowNode.querySelector('.cmd-input-field').value;

            rowNode.className = 'cmd-row-node';
            rowNode.classList.add(`color-${type.toLowerCase()}`);

            if (type === 'NPC') {
                condSelect.style.display = 'none';
                activeSelect.style.display = 'none';
                tickInput.style.display = 'none';
                inputContainer.innerHTML = `<textarea class="cmd-input-field" placeholder="Enter multi-line code execution sequences..." oninput="compilerCoreEngine()">${currentVal}</textarea>`;
            } else if (type === 'CHAT') {
                condSelect.style.display = 'none';
                activeSelect.style.display = 'none';
                tickInput.style.display = 'none';
                inputContainer.innerHTML = `<input type="text" class="cmd-input-field" placeholder="Enter command string..." value="${currentVal.replace(/"/g, '&quot;')}" oninput="compilerCoreEngine()">`;
            } else {
                condSelect.style.display = '';
                activeSelect.style.display = '';
                tickInput.style.display = '';
                inputContainer.innerHTML = `<input type="text" class="cmd-input-field" placeholder="Enter command string..." value="${currentVal.replace(/"/g, '&quot;')}" oninput="compilerCoreEngine()">`;
                if (condSelect.value === 'C') rowNode.classList.add('cond-border');
            }

            if (type === 'CHAT' || type === 'NPC') {
                attachMcHighlight(inputContainer.querySelector('.cmd-input-field'));
            }

            compilerCoreEngine();
        }

        function addHeaderBlock(presetValue = '', tierPreset = 'H1') {
            const type = presetValue ? tierPreset : document.getElementById('header-type-selector').value;
            const block = document.createElement('div');
            block.className = 'group-block';
            block.dataset.itemType = 'header';
            block.dataset.headerTier = type;

            block.innerHTML = `
                ${createStandardBlockHeader(`Header Block Element (${type})`, 'standard')}
                <input type="text" class="header-input-val" placeholder="Enter layout header text label..." value="${presetValue.replace(/"/g, '&quot;')}" oninput="compilerCoreEngine()">
            `;
            canvas.appendChild(block);
            compilerCoreEngine();
            return block;
        }

        function addBodyTextBlock(presetValue = '') {
            const block = document.createElement('div');
            block.className = 'group-block';
            block.dataset.itemType = 'text';

            block.innerHTML = `
                ${createStandardBlockHeader('Plain Body Text Block (TEXT)', 'standard')}
                <textarea style="height: 60px; font-size: 13px; font-family: inherit; resize: vertical;" class="text-input-val" placeholder="Enter standard descriptive paragraph text content..." oninput="compilerCoreEngine()">${presetValue}</textarea>
            `;
            canvas.appendChild(block);
            attachMcHighlight(block.querySelector('.text-input-val'));
            compilerCoreEngine();
            return block;
        }

        function addNoteBlock(presetValue = '', presetColor = 'default') {
            const block = document.createElement('div');
            block.className = 'group-block';
            block.dataset.itemType = 'note';
            block.dataset.noteColor = presetColor;

            block.innerHTML = `
                ${createStandardBlockHeader('User Note Box (NOTE)', 'standard')}
                <div class="form-row">
                    <div class="form-group">
                        <label>Note Color</label>
                        <select class="note-color-select" onchange="updateNoteColor(this)">
                            <option value="default" ${presetColor === 'default' ? 'selected' : ''}>Default</option>
                            <option value="green" ${presetColor === 'green' ? 'selected' : ''}>Green</option>
                            <option value="red" ${presetColor === 'red' ? 'selected' : ''}>Red</option>
                            <option value="yellow" ${presetColor === 'yellow' ? 'selected' : ''}>Yellow</option>
                        </select>
                    </div>
                </div>
                <textarea class="note-input-val" style="height: 60px; font-size: 13px; font-family: inherit; resize: vertical;" placeholder="Enter gray dynamic italics info comment string... (supports multiple lines)" oninput="compilerCoreEngine()">${presetValue}</textarea>
            `;
            canvas.appendChild(block);
            attachMcHighlight(block.querySelector('.note-input-val'));
            compilerCoreEngine();
            return block;
        }

        function updateNoteColor(selectEl) {
            const block = selectEl.closest('.group-block');
            block.dataset.noteColor = selectEl.value;
            compilerCoreEngine();
        }

        function addBulletGroup() {
            const block = document.createElement('div');
            block.className = 'group-block';
            block.dataset.itemType = 'bullet-group';
            block.dataset.bulletStyle = 'dot';

            block.innerHTML = `
                ${createStandardBlockHeader('Bullet List Block (BULLET)', 'bullet')}
                <div class="form-row">
                    <div class="form-group">
                        <label>Bullet Style</label>
                        <select class="bullet-style-select" onchange="updateBulletStyle(this)">
                            <option value="dot">• Dot</option>
                            <option value="dash">- Dash</option>
                            <option value="num">1. Numeral</option>
                            <option value="abc">a. Alphabetic</option>
                        </select>
                    </div>
                </div>
                <div class="bullet-item-stack"></div>
            `;
            canvas.appendChild(block);
            addBulletItem(block);
            compilerCoreEngine();
            return block;
        }

        function addBulletItem(groupElement, presetValue = '') {
            const stack = groupElement.querySelector('.bullet-item-stack');
            const row = document.createElement('div');
            row.className = 'bullet-item-row';
            row.innerHTML = `
                <textarea class="bullet-item-val" placeholder="Enter bullet item text..." oninput="compilerCoreEngine()">${presetValue}</textarea>
                <button class="btn btn-sm btn-danger" onclick="removeBulletItem(this)">X</button>
            `;
            stack.appendChild(row);
            attachMcHighlight(row.querySelector('.bullet-item-val'));
            compilerCoreEngine();
            return row;
        }

        function removeBulletItem(buttonEl) {
            const stack = buttonEl.closest('.bullet-item-stack');
            const group = buttonEl.closest('.group-block');
            buttonEl.closest('.bullet-item-row').remove();

            // Never let a bullet block go fully empty — nothing to render on the parser side.
            if (stack.children.length === 0) {
                addBulletItem(group);
            } else {
                compilerCoreEngine();
            }
        }

        function updateBulletStyle(selectEl) {
            const block = selectEl.closest('.group-block');
            block.dataset.bulletStyle = selectEl.value;
            compilerCoreEngine();
        }

        // Manual line-break token: real newlines can't be used here since blank lines
        // separate blocks in the raw output; the parser turns this into a <br>.
        const LINE_BREAK_TOKEN = '[[br]]';
        let lastFocusedField = null;

        document.addEventListener('focusin', (e) => {
            if (e.target.matches && e.target.matches('.text-input-val, .note-input-val, .bullet-item-val')) {
                lastFocusedField = e.target;
            }
        });

        function insertLineBreak() {
            const count = parseInt(document.getElementById('linebreak-count-selector').value, 10) || 1;
            const field = lastFocusedField;

            if (!field || !document.body.contains(field)) {
                displayModal({
                    title: 'No Field Selected',
                    message: 'Click into a Body Text, Note, or Bullet Item field first, then press this button again to insert a line break at your cursor.',
                    actions: [{ label: 'OK' }]
                });
                return;
            }

            const token = LINE_BREAK_TOKEN.repeat(count);
            const start = field.selectionStart ?? field.value.length;
            const end = field.selectionEnd ?? field.value.length;
            field.value = field.value.slice(0, start) + token + field.value.slice(end);
            const newPos = start + token.length;
            field.focus();
            field.setSelectionRange(newPos, newPos);
            compilerCoreEngine();
        }

        function addLinkBlock(presetTitle = '', presetUrl = '') {
            const block = document.createElement('div');
            block.className = 'group-block';
            block.dataset.itemType = 'link-group';

            block.innerHTML = `
                ${createStandardBlockHeader('Link Element (LINK)', 'standard')}
                <div class="form-row">
                    <div class="form-group">
                        <label>Pressable Link Title</label>
                        <input type="text" class="link-title-val" placeholder="Enter the text that users click..." value="${presetTitle.replace(/"/g, '&quot;')}" oninput="compilerCoreEngine()">
                    </div>
                    <div class="form-group">
                        <label>Actual Link URL</label>
                        <input type="text" class="link-url-val" placeholder="https://..." value="${presetUrl.replace(/"/g, '&quot;')}" oninput="compilerCoreEngine()">
                    </div>
                </div>
            `;
            canvas.appendChild(block);
            compilerCoreEngine();
            return block;
        }

        function addImageBlock(presetUrl = '') {
            const block = document.createElement('div');
            block.className = 'group-block';
            block.dataset.itemType = 'img-group';

            block.innerHTML = `
                ${createStandardBlockHeader('Image Asset Link (IMG)', 'standard')}
                <input type="text" class="img-url-val" placeholder="Enter image URL or raw GitHub asset string..." value="${presetUrl.replace(/"/g, '&quot;')}" oninput="compilerCoreEngine()">
            `;
            canvas.appendChild(block);
            compilerCoreEngine();
            return block;
        }

        function addEmbedBlock(presetUrl = '') {
            const block = document.createElement('div');
            block.className = 'group-block';
            block.dataset.itemType = 'embed-group';

            block.innerHTML = `
                ${createStandardBlockHeader('Video Embed Resource (EMBED)', 'standard')}
                <input type="text" class="embed-url-val" placeholder="Enter the source video file or hosting URL string..." value="${presetUrl.replace(/"/g, '&quot;')}" oninput="compilerCoreEngine()">
            `;
            canvas.appendChild(block);
            compilerCoreEngine();
            return block;
        }

        function openEditImportModal() {
            displayCustomModal({
                title: 'Import Creation Payload',
                htmlContent: `
                    <label>Paste your raw string payload below:</label>
                    <textarea id="edit-import-textarea" style="height: 140px; font-size: 12px;" placeholder="Paste output formatted raw string here..."></textarea>
                `,
                actions: [
                    { label: 'Cancel', class: 'btn-secondary' },
                    {
                        label: 'Process Raw String',
                        class: 'btn',
                        onClick: () => {
                            const raw = document.getElementById('edit-import-textarea').value;
                            if (!raw.trim()) return;
                            confirmOverwriteExistingData(raw);
                        }
                    }
                ]
            });
        }

        function confirmOverwriteExistingData(rawText) {
            displayModal({
                title: 'Overwrite Warning',
                message: 'Continuing will completely overwrite your current work in progress. Are you sure you want to replace it?',
                actions: [
                    {
                        label: 'Go Back',
                        class: 'btn-secondary',
                        onClick: () => {
                            openEditImportModal();
                        }
                    },
                    {
                        label: 'Yes, Overwrite',
                        class: 'btn-danger',
                        onClick: () => {
                            executeRawStringImport(rawText);
                        }
                    }
                ]
            });
        }

        function executeRawStringImport(rawText) {
            canvas.innerHTML = '';
            document.getElementById('meta-title').value = '';
            document.getElementById('meta-desc').value = '';
            document.getElementById('meta-credit').value = 'Nako Hikari';
            
            const checkboxes = document.querySelectorAll('#tag-checkbox-list input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = false);

            const blocks = rawText.split(/\n\s*\n/);
            let activeChainGroup = null;

            blocks.forEach(block => {
                const trimmed = block.trim();
                if (!trimmed) return;

                const lines = trimmed.split('\n');

                if (lines[0].startsWith('credit :')) {
                    document.getElementById('meta-credit').value = lines[0].replace('credit :', '').trim() || 'Nako Hikari';
                    return;
                }

                let isMetaBlock = false;
                lines.forEach(line => {
                    if (line.startsWith('TITLE:')) {
                        document.getElementById('meta-title').value = line.replace('TITLE:', '').trim();
                        isMetaBlock = true;
                    } else if (line.startsWith('DESC:')) {
                        document.getElementById('meta-desc').value = line.replace('DESC:', '').trim();
                        isMetaBlock = true;
                    } else if (line.startsWith('TAG:')) {
                        const tags = line.replace('TAG:', '').split(',').map(t => t.trim());
                        checkboxes.forEach(cb => {
                            if (tags.includes(cb.value)) cb.checked = true;
                        });
                        isMetaBlock = true;
                    }
                });
                if (isMetaBlock) return;

                if (/^H[1-4]:/.test(trimmed)) {
                    activeChainGroup = null;
                    const tier = trimmed.match(/^H[1-4]/)[0];
                    addHeaderBlock(trimmed.replace(new RegExp('^' + tier + ':'), '').trim(), tier);
                } else if (trimmed.startsWith('TEXT:')) {
                    activeChainGroup = null;
                    addBodyTextBlock(trimmed.replace('TEXT:', '').trim());
                } else if (/^NOTE\b/i.test(trimmed)) {
                    activeChainGroup = null;
                    const noteMatch = trimmed.match(/^NOTE(?:\s*:\s*(GREEN|RED|YELLOW))?\s*:\s*([\s\S]*)$/i);
                    const noteColor = (noteMatch && noteMatch[1]) ? noteMatch[1].toLowerCase() : 'default';
                    const noteText = noteMatch ? noteMatch[2] : '';
                    addNoteBlock(noteText, noteColor);
                } else if (/^BULLET:/i.test(trimmed)) {
                    activeChainGroup = null;
                    const styleMatch = trimmed.match(/^BULLET:(\w+)/i);
                    const style = styleMatch ? styleMatch[1].toLowerCase() : 'dot';
                    const group = addBulletGroup();
                    group.dataset.bulletStyle = style;
                    const styleSelect = group.querySelector('.bullet-style-select');
                    if (styleSelect) styleSelect.value = style;
                    const stack = group.querySelector('.bullet-item-stack');
                    stack.innerHTML = '';
                    lines.slice(1).forEach(ln => { if (ln.trim()) addBulletItem(group, ln); });
                    if (stack.children.length === 0) addBulletItem(group);
                } else if (trimmed.startsWith('[link]')) {
                    activeChainGroup = null;
                    const match = trimmed.match(/\[link\]\[(.*?)\]\((.*?)\)/);
                    if (match) addLinkBlock(match[1], match[2]);
                } else if (trimmed.startsWith('[img]')) {
                    activeChainGroup = null;
                    const match = trimmed.match(/\[img\]\((.*?)\)/);
                    if (match) addImageBlock(match[1]);
                } else if (trimmed.startsWith('[embed]')) {
                    activeChainGroup = null;
                    const match = trimmed.match(/\[embed\]\((.*?)\)/);
                    if (match) addEmbedBlock(match[1]);
                } else if (trimmed.startsWith('CMD:')) {
                    if (!activeChainGroup) {
                        activeChainGroup = addChainGroup();
                    }
                    
                    for (let i = 0; i < lines.length; i += 2) {
                        if (lines[i] && lines[i].startsWith('CMD:')) {
                            const headerParts = lines[i].split(':');
                            const cmdVal = lines[i + 1] || '';
                            const mode = headerParts[1] || 'C';

                            if (mode === 'NPC' || mode === 'CHAT') {
                                addCommandRowToGroup(activeChainGroup, cmdVal, { mode });
                            } else {
                                const active = headerParts[2] || 'AA';
                                const cond = headerParts[3] || 'U';
                                const tick = headerParts[4] || '0';
                                addCommandRowToGroup(activeChainGroup, cmdVal, { mode, cond, active, tick });
                            }
                        }
                    }
                }
            });

            compilerCoreEngine();
        }

        function compilerCoreEngine() {
            let sections = [];

            const creditVal = document.getElementById('meta-credit').value.trim() || 'Nako Hikari';
            sections.push(`credit : ${creditVal}`);

            const title = document.getElementById('meta-title').value.trim();
            const desc = document.getElementById('meta-desc').value.trim();
            const checkedBoxes = document.querySelectorAll('#tag-checkbox-list input:checked');
            const tagsArr = Array.from(checkedBoxes).map(cb => cb.value);

            let metaBlock = '';
            if (title) metaBlock += `TITLE: ${title}\n`;
            if (desc)  metaBlock += `DESC: ${desc}\n`;
            if (tagsArr.length > 0)  metaBlock += `TAG: ${tagsArr.join(',')}\n`;
            
            if (metaBlock) sections.push(metaBlock.trim());

            const elements = canvas.children;
            for (let i = 0; i < elements.length; i++) {
                const el = elements[i];
                const type = el.dataset.itemType;

                if (type === 'header') {
                    const tier = el.dataset.headerTier;
                    const val = el.querySelector('.header-input-val').value.trim();
                    if (val) sections.push(`${tier}: ${val}`);
                } 
                else if (type === 'text') {
                    const val = el.querySelector('.text-input-val').value.trim();
                    if (val) sections.push(`TEXT: ${val}`);
                }
                else if (type === 'note') {
                    const val = el.querySelector('.note-input-val').value.trim();
                    const color = el.dataset.noteColor || 'default';
                    if (val) {
                        sections.push(color === 'default' ? `NOTE: ${val}` : `NOTE:${color.toUpperCase()}: ${val}`);
                    }
                }
                else if (type === 'bullet-group') {
                    const style = el.dataset.bulletStyle || 'dot';
                    const items = Array.from(el.querySelectorAll('.bullet-item-val'))
                        .map(t => t.value.trim())
                        .filter(v => v.length > 0);
                    if (items.length > 0) {
                        sections.push(`BULLET:${style}\n` + items.join('\n'));
                    }
                }
                else if (type === 'link-group') {
                    const textTitle = el.querySelector('.link-title-val').value.trim();
                    const targetUrl = el.querySelector('.link-url-val').value.trim();
                    sections.push(`[link][${textTitle}](${targetUrl})`);
                }
                else if (type === 'img-group') {
                    const targetUrl = el.querySelector('.img-url-val').value.trim();
                    sections.push(`[img](${targetUrl})`);
                }
                else if (type === 'embed-group') {
                    const targetUrl = el.querySelector('.embed-url-val').value.trim();
                    sections.push(`[embed](${targetUrl})`);
                }
                else if (type === 'chain-group') {
                    let groupOutput = '';
                    const rows = el.querySelectorAll('.cmd-row-node');
                    rows.forEach(row => {
                        const m = row.querySelector('.row-mode').value;
                        const cmd = row.querySelector('.cmd-input-field').value.trim();

                        if (m === 'NPC' || m === 'CHAT') {
                            groupOutput += `CMD:${m}\n${cmd}\n`;
                        } else {
                            const c = row.querySelector('.row-cond').value;
                            const a = row.querySelector('.row-active').value;
                            const t = row.querySelector('.row-tick').value.trim() || '0';
                            groupOutput += `CMD:${m}:${a}:${c}:${t}\n${cmd}\n`;
                        }
                    });

                    if (groupOutput) sections.push(groupOutput.trim());
                }
            }

            document.getElementById('raw-string-output').innerText = sections.join('\n\n');
        }

        /* Modal Helper Utility */
        function displayModal({ title, message, actions }) {
            const overlay = document.getElementById('app-modal-overlay');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');
            const modalActions = document.getElementById('modal-actions');

            modalTitle.innerText = title;
            modalBody.innerText = message;
            modalActions.innerHTML = '';

            actions.forEach(act => {
                const btn = document.createElement('button');
                btn.className = `btn ${act.class || ''}`;
                btn.innerText = act.label;
                btn.onclick = () => {
                    hideModal();
                    if (act.onClick) act.onClick();
                };
                modalActions.appendChild(btn);
            });

            overlay.classList.add('active');
        }

        function displayCustomModal({ title, htmlContent, actions }) {
            const overlay = document.getElementById('app-modal-overlay');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');
            const modalActions = document.getElementById('modal-actions');

            modalTitle.innerText = title;
            modalBody.innerHTML = htmlContent;
            modalActions.innerHTML = '';

            actions.forEach(act => {
                const btn = document.createElement('button');
                btn.className = `btn ${act.class || ''}`;
                btn.innerText = act.label;
                btn.onclick = () => {
                    hideModal();
                    if (act.onClick) act.onClick();
                };
                modalActions.appendChild(btn);
            });

            overlay.classList.add('active');
        }

        function hideModal() {
            document.getElementById('app-modal-overlay').classList.remove('active');
        }

        /* UPLOAD FLOW LOGIC */
        function uploadContent() {
            const creditField = document.getElementById('meta-credit');
            const currentCredit = creditField.value.trim();

            if (currentCredit === 'Nako Hikari') {
                displayModal({
                    title: 'Credit is still unchanged',
                    message: 'Your credit is still set to Nako Hikari. Continuing will result in this creation being credited to Nako Hikari.',
                    actions: [
                        {
                            label: 'Change credit',
                            class: 'btn-secondary',
                            onClick: () => {
                                creditField.focus();
                            }
                        },
                        {
                            label: 'Proceed',
                            onClick: () => {
                                showGeneralConfirmation();
                            }
                        }
                    ]
                });
            } else {
                showGeneralConfirmation();
            }
        }

        function showGeneralConfirmation() {
            displayModal({
                title: 'Confirm Upload',
                message: 'Make sure everything is correct before uploading. You will not be able to edit the submission after uploading.',
                actions: [
                    {
                        label: 'Let me check',
                        class: 'btn-secondary'
                    },
                    {
                        label: 'Upload',
                        onClick: () => {
                            executeUploadRequest();
                        }
                    }
                ]
            });
        }

        async function executeUploadRequest() {
            const outputText = document.getElementById('raw-string-output').innerText;
            const creditVal = document.getElementById('meta-credit').value.trim() || 'Nako Hikari';

            try {
                const response = await fetch("/api/upload", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        content: outputText,
                        author: creditVal
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned HTTP status ${response.status}`);
                }

                const result = await response.json();

                displayModal({
                    title: 'Upload Successful',
                    message: 'Command creation is on review and will show on the main page after approval.',
                    actions: [
                        { label: 'OK' }
                    ]
                });
            } catch (error) {
                displayModal({
                    title: 'Upload Failed',
                    message: 'Upload failed: ' + error.message,
                    actions: [
                        { label: 'Close', class: 'btn-danger' }
                    ]
                });
            }
        }

        function confirmBackToMain() {
            displayModal({
                title: 'Leave Formatter?',
                message: 'Are you sure going back to main page? Your progress will be reset.',
                actions: [
                    { label: 'No, stay here', class: 'btn-secondary' },
                    { label: 'Yes', class: 'btn-danger', onClick: () => { window.location.href = '../index.html'; } }
                ]
            });
        }

        // Best-effort interception of the phone's own back button/gesture:
        // keep a dummy history entry on top so a back-press triggers popstate
        // instead of actually navigating, then re-push it and show the same
        // confirm dialog. Not airtight on every mobile browser (e.g. iOS
        // Safari's edge-swipe can occasionally bypass this), but covers the
        // common case. Skipped once when returning from a Preview trip,
        // since that's an expected round-trip, not a "leave formatter" action.
        history.pushState({ nakoFormatterGuard: true }, '', location.href);
        window.addEventListener('popstate', () => {
            history.pushState({ nakoFormatterGuard: true }, '', location.href);
            if (sessionStorage.getItem('nako_skip_back_guard_once') === '1') {
                sessionStorage.removeItem('nako_skip_back_guard_once');
                return;
            }
            if (fsOverlay.style.display === 'flex') {
                closeFullscreenEditor();
                return;
            }
            confirmBackToMain();
        });

        function previewCreation() {
            const outputText = document.getElementById('raw-string-output').innerText;
            if (!outputText || outputText.startsWith('Your output')) {
                displayModal({
                    title: 'Nothing to Preview',
                    message: 'Add some content first, then press Preview again.',
                    actions: [{ label: 'OK' }]
                });
                return;
            }
            sessionStorage.setItem('nako_preview_payload', outputText);
            sessionStorage.setItem('nako_skip_back_guard_once', '1');
            window.location.href = '../index.html#preview';
        }

        function copyOutputToClipboard() {
            const rawText = document.getElementById('raw-string-output').innerText;
            navigator.clipboard.writeText(rawText).then(() => {
                displayModal({
                    title: 'Copied!',
                    message: 'Output string copied to clipboard successfully.',
                    actions: [{ label: 'OK' }]
                });
            }).catch(err => {
                displayModal({
                    title: 'Copy Failed',
                    message: 'Failed to copy output string: ' + err,
                    actions: [{ label: 'Close', class: 'btn-danger' }]
                });
            });
        }

        function exportAsTxtFile() {
            const rawText = document.getElementById('raw-string-output').innerText;
            const titleInput = document.getElementById('meta-title').value.trim();
            
            const filename = titleInput ? titleInput.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_chain.txt' : 'command_chain_output.txt';
            const blob = new Blob([rawText], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement("a");
            
            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        addChainGroup();
    </script>
</body>
